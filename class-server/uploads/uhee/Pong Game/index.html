<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purr Pong — 猫猫碰碰球</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-container">
    <canvas id="game" width="800" height="500"></canvas>

    <!-- HUD -->
    <div id="hud">
        <div class="hud-side hud-left">
            <span class="hud-icon">🍓</span>
            <span id="score1" class="hud-score">0</span>
            <span class="hud-label">Player 1</span>
        </div>
        <div class="hud-center">
            <button id="btn-pause" class="btn-sm">⏸</button>
            <button id="btn-restart" class="btn-sm">🔄</button>
            <button id="btn-settings" class="btn-sm">⚙</button>
        </div>
        <div class="hud-side hud-right">
            <span class="hud-icon">🫐</span>
            <span id="score2" class="hud-score">0</span>
            <span class="hud-label">Player 2</span>
        </div>
    </div>

    <!-- Menu Overlay -->
    <div id="overlay-menu" class="overlay">
        <div class="menu-box">
            <div class="menu-cats">
                <span class="cat-left">🐱</span>
                <span class="cat-right">🐱</span>
            </div>
            <h1 class="menu-title">Purr Pong</h1>
            <p class="menu-subtitle">猫猫碰碰球</p>
            <div class="menu-buttons">
                <button id="btn-2p" class="btn-main btn-pink">双人对战</button>
                <button id="btn-ai" class="btn-main btn-blue">人机对战</button>
            </div>
            <div id="difficulty-select" class="difficulty-select" style="display:none;">
                <p class="diff-label">选择难度</p>
                <div class="diff-buttons">
                    <button class="btn-diff" data-diff="easy">Easy</button>
                    <button class="btn-diff" data-diff="medium">Medium</button>
                    <button class="btn-diff" data-diff="hard">Hard</button>
                </div>
                <button id="btn-diff-back" class="btn-back">← 返回</button>
            </div>
            <div class="menu-controls">
                <div class="ctrl-group">
                    <span class="ctrl-key">W</span>
                    <span class="ctrl-key">S</span>
                    <span class="ctrl-desc">P1 上下</span>
                </div>
                <div class="ctrl-group">
                    <span class="ctrl-key">↑</span>
                    <span class="ctrl-key">↓</span>
                    <span class="ctrl-desc">P2 上下</span>
                </div>
            </div>
            <p class="menu-hint">Space 暂停</p>
        </div>
    </div>

    <!-- Countdown Overlay -->
    <div id="overlay-countdown" class="overlay" style="display:none;">
        <div id="countdown-number">3</div>
    </div>

    <!-- Pause Overlay -->
    <div id="overlay-pause" class="overlay" style="display:none;">
        <div class="pause-box">
            <h2>暂停中</h2>
            <button id="btn-resume" class="btn-main btn-pink">继续游戏</button>
            <button id="btn-quit" class="btn-main btn-ghost">返回菜单</button>
        </div>
    </div>

    <!-- Game Over Overlay -->
    <div id="overlay-gameover" class="overlay" style="display:none;">
        <div class="gameover-box">
            <div id="winner-text" class="winner-text">Player 1 获胜！</div>
            <div id="winner-cat" class="winner-cat"></div>
            <div class="final-score">
                <span class="fs-left">🍓 <span id="fs1">0</span></span>
                <span class="fs-divider">:</span>
                <span class="fs-right"><span id="fs2">0</span> 🫐</span>
            </div>
            <div id="game-time" class="game-time">用时 00:00</div>
            <div class="gameover-buttons">
                <button id="btn-replay" class="btn-main btn-pink">再来一局</button>
                <button id="btn-menu" class="btn-main btn-ghost">返回菜单</button>
            </div>
        </div>
    </div>

    <!-- Settings Overlay -->
    <div id="overlay-settings" class="overlay" style="display:none;">
        <div class="settings-box">
            <h2 class="settings-title">⚙ 设置</h2>
            <div class="settings-section">
                <div class="setting-row">
                    <label class="setting-label">🔊 音量</label>
                    <input type="range" id="set-volume" class="slider" min="0" max="100" value="70">
                    <span id="vol-val" class="setting-val">70%</span>
                </div>
                <div class="setting-row">
                    <label class="setting-label">🏓 球速</label>
                    <input type="range" id="set-speed" class="slider" min="50" max="200" value="100">
                    <span id="spd-val" class="setting-val">1.0x</span>
                </div>
                <div class="setting-row">
                    <label class="setting-label">🖐 球拍大小</label>
                    <input type="range" id="set-paddle" class="slider" min="60" max="130" value="100">
                    <span id="pad-val" class="setting-val">100%</span>
                </div>
                <div class="setting-row">
                    <label class="setting-label">🏆 获胜分数</label>
                    <input type="range" id="set-winscore" class="slider" min="3" max="15" value="7">
                    <span id="win-val" class="setting-val">7</span>
                </div>
                <div class="setting-row setting-toggle">
                    <label class="setting-label">🔔 音效</label>
                    <button id="set-sound" class="toggle-btn on">ON</button>
                </div>
                <div class="setting-row setting-toggle">
                    <label class="setting-label">🎵 背景音乐</label>
                    <button id="set-bgm" class="toggle-btn on">ON</button>
                </div>
                <div class="setting-row setting-toggle">
                    <label class="setting-label">✨ 粒子特效</label>
                    <button id="set-particles" class="toggle-btn on">ON</button>
                </div>
            </div>
            <div class="settings-buttons">
                <button id="btn-reset-defaults" class="btn-settings-secondary">恢复默认</button>
                <button id="btn-close-settings" class="btn-main btn-pink">返回</button>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
