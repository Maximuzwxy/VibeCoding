<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通讯录 - Flat Design</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: #ECF0F1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .app-layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 240px;
            background: #2C3E50;
            padding: 24px 0;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 20px;
            margin-bottom: 32px;
        }

        .logo {
            width: 36px;
            height: 36px;
            background: #3498DB;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo svg { width: 20px; height: 20px; }

        .sidebar-title {
            font-size: 18px;
            font-weight: 600;
            color: #ECF0F1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            color: #95A5A6;
            text-decoration: none;
            transition: all 0.2s;
        }

        .nav-item:hover, .nav-item.active {
            background: #34495E;
            color: #ECF0F1;
        }

        .nav-item svg { width: 20px; height: 20px; }

        .main-content {
            flex: 1;
            padding: 32px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .page-title {
            font-size: 26px;
            font-weight: 600;
            color: #2C3E50;
        }

        .search-bar input {
            padding: 12px 16px;
            border: 2px solid #BDC3C7;
            border-radius: 8px;
            font-size: 14px;
            color: #2C3E50;
            background: #FDFEFE;
            width: 280px;
        }

        .search-bar input::placeholder { color: #95A5A6; }
        .search-bar input:focus { outline: none; border-color: #3498DB; }

        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .contact-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 20px;
            background: #FFFFFF;
            border-radius: 10px;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #3498DB;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }

        .contact-info { flex: 1; }

        .contact-name {
            font-size: 15px;
            font-weight: 600;
            color: #2C3E50;
            margin-bottom: 3px;
        }

        .contact-status {
            font-size: 13px;
            color: #7F8C8D;
        }

        .online-dot {
            width: 10px;
            height: 10px;
            background: #2ECC71;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg viewBox="0 0 48 48" fill="none">
                        <path d="M16 20C16 17.79 17.79 16 20 16H28C30.21 16 32 17.79 32 20V28C32 30.21 30.21 32 28 32H20C17.79 32 16 30.21 16 28V20Z" fill="white"/>
                    </svg>
                </div>
                <span class="sidebar-title">Social</span>
            </div>

            <nav>
                <a href="#" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span>聊天</span>
                </a>
                <a href="#" class="nav-item active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                    <span>通讯录</span>
                </a>
                <a href="#" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                    </svg>
                    <span>朋友圈</span>
                </a>
                <a href="#" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                    <span>设置</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1 class="page-title">通讯录</h1>
                <div class="search-bar">
                    <input type="text" placeholder="搜索联系人...">
                </div>
            </div>

            <div class="contact-list">
                <div class="contact-card">
                    <div class="avatar">李</div>
                    <div class="contact-info">
                        <div class="contact-name">李明</div>
                        <div class="contact-status">在线</div>
                    </div>
                    <div class="online-dot"></div>
                </div>
                <div class="contact-card">
                    <div class="avatar">王</div>
                    <div class="contact-info">
                        <div class="contact-name">王小红</div>
                        <div class="contact-status">最后在线 5 分钟前</div>
                    </div>
                </div>
                <div class="contact-card">
                    <div class="avatar">张</div>
                    <div class="contact-info">
                        <div class="contact-name">张伟</div>
                        <div class="contact-status">在线</div>
                    </div>
                    <div class="online-dot"></div>
                </div>
                <div class="contact-card">
                    <div class="avatar">陈</div>
                    <div class="contact-info">
                        <div class="contact-name">陈思思</div>
                        <div class="contact-status">离线</div>
                    </div>
                </div>
                <div class="contact-card">
                    <div class="avatar">刘</div>
                    <div class="contact-info">
                        <div class="contact-name">刘强</div>
                        <div class="contact-status">在线</div>
                    </div>
                    <div class="online-dot"></div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
