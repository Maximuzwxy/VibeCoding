<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Pong</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 开始画面 -->
    <div id="startScreen">
        <h1>PONG</h1>
        <p class="subtitle">Classic Arcade Game</p>
        <button id="startBtn">START GAME</button>
        <p class="controls-hint">Left Player: W / S | Right Player: ↑ / ↓ | Space: Pause</p>
    </div>

    <!-- 游戏画布 -->
    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <!-- 模式选择 -->
    <div id="modePanel">
        <div class="mode-group">
            <span class="mode-label">Left Player</span>
            <div class="mode-buttons">
                <button id="leftHuman" class="mode-btn active">Human</button>
                <button id="leftAI" class="mode-btn">AI</button>
            </div>
        </div>
        <div class="mode-group">
            <span class="mode-label">Right Player</span>
            <div class="mode-buttons">
                <button id="rightHuman" class="mode-btn active">Human</button>
                <button id="rightAI" class="mode-btn">AI</button>
            </div>
        </div>
    </div>

    <!-- 控制栏 -->
    <div id="controlBar">
        <button id="btnStart">Start</button>
        <button id="btnPause">Pause</button>
        <button id="btnRestart">Restart</button>
        <button id="btnSettings">Settings</button>
    </div>

    <!-- 设置面板 -->
    <div id="settingsOverlay">
        <div id="settingsPanel">
            <h2>Settings</h2>

            <div class="settings-section">
                <h3>Buff Settings</h3>
                <div class="setting-row">
                    <div class="setting-info">
                        <label>Buff Frequency</label>
                        <span class="tooltip" data-tip="How often buff blocks appear. 0 = no buffs, 5 = very frequent.">?</span>
                    </div>
                    <div class="setting-control">
                        <input type="range" id="setBuffFreq" min="0" max="5" step="0.5" value="3">
                        <span class="setting-value" id="valBuffFreq">3</span>
                    </div>
                </div>
            </div>

            <div class="settings-section">
                <h3>Ball Settings</h3>
                <div class="setting-row">
                    <div class="setting-info">
                        <label>Base Speed</label>
                        <span class="tooltip" data-tip="Initial ball speed when reset to center.">?</span>
                    </div>
                    <div class="setting-control">
                        <input type="range" id="setBallBaseSpeed" min="3" max="10" step="0.5" value="5">
                        <span class="setting-value" id="valBallBaseSpeed">5</span>
                    </div>
                </div>
                <div class="setting-row">
                    <div class="setting-info">
                        <label>Min Speed</label>
                        <span class="tooltip" data-tip="Ball speed will not drop below this value.">?</span>
                    </div>
                    <div class="setting-control">
                        <input type="range" id="setBallMinSpeed" min="2" max="8" step="0.5" value="3">
                        <span class="setting-value" id="valBallMinSpeed">3</span>
                    </div>
                </div>
                <div class="setting-row">
                    <div class="setting-info">
                        <label>Max Speed</label>
                        <span class="tooltip" data-tip="Ball speed will not exceed this value.">?</span>
                    </div>
                    <div class="setting-control">
                        <input type="range" id="setBallMaxSpeed" min="8" max="20" step="0.5" value="10">
                        <span class="setting-value" id="valBallMaxSpeed">10</span>
                    </div>
                </div>
                <div class="setting-row">
                    <div class="setting-info">
                        <label>Speed Increment</label>
                        <span class="tooltip" data-tip="Speed increase added to the ball after each paddle hit.">?</span>
                    </div>
                    <div class="setting-control">
                        <input type="range" id="setBallSpeedInc" min="0.05" max="0.5" step="0.05" value="0.15">
                        <span class="setting-value" id="valBallSpeedInc">0.15</span>
                    </div>
                </div>
            </div>

            <div class="settings-section">
                <h3>Paddle Settings</h3>
                <div class="setting-row">
                    <div class="setting-info">
                        <label>Min Length</label>
                        <span class="tooltip" data-tip="Shortest allowed paddle length (pixels).">?</span>
                    </div>
                    <div class="setting-control">
                        <input type="range" id="setPaddleMin" min="20" max="80" step="5" value="40">
                        <span class="setting-value" id="valPaddleMin">40</span>
                    </div>
                </div>
                <div class="setting-row">
                    <div class="setting-info">
                        <label>Max Length</label>
                        <span class="tooltip" data-tip="Longest allowed paddle length (pixels).">?</span>
                    </div>
                    <div class="setting-control">
                        <input type="range" id="setPaddleMax" min="80" max="200" step="5" value="120">
                        <span class="setting-value" id="valPaddleMax">120</span>
                    </div>
                </div>
                <div class="setting-row">
                    <div class="setting-info">
                        <label>Buff Size Multiplier</label>
                        <span class="tooltip" data-tip="How much the Enlarge/Shrink buffs change paddle size.">?</span>
                    </div>
                    <div class="setting-control">
                        <input type="range" id="setBuffMult" min="1.1" max="3.0" step="0.1" value="1.6">
                        <span class="setting-value" id="valBuffMult">1.6</span>
                    </div>
                </div>
            </div>

            <div class="settings-buttons">
                <button id="btnSaveSettings">Save & Resume</button>
                <button id="btnCancelSettings">Cancel</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
