<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Little Prince - Colorful Paragraphs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>The Little Prince</h1>
        
        <div class="instructions">
            <p>Click the buttons below to randomly change text colors or background colors of the paragraphs. 
            The system ensures text remains readable by avoiding identical text and background colors.</p>
        </div>
        
        <div class="controls">
            <button id="textColorBtn">Change Text Color</button>
            <button id="bgColorBtn">Change Background Color</button>
        </div>
        
        <div id="content">
            <!-- Paragraphs will be inserted here by JavaScript -->
        </div>
        
        <div class="footer">
            <p>Excerpts from "The Little Prince" by Antoine de Saint-Exupéry</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
