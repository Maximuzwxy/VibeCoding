<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Dark Mode</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0f;
            font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 0 24px;
        }

        .header {
            text-align: center;
            margin-bottom: 48px;
        }

        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #00d4ff, #7b2ff7);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(123, 47, 247, 0.4);
        }

        .logo svg { width: 36px; height: 36px; }

        h1 {
            color: #fff;
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
        }

        .form-card {
            background: #13131a;
            border: 1px solid #1f1f2e;
            border-radius: 20px;
            padding: 32px;
        }

        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block;
            color: #9ca3af;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px;
            background: #0a0a0f;
            border: 1px solid #1f1f2e;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .input-wrapper input::placeholder { color: #4b5563; }

        .input-wrapper input:focus {
            outline: none;
            border-color: #7b2ff7;
            box-shadow: 0 0 0 3px rgba(123, 47, 247, 0.15);
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00d4ff, #7b2ff7);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(123, 47, 247, 0.3);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(123, 47, 247, 0.5);
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            color: #6b7280;
            font-size: 14px;
        }

        .footer a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: 500;
        }

        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="header">
            <div class="logo">
                <svg viewBox="0 0 48 48" fill="none">
                    <circle cx="24" cy="24" r="24" fill="url(#grad)"/>
                    <path d="M16 20C16 17.79 17.79 16 20 16H28C30.21 16 32 17.79 32 20V28C32 30.21 30.21 32 28 32H20C17.79 32 16 30.21 16 28V20Z" fill="white"/>
                    <defs><linearGradient id="grad" x1="0" y1="0" x2="48" y2="48"><stop offset="0%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#7b2ff7"/></linearGradient></defs>
                </svg>
            </div>
            <h1>欢迎回来</h1>
            <p class="subtitle">登录到您的账户</p>
        </div>

        <div class="form-card">
            <form>
                <div class="form-group">
                    <label>用户名</label>
                    <div class="input-wrapper">
                        <input type="text" placeholder="请输入用户名">
                    </div>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <div class="input-wrapper">
                        <input type="password" placeholder="请输入密码">
                    </div>
                </div>
                <button type="button" class="btn-login">登 录</button>
            </form>
        </div>

        <p class="footer">还没有账户？<a href="#">立即注册</a></p>
    </div>
</body>
</html>
