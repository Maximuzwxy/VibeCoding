<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello</title>
</head>
<body>
    <!-- NEW: Wrap the title with <h1> tag to make it a top-level heading -->
    <h1>Hello, world!</h1>
    <!-- NEW: <div> acts like a container, wrapping p and a tags together -->
    <div>
        <!-- NEW: <p> tag represents a paragraph -->
        <p>This is a paragraph of text.</p>
        <!-- NEW: <a> tag creates a hyperlink -->
        <a href="https://www.doubao.com">This is a link of doubao?.</a>
    </div>
</body>
</html>
