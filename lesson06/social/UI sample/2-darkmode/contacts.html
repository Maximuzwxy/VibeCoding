<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通讯录 - Dark Mode</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: #0a0a0f;
            font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .app-layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: #13131a;
            border-right: 1px solid #1f1f2e;
            padding: 24px 16px;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            margin-bottom: 40px;
        }

        .logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #00d4ff, #7b2ff7);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(123, 47, 247, 0.3);
        }

        .logo svg { width: 24px; height: 24px; }

        .sidebar-title {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            color: #6b7280;
            text-decoration: none;
            border-radius: 12px;
            margin-bottom: 4px;
            transition: all 0.2s ease;
        }

        .nav-item:hover, .nav-item.active {
            background: #1f1f2e;
            color: #fff;
        }

        .nav-item svg { width: 20px; height: 20px; }

        .main-content {
            flex: 1;
            padding: 32px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 600;
            color: #fff;
        }

        .search-bar input {
            padding: 12px 20px;
            background: #13131a;
            border: 1px solid #1f1f2e;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            width: 300px;
        }

        .search-bar input::placeholder { color: #4b5563; }
        .search-bar input:focus { outline: none; border-color: #7b2ff7; }

        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .contact-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px 24px;
            background: #13131a;
            border: 1px solid #1f1f2e;
            border-radius: 16px;
            transition: all 0.2s ease;
        }

        .contact-card:hover {
            border-color: #7b2ff7;
            box-shadow: 0 0 20px rgba(123, 47, 247, 0.1);
        }

        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1f1f2e, #2d2d44);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }

        .contact-info { flex: 1; }

        .contact-name {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }

        .contact-status {
            font-size: 13px;
            color: #6b7280;
        }

        .online-dot {
            width: 10px;
            height: 10px;
            background: #10B981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10B981;
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg viewBox="0 0 48 48" fill="none">
                        <path d="M16 20C16 17.79 17.79 16 20 16H28C30.21 16 32 17.79 32 20V28C32 30.21 30.21 32 28 32H20C17.79 32 16 30.21 16 28V20Z" fill="white"/>
                    </svg>
                </div>
                <span class="sidebar-title">Social</span>
            </div>

            <nav>
                <a href="#" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span>聊天</span>
                </a>
                <a href="#" class="nav-item active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                    <span>通讯录</span>
                </a>
                <a href="#" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                    </svg>
                    <span>朋友圈</span>
                </a>
                <a href="#" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                    <span>设置</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1 class="page-title">通讯录</h1>
                <div class="search-bar">
                    <input type="text" placeholder="搜索联系人...">
                </div>
            </div>

            <div class="contact-list">
                <div class="contact-card">
                    <div class="avatar">李</div>
                    <div class="contact-info">
                        <div class="contact-name">李明</div>
                        <div class="contact-status">在线</div>
                    </div>
                    <div class="online-dot"></div>
                </div>
                <div class="contact-card">
                    <div class="avatar">王</div>
                    <div class="contact-info">
                        <div class="contact-name">王小红</div>
                        <div class="contact-status">最后在线 5 分钟前</div>
                    </div>
                </div>
                <div class="contact-card">
                    <div class="avatar">张</div>
                    <div class="contact-info">
                        <div class="contact-name">张伟</div>
                        <div class="contact-status">在线</div>
                    </div>
                    <div class="online-dot"></div>
                </div>
                <div class="contact-card">
                    <div class="avatar">陈</div>
                    <div class="contact-info">
                        <div class="contact-name">陈思思</div>
                        <div class="contact-status">离线</div>
                    </div>
                </div>
                <div class="contact-card">
                    <div class="avatar">刘</div>
                    <div class="contact-info">
                        <div class="contact-name">刘强</div>
                        <div class="contact-status">在线</div>
                    </div>
                    <div class="online-dot"></div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
