<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Pong Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .menu {
            margin-bottom: 20px;
        }

        .menu button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 1.2em;
            font-family: 'Courier New', monospace;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #667eea;
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .menu button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
            background: #764ba2;
        }

        .menu button.active {
            background: #764ba2;
            box-shadow: 0 6px 20px rgba(118, 75, 162, 0.6);
        }

        canvas {
            border: 4px solid #333;
            border-radius: 10px;
            background: #000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: none;
        }

        canvas.visible {
            display: block;
        }

        .score-board {
            display: none;
            justify-content: space-around;
            margin-top: 20px;
            font-size: 2em;
            font-weight: bold;
            color: #333;
        }

        .score-board.visible {
            display: flex;
        }

        .player-score {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border-radius: 10px;
            min-width: 100px;
        }

        .controls-info {
            margin-top: 20px;
            padding: 15px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 10px;
            color: #333;
            font-size: 0.9em;
            display: none;
        }

        .controls-info.visible {
            display: block;
        }

        .buff-legend {
            margin-top: 15px;
            padding: 15px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 10px;
            color: #333;
            font-size: 0.85em;
            display: none;
            text-align: left;
        }

        .buff-legend.visible {
            display: block;
        }

        .buff-item {
            margin: 5px 0;
            display: flex;
            align-items: center;
        }

        .buff-icon {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-size: 14px;
        }

        .back-button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 1em;
            font-family: 'Courier New', monospace;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #ff6b6b;
            color: white;
            transition: all 0.3s ease;
            display: none;
        }

        .back-button.visible {
            display: inline-block;
        }

        .back-button:hover {
            background: #ee5a6f;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🏓 CLASSIC PONG</h1>
        
        <div class="menu" id="menu">
            <button onclick="startGame('pvp')">👥 Player vs Player</button>
            <button onclick="startGame('pvc')">🤖 Player vs PC</button>
        </div>

        <canvas id="gameCanvas" width="800" height="500"></canvas>
        
        <div class="score-board" id="scoreBoard">
            <div class="player-score" id="player1Score">Player 1: 0</div>
            <div class="player-score" id="player2Score">Player 2: 0</div>
        </div>

        <div class="controls-info" id="controlsInfo">
            <strong>Controls:</strong><br>
            <span id="controlsText"></span>
        </div>

        <div class="buff-legend" id="buffLegend">
            <strong>🎁 Buffs:</strong>
            <div class="buff-item">
                <span class="buff-icon" style="background: #00ff00;">↕️</span>
                <span>Enlarge Paddle (8s)</span>
            </div>
            <div class="buff-item">
                <span class="buff-icon" style="background: #ff0000;">↕️</span>
                <span>Shrink Opponent (8s)</span>
            </div>
            <div class="buff-item">
                <span class="buff-icon" style="background: #ffff00;">⚡</span>
                <span>Speed Boost (6s)</span>
            </div>
            <div class="buff-item">
                <span class="buff-icon" style="background: #ff6600;">🐌</span>
                <span>Slow Opponent (6s)</span>
            </div>
            <div class="buff-item">
                <span class="buff-icon" style="background: #00ffff;">⚪</span>
                <span>Multi-Ball (Instant)</span>
            </div>
            <div class="buff-item">
                <span class="buff-icon" style="background: #ff00ff;">💥</span>
                <span>Power Shot - Super Fast Ball! (10s)</span>
            </div>
        </div>

        <button class="back-button" id="backButton" onclick="backToMenu()">← Back to Menu</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menu = document.getElementById('menu');
        const scoreBoard = document.getElementById('scoreBoard');
        const controlsInfo = document.getElementById('controlsInfo');
        const controlsText = document.getElementById('controlsText');
        const buffLegend = document.getElementById('buffLegend');
        const backButton = document.getElementById('backButton');
        const player1ScoreEl = document.getElementById('player1Score');
        const player2ScoreEl = document.getElementById('player2Score');

        let gameMode = null;
        let gameRunning = false;
        let animationId = null;

        // Game objects
        const paddleWidth = 15;
        const paddleHeight = 100;
        const ballSize = 15;

        const player1 = {
            x: 20,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            speed: 12,
            score: 0,
            dy: 0
        };

        const player2 = {
            x: canvas.width - 20 - paddleWidth,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            speed: 12,
            score: 0,
            dy: 0
        };

        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            size: ballSize,
            dx: 5,
            dy: 5,
            speed: 5
        };

        // Buff system
        const buffs = [];
        const buffTypes = [
            { type: 'enlarge', color: '#00ff00', symbol: '↕️', duration: 8000, effect: 'Enlarge Paddle' },
            { type: 'shrink', color: '#ff0000', symbol: '↕️', duration: 8000, effect: 'Shrink Opponent' },
            { type: 'speed', color: '#ffff00', symbol: '⚡', duration: 6000, effect: 'Speed Boost' },
            { type: 'slow', color: '#ff6600', symbol: '🐌', duration: 6000, effect: 'Slow Opponent' },
            { type: 'multiball', color: '#00ffff', symbol: '⚪', duration: 0, effect: 'Multi-Ball' },
            { type: 'powershot', color: '#ff00ff', symbol: '💥', duration: 10000, effect: 'Power Shot' }
        ];
        let activeBuffs = { player1: [], player2: [] };
        let extraBalls = [];

        // Keyboard input
        const keys = {};

        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        function startGame(mode) {
            gameMode = mode;
            gameRunning = true;
            
            // Reset scores
            player1.score = 0;
            player2.score = 0;
            updateScore();
            
            // Show game elements
            menu.style.display = 'none';
            canvas.classList.add('visible');
            scoreBoard.classList.add('visible');
            controlsInfo.classList.add('visible');
            buffLegend.classList.add('visible');
            backButton.classList.add('visible');
            
            // Set controls info
            if (mode === 'pvp') {
                controlsText.innerHTML = `
                    <strong>Player 1:</strong> W (Up) / S (Down)<br>
                    <strong>Player 2:</strong> ↑ (Up) / ↓ (Down)
                `;
            } else {
                controlsText.innerHTML = `
                    <strong>You:</strong> W (Up) / S (Down)<br>
                    <strong>PC:</strong> Auto-controlled
                `;
            }
            
            resetBall();
            gameLoop();
        }

        function backToMenu() {
            gameRunning = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
            
            // Reset game state
            buffs.length = 0;
            extraBalls.length = 0;
            activeBuffs = { player1: [], player2: [] };
            player1.height = paddleHeight;
            player2.height = paddleHeight;
            player1.speed = 12;
            player2.speed = 12;
            
            menu.style.display = 'block';
            canvas.classList.remove('visible');
            scoreBoard.classList.remove('visible');
            controlsInfo.classList.remove('visible');
            buffLegend.classList.remove('visible');
            backButton.classList.remove('visible');
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.speed = 5;
            
            // Random direction
            ball.dx = (Math.random() > 0.5 ? 1 : -1) * ball.speed;
            ball.dy = (Math.random() * 2 - 1) * ball.speed;
        }

        function spawnBuff() {
            if (Math.random() < 0.003 && buffs.length < 3) { // 0.3% chance per frame, max 3 buffs
                const side = Math.random() > 0.5 ? 'left' : 'right';
                const buffType = buffTypes[Math.floor(Math.random() * buffTypes.length)];
                
                buffs.push({
                    x: side === 'left' ? 15 : canvas.width - 40,
                    y: Math.random() * (canvas.height - 40) + 20,
                    size: 25,
                    type: buffType.type,
                    color: buffType.color,
                    symbol: buffType.symbol,
                    duration: buffType.duration,
                    effect: buffType.effect,
                    side: side,
                    pulse: 0
                });
            }
        }

        function updateBuffs() {
            // Update buff animations
            buffs.forEach(buff => {
                buff.pulse += 0.1;
            });

            // Check collision with paddles
            for (let i = buffs.length - 1; i >= 0; i--) {
                const buff = buffs[i];
                let hit = false;
                let targetPlayer = null;

                if (buff.side === 'left' && checkBuffCollision(buff, player1)) {
                    hit = true;
                    targetPlayer = 'player1';
                } else if (buff.side === 'right' && checkBuffCollision(buff, player2)) {
                    hit = true;
                    targetPlayer = 'player2';
                }

                if (hit) {
                    applyBuff(targetPlayer, buff);
                    buffs.splice(i, 1);
                }
            }

            // Update active buffs
            updateActiveBuffs();
        }

        function checkBuffCollision(buff, paddle) {
            return buff.x < paddle.x + paddle.width &&
                   buff.x + buff.size > paddle.x &&
                   buff.y < paddle.y + paddle.height &&
                   buff.y + buff.size > paddle.y;
        }

        function applyBuff(player, buff) {
            const now = Date.now();
            
            if (buff.type === 'multiball') {
                // Create extra balls
                for (let i = 0; i < 2; i++) {
                    extraBalls.push({
                        x: ball.x,
                        y: ball.y,
                        size: ballSize,
                        dx: (Math.random() * 2 - 1) * ball.speed,
                        dy: (Math.random() * 2 - 1) * ball.speed,
                        speed: ball.speed
                    });
                }
                return;
            }

            if (buff.type === 'powershot') {
                // Power shot buff - makes ball faster when hit
                activeBuffs[player].push({
                    type: buff.type,
                    endTime: now + buff.duration
                });
                return;
            }

            if (buff.type === 'enlarge' || buff.type === 'speed') {
                // Beneficial buff for the player who collected it
                activeBuffs[player].push({
                    type: buff.type,
                    endTime: now + buff.duration
                });
                
                if (buff.type === 'enlarge') {
                    const paddle = player === 'player1' ? player1 : player2;
                    paddle.height = 150; // Enlarge paddle
                } else if (buff.type === 'speed') {
                    const paddle = player === 'player1' ? player1 : player2;
                    paddle.speed = 12; // Speed boost
                }
            } else {
                // Debuff for the opponent
                const opponent = player === 'player1' ? 'player2' : 'player1';
                activeBuffs[opponent].push({
                    type: buff.type,
                    endTime: now + buff.duration
                });
                
                if (buff.type === 'shrink') {
                    const paddle = opponent === 'player1' ? player1 : player2;
                    paddle.height = 60; // Shrink paddle
                } else if (buff.type === 'slow') {
                    const paddle = opponent === 'player1' ? player1 : player2;
                    paddle.speed = 4; // Slow down
                }
            }
        }

        function updateActiveBuffs() {
            const now = Date.now();
            
            ['player1', 'player2'].forEach(player => {
                activeBuffs[player] = activeBuffs[player].filter(buff => {
                    if (now >= buff.endTime) {
                        // Remove buff effect
                        const paddle = player === 'player1' ? player1 : player2;
                        
                        if (buff.type === 'enlarge' || buff.type === 'shrink') {
                            paddle.height = paddleHeight; // Reset to normal
                        } else if (buff.type === 'speed' || buff.type === 'slow') {
                            paddle.speed = 12; // Reset to normal speed
                        }
                        
                        return false;
                    }
                    return true;
                });
            });
        }

        function hasPowerShot(player) {
            const now = Date.now();
            return activeBuffs[player].some(buff => buff.type === 'powershot' && now < buff.endTime);
        }

        function drawBuffs() {
            buffs.forEach(buff => {
                const pulseSize = Math.sin(buff.pulse) * 3;
                
                // Draw buff circle with glow
                ctx.shadowBlur = 15;
                ctx.shadowColor = buff.color;
                ctx.fillStyle = buff.color;
                ctx.beginPath();
                ctx.arc(buff.x + buff.size / 2, buff.y + buff.size / 2, buff.size / 2 + pulseSize, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                
                // Draw symbol
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(buff.symbol, buff.x + buff.size / 2, buff.y + buff.size / 2);
            });
        }

        function drawActiveBuffs() {
            const now = Date.now();
            let yOffset = 60;
            
            ['player1', 'player2'].forEach((player, index) => {
                const x = index === 0 ? 20 : canvas.width - 170;
                
                activeBuffs[player].forEach(buff => {
                    const remaining = Math.ceil((buff.endTime - now) / 1000);
                    const buffInfo = buffTypes.find(b => b.type === buff.type);
                    
                    ctx.fillStyle = buffInfo.color;
                    ctx.font = 'bold 12px Courier New';
                    ctx.textAlign = 'left';
                    ctx.fillText(`${buffInfo.symbol} ${remaining}s`, x, yOffset);
                    
                    yOffset += 20;
                });
            });
        }

        function updateScore() {
            player1ScoreEl.textContent = `Player 1: ${player1.score}`;
            player2ScoreEl.textContent = gameMode === 'pvc' ? `PC: ${player2.score}` : `Player 2: ${player2.score}`;
        }

        function handleInput() {
            // Player 1 controls (W/S)
            if (keys['w'] || keys['W']) {
                player1.y -= player1.speed;
            }
            if (keys['s'] || keys['S']) {
                player1.y += player1.speed;
            }

            // Player 2 controls or AI
            if (gameMode === 'pvp') {
                if (keys['ArrowUp']) {
                    player2.y -= player2.speed;
                }
                if (keys['ArrowDown']) {
                    player2.y += player2.speed;
                }
            } else {
                // AI control
                aiControl();
            }

            // Keep paddles in bounds
            player1.y = Math.max(0, Math.min(canvas.height - player1.height, player1.y));
            player2.y = Math.max(0, Math.min(canvas.height - player2.height, player2.y));
        }

        function aiControl() {
            const paddleCenter = player2.y + player2.height / 2;
            const ballCenter = ball.y;
            
            // Add some delay/reaction time based on difficulty
            const reactionThreshold = 10;
            
            if (ball.dx > 0) { // Ball moving towards AI
                if (paddleCenter < ballCenter - reactionThreshold) {
                    player2.y += player2.speed * 0.85; // Slightly slower than player
                } else if (paddleCenter > ballCenter + reactionThreshold) {
                    player2.y -= player2.speed * 0.85;
                }
            } else {
                // Return to center when ball is moving away
                const centerY = canvas.height / 2 - player2.height / 2;
                if (player2.y < centerY - 10) {
                    player2.y += player2.speed * 0.3;
                } else if (player2.y > centerY + 10) {
                    player2.y -= player2.speed * 0.3;
                }
            }
        }

        function updateBall() {
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Top and bottom collision
            if (ball.y <= 0 || ball.y + ball.size >= canvas.height) {
                ball.dy = -ball.dy;
            }

            // Paddle collision
            if (checkPaddleCollision(player1)) {
                let speedIncrease = hasPowerShot('player1') ? 2.5 : 0.5;
                ball.dx = Math.abs(ball.dx) + speedIncrease;
                ball.x = player1.x + player1.width;
                
                // Add angle based on where ball hits paddle
                const hitPos = (ball.y - player1.y) / player1.height;
                ball.dy = (hitPos - 0.5) * 10;
            }

            if (checkPaddleCollision(player2)) {
                let speedIncrease = hasPowerShot('player2') ? 2.5 : 0.5;
                ball.dx = -(Math.abs(ball.dx) + speedIncrease);
                ball.x = player2.x - ball.size;
                
                const hitPos = (ball.y - player2.y) / player2.height;
                ball.dy = (hitPos - 0.5) * 10;
            }

            // Scoring
            if (ball.x < 0) {
                player2.score++;
                updateScore();
                resetBall();
            } else if (ball.x > canvas.width) {
                player1.score++;
                updateScore();
                resetBall();
            }
        }

        function updateExtraBalls() {
            for (let i = extraBalls.length - 1; i >= 0; i--) {
                const extraBall = extraBalls[i];
                extraBall.x += extraBall.dx;
                extraBall.y += extraBall.dy;

                // Top and bottom collision
                if (extraBall.y <= 0 || extraBall.y + extraBall.size >= canvas.height) {
                    extraBall.dy = -extraBall.dy;
                }

                // Paddle collision
                if (checkPaddleCollisionWithBall(player1, extraBall)) {
                    let speedIncrease = hasPowerShot('player1') ? 2.5 : 1;
                    extraBall.dx = Math.abs(extraBall.dx) + speedIncrease;
                    extraBall.x = player1.x + player1.width;
                }

                if (checkPaddleCollisionWithBall(player2, extraBall)) {
                    let speedIncrease = hasPowerShot('player2') ? 2.5 : 1;
                    extraBall.dx = -(Math.abs(extraBall.dx) + speedIncrease);
                    extraBall.x = player2.x - extraBall.size;
                }

                // Remove if out of bounds
                if (extraBall.x < -50 || extraBall.x > canvas.width + 50) {
                    extraBalls.splice(i, 1);
                }
            }
        }

        function checkPaddleCollisionWithBall(paddle, ballObj) {
            return ballObj.x < paddle.x + paddle.width &&
                   ballObj.x + ballObj.size > paddle.x &&
                   ballObj.y < paddle.y + paddle.height &&
                   ballObj.y + ballObj.size > paddle.y;
        }

        function checkPaddleCollision(paddle) {
            return ball.x < paddle.x + paddle.width &&
                   ball.x + ball.size > paddle.x &&
                   ball.y < paddle.y + paddle.height &&
                   ball.y + ball.size > paddle.y;
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw center line
            ctx.setLineDash([10, 10]);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Draw paddles with gradient
            const gradient1 = ctx.createLinearGradient(player1.x, player1.y, player1.x + player1.width, player1.y);
            gradient1.addColorStop(0, '#667eea');
            gradient1.addColorStop(1, '#764ba2');
            ctx.fillStyle = gradient1;
            ctx.fillRect(player1.x, player1.y, player1.width, player1.height);

            const gradient2 = ctx.createLinearGradient(player2.x, player2.y, player2.x + player2.width, player2.y);
            gradient2.addColorStop(0, '#f093fb');
            gradient2.addColorStop(1, '#f5576c');
            ctx.fillStyle = gradient2;
            ctx.fillRect(player2.x, player2.y, player2.width, player2.height);

            // Draw ball with glow effect (circle)
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#fff';
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(ball.x + ball.size / 2, ball.y + ball.size / 2, ball.size / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Draw extra balls
            extraBalls.forEach(extraBall => {
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00ffff';
                ctx.fillStyle = '#00ffff';
                ctx.beginPath();
                ctx.arc(extraBall.x + extraBall.size / 2, extraBall.y + extraBall.size / 2, extraBall.size / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // Draw buffs
            drawBuffs();

            // Draw active buff indicators
            drawActiveBuffs();
        }

        function gameLoop() {
            if (!gameRunning) return;

            handleInput();
            updateBall();
            updateExtraBalls();
            spawnBuff();
            updateBuffs();
            draw();

            animationId = requestAnimationFrame(gameLoop);
        }

        // Initial draw
        draw();
    </script>
</body>
</html>
