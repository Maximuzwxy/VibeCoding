<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Phantom Connection</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- ==================== LOGIN / REGISTER ==================== -->
<div id="authPage" class="auth-page">
    <div class="auth-card">
        <div class="auth-ghost">
            <svg viewBox="0 0 76 100" width="64" height="88">
                <path d="
                    M38 4
                    C60 4 72 16 72 35
                    L72 76
                    Q72 82 68 82
                    L64 74 L60 82 L56 74 L52 82 L48 74 L44 82 L40 74 L36 82 L32 74 L28 82 L24 74 L20 82 L16 74 L12 82 L8 74
                    Q4 82 4 76
                    L4 35
                    C4 16 16 4 38 4Z
                " fill="none" stroke="#aaa" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="28" cy="32" r="4" fill="#aaa"/>
                <circle cx="48" cy="32" r="4" fill="#aaa"/>
                <ellipse cx="38" cy="46" rx="3" ry="4" fill="#aaa"/>
            </svg>
        </div>
        <div class="auth-logo">Phantom Connection</div>
        <div class="auth-tabs">
            <button class="auth-tab active" onclick="switchAuthTab('login')">Login</button>
            <button class="auth-tab" onclick="switchAuthTab('register')">Register</button>
        </div>

        <div id="loginForm">
            <input type="text" id="loginUsername" placeholder="Username" class="auth-input">
            <input type="password" id="loginPassword" placeholder="Password" class="auth-input">
            <button class="auth-btn" onclick="doLogin()">Log In</button>
        </div>

        <div id="registerForm" style="display:none;">
            <input type="text" id="regUsername" placeholder="Username (3+ chars)" class="auth-input">
            <input type="text" id="regNickname" placeholder="Nickname" class="auth-input">
            <input type="password" id="regPassword" placeholder="Password (4+ chars)" class="auth-input">
            <input type="text" id="regBio" placeholder="Bio (optional)" class="auth-input">
            <div class="avatar-grid" id="regAvatarPicker"></div>
            <button class="auth-btn" onclick="doRegister()">Register</button>
        </div>
        <div id="authError" class="auth-error"></div>
    </div>
</div>

<!-- ==================== MAIN APP ==================== -->
<div id="mainApp" style="display:none;">
    <div id="appHeader" class="app-header">
        <span class="header-ghost">
            <svg viewBox="0 0 76 100" width="26" height="34">
                <path d="M38 4 C60 4 72 16 72 35 L72 76 Q72 82 68 82 L64 74 L60 82 L56 74 L52 82 L48 74 L44 82 L40 74 L36 82 L32 74 L28 82 L24 74 L20 82 L16 74 L12 82 L8 74 Q4 82 4 76 L4 35 C4 16 16 4 38 4Z" fill="none" stroke="#aaa" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="28" cy="32" r="4" fill="#aaa"/>
                <circle cx="48" cy="32" r="4" fill="#aaa"/>
                <ellipse cx="38" cy="46" rx="3" ry="4" fill="#aaa"/>
            </svg>
        </span>
        <span class="header-back" id="headerBack" onclick="goBack()" style="display:none;">&lt;</span>
        <span id="headerTitle">Chats</span>
        <span id="headerRight" class="header-right" onclick="headerAction()">+</span>
    </div>

    <div class="app-content" id="appContent">

        <!-- CHAT LIST -->
        <div id="chatListPage" class="page active-page">
            <div class="search-bar"><input type="text" placeholder="Search chats..." oninput="filterChats(this.value)"></div>
            <div id="chatList" class="chat-list"></div>
        </div>

        <!-- CHAT VIEW -->
        <div id="chatViewPage" class="page">
            <div id="chatMessages" class="chat-messages"></div>
            <div class="chat-input-bar">
                <input type="text" id="chatInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMessage()">
                <input type="file" id="chatImageInput" accept="image/*" style="display:none;" onchange="sendImageMessage()">
                <button class="image-btn" onclick="document.getElementById('chatImageInput').click()" title="Send photo">📷</button>
                <button class="send-btn" onclick="sendMessage()">Send</button>
            </div>
        </div>

        <!-- CONTACTS -->
        <div id="contactsPage" class="page">
            <div class="search-bar"><input type="text" id="contactSearch" placeholder="Search users..." oninput="searchUsers(this.value)"></div>
            <div id="searchResults"></div>
            <div class="section-label">Friend Requests</div>
            <div id="friendRequests"></div>
            <div class="section-label">My Friends</div>
            <div id="friendsList"></div>
        </div>

        <!-- MOMENTS -->
        <div id="momentsPage" class="page">
            <div class="moments-header">
                <span>Moments</span>
                <button class="moment-post-btn" onclick="showPostMoment()">+ Post</button>
            </div>
            <div id="postMomentBox" class="post-moment-box" style="display:none;">
                <textarea id="momentText" placeholder="What's on your mind..." rows="3"></textarea>
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
                    <input type="file" id="momentImageInput" accept="image/*" style="display:none;" onchange="previewMomentImage()">
                    <button class="auth-btn" style="width:auto;padding:6px 12px;font-size:13px;" onclick="document.getElementById('momentImageInput').click()">Add Photo</button>
                    <span id="momentImagePreview" style="font-size:12px;color:#999;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
                    <button id="momentImageClear" style="display:none;background:none;border:none;color:#e74c3c;cursor:pointer;font-size:13px;" onclick="clearMomentImage()">✕</button>
                </div>
                <button class="auth-btn" onclick="postMoment()">Share</button>
            </div>
            <div id="momentsFeed"></div>
        </div>

        <!-- FINDINGS -->
        <div id="findingsPage" class="page">
            <div class="moments-header">
                <span>Findings</span>
            </div>
            <div id="findingsContent" style="padding:16px;text-align:center;">
                <canvas id="snakeCanvas" width="340" height="340" style="border:2px solid var(--wechat-green);border-radius:8px;background:#1a1a2e;"></canvas>
                <div style="display:flex;justify-content:center;gap:8px;margin-top:10px;">
                    <button id="snakeStartBtn" class="auth-btn" style="width:auto;padding:8px 24px;" onclick="startSnakeGame()">START GAME</button>
                </div>
                <div style="margin-top:8px;font-size:13px;color:var(--wechat-green);">
                    Score: <span id="snakeScore">0</span>
                </div>
                <div style="margin-top:4px;font-size:11px;color:#999;">
                    Arrow keys or WASD to move
                </div>
                <hr style="border-color:#eee;margin:16px 0;">
                <canvas id="pongCanvas" width="340" height="220" style="border:2px solid var(--wechat-green);border-radius:8px;background:#1a1a2e;"></canvas>
                <div style="display:flex;justify-content:center;gap:8px;margin-top:10px;">
                    <button id="pongStartBtn" class="auth-btn" style="width:auto;padding:8px 24px;" onclick="startPongGame()">START PONG</button>
                </div>
                <div style="margin-top:8px;font-size:13px;color:var(--wechat-green);">
                    You: <span id="pongPlayer">0</span> &nbsp; CPU: <span id="pongCpu">0</span>
                </div>
                <div style="margin-top:4px;font-size:11px;color:#999;">
                    Up/Down arrows or W/S to move paddle
                </div>
            </div>
        </div>

        <!-- PROFILE -->
        <div id="profilePage" class="page">
            <div class="profile-card">
                <div class="profile-avatar" id="profileAvatar">🦊</div>
                <div class="profile-nickname" id="profileNickname"></div>
                <div class="profile-username" id="profileUsername"></div>
                <div class="profile-bio" id="profileBio"></div>
                <button class="edit-profile-btn" onclick="showEditProfile()">Edit Profile</button>
            </div>

            <div id="editProfileBox" class="edit-profile-box" style="display:none;">
                <input type="text" id="editNickname" placeholder="Nickname" class="auth-input">
                <input type="text" id="editBio" placeholder="Bio" class="auth-input">
                <div class="avatar-grid" id="editAvatarPicker"></div>
                <div class="section-label" style="background:transparent;padding:8px 0;">Change Password</div>
                <input type="password" id="editOldPass" placeholder="Current password" class="auth-input">
                <input type="password" id="editNewPass" placeholder="New password" class="auth-input">
                <button class="auth-btn" onclick="saveProfile()">Save</button>
                <button class="auth-btn" style="background:#888;" onclick="cancelEditProfile()">Cancel</button>
                <div id="profileError" class="auth-error"></div>
            </div>

            <!-- Admin Panel (hidden for regular users) -->
            <div id="adminPanel" style="display:none;">
                <div class="section-label">Admin Panel</div>
                <div id="adminStats" class="admin-stats"></div>
                <div class="section-label">Manage Users</div>
                <div id="adminUserList"></div>
                <div class="section-label">Manage Moments</div>
                <div id="adminMomentList"></div>
            </div>

            <button class="logout-btn" onclick="doLogout()">Log Out</button>
        </div>
    </div>

    <!-- Bottom Tab Bar -->
    <div class="tab-bar">
        <div class="tab active" data-page="chatListPage" onclick="switchTab(this)"><div class="tab-icon">Chats</div></div>
        <div class="tab" data-page="contactsPage" onclick="switchTab(this)"><div class="tab-icon">Contacts</div></div>
        <div class="tab" data-page="momentsPage" onclick="switchTab(this)"><div class="tab-icon">Moments</div></div>
        <div class="tab" data-page="findingsPage" onclick="switchTab(this)"><div class="tab-icon">Findings</div></div>
        <div class="tab" data-page="profilePage" onclick="switchTab(this)"><div class="tab-icon">Me</div></div>
    </div>
</div>

<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>

<!-- Context Menu -->
<div id="contextMenu" class="context-menu" style="display:none;">
    <div class="context-item" onclick="contextAction('delete')">Delete</div>
</div>
</body>
</html>
