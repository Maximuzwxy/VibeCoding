<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Flat Design</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ECF0F1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            background: #FFFFFF;
            padding: 48px 40px;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            width: 56px;
            height: 56px;
            background: #3498DB;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .logo svg { width: 32px; height: 32px; }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #2C3E50;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: #7F8C8D;
        }

        .form-group { margin-bottom: 18px; }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #34495E;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #BDC3C7;
            border-radius: 8px;
            font-size: 15px;
            color: #2C3E50;
            background: #FDFEFE;
            transition: border-color 0.2s;
        }

        .form-group input::placeholder { color: #95A5A6; }

        .form-group input:focus {
            outline: none;
            border-color: #3498DB;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: #3498DB;
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-login:hover { background: #2980B9; }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #7F8C8D;
        }

        .footer a {
            color: #3498DB;
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-area">
            <div class="logo">
                <svg viewBox="0 0 48 48" fill="none">
                    <path d="M16 20C16 17.79 17.79 16 20 16H28C30.21 16 32 17.79 32 20V28C32 30.21 30.21 32 28 32H20C17.79 32 16 30.21 16 28V20Z" fill="white"/>
                    <circle cx="20" cy="22" r="2" fill="#3498DB"/>
                    <circle cx="28" cy="22" r="2" fill="#3498DB"/>
                    <path d="M20 27C20 27 22 29 24 29C26 29 28 27 28 27" stroke="#3498DB" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
            <h1>欢迎回来</h1>
            <p class="subtitle">登录到您的账户</p>
        </div>

        <form>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" placeholder="请输入密码">
            </div>
            <button type="button" class="btn-login">登 录</button>
        </form>

        <p class="footer">还没有账户？<a href="#">立即注册</a></p>
    </div>
</body>
</html>
