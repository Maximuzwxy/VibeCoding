<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello</title>
    <style>
        .mydiv { color: gold; }
    </style>
</head>
<body>
    <h1>Hello, world!</h1>
    <p>This is a paragraph before the div.</p>
    <div class="mydiv">
        <p>This is a paragraph inside the div.</p>
    </div>
    <p>This is a paragraph after the div.</p>
    <div class="mydiv">
        <p>This is a paragraph inside the second div.</p>
    </div>
    <script>
        console.log("Hello from JS!");
        // NEW: Loop through all elements with class "mydiv" using for...of,
        // and set background color for each one, not just the first
        let divs = document.getElementsByClassName("mydiv");
        for (let div of divs) {
            div.style.backgroundColor = "White";
        }
    </script>
</body>
</html>
