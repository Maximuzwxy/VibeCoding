<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello</title>
    <style>
        /* Final optimized version: Added polished styles for a nicer look */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
            border-bottom: 3px solid #4CAF50;
            padding-bottom: 10px;
        }
        .mydiv {
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            transition: all 0.4s ease;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <h1>Hello, world!</h1>
    <p>This is a paragraph before the div.</p>
    <div class="mydiv">
        <p>This is a paragraph inside the div.</p>
    </div>
    <p>This is a paragraph after the div.</p>
    <div class="mydiv">
        <p>This is a paragraph inside the second div.</p>
    </div>
    <button onClick="change_color()">Change Color</button>
    <script>
        console.log("Hello from JS!");
        // Final optimized version: More color options for richer visual variety
        function change_color () {
            const bgColors = ["#FF6B6B", "#4ECDC4", "#45B7D1", "#96CEB4", "#FFEAA7",
                              "#DDA0DD", "#FF8C00", "#20B2AA", "#87CEEB", "#F0E68C"];
            const textColors = ["#2C3E50", "#FFFFFF", "#1A1A2E", "#16213E", "#0F3460",
                                "#533483", "#E94560", "#F9ED69", "#F08A5D", "#B83B5E"];
            let divs = document.getElementsByClassName("mydiv");
            for (let div of divs) {
                let bgIdx = Math.floor(Math.random() * bgColors.length);
                let txtIdx = Math.floor(Math.random() * textColors.length);
                div.style.backgroundColor = bgColors[bgIdx];
                div.style.color = textColors[txtIdx];
            }
        }
    </script>
</body>
</html>
