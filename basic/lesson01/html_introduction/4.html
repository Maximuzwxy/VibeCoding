<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello</title>
    <!-- NEW: Move styles from inline style to a <style> tag in <head>,
         defining a CSS class named .mydiv for reuse and management -->
    <style>
        .mydiv {
            color: orange;
        }
    </style>
</head>
<body>
    <h1>Hello, world!</h1>
    <p>This is a paragraph before the div.</p>
    <!-- NEW: Reference the style defined in head via class="mydiv" -->
    <div class="mydiv">
        <p>This is a paragraph inside the div.</p>
    </div>
    <p>This is a paragraph after the div.</p>
</body>
</html>
