<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPS8 - 房间</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        .header {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #00d4ff;
            font-size: 1.5em;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .room-container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .room-id {
            text-align: center;
            color: #aaa;
            margin-bottom: 20px;
        }

        .room-id span {
            color: #00d4ff;
            font-weight: bold;
        }

        .teams-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .team-panel {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
        }

        .team-panel.blue {
            border: 2px solid #4444ff;
        }

        .team-panel.red {
            border: 2px solid #ff4444;
        }

        .team-title {
            text-align: center;
            font-size: 1.3em;
            margin-bottom: 15px;
        }

        .team-panel.blue .team-title {
            color: #4444ff;
        }

        .team-panel.red .team-title {
            color: #ff4444;
        }

        .player-list {
            min-height: 100px;
        }

        .player-item {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 10px 15px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-item .name {
            font-weight: bold;
        }

        .player-item .host-badge {
            background: #ff9800;
            color: #fff;
            padding: 2px 8px;
            border-radius: 5px;
            font-size: 0.8em;
        }

        .empty-team {
            text-align: center;
            color: #666;
            padding: 20px;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .team-select-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.2s;
            color: #fff;
        }

        .team-select-btn.blue {
            background: linear-gradient(135deg, #4444ff, #3333cc);
        }

        .team-select-btn.red {
            background: linear-gradient(135deg, #ff4444, #cc3333);
        }

        .team-select-btn:hover {
            transform: translateY(-2px);
        }

        .team-select-btn.selected {
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            transform: scale(1.05);
        }

        .start-btn {
            padding: 15px 50px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(76, 175, 80, 0.4);
        }

        .start-btn:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .confirm-btn {
            padding: 15px 50px;
            background: linear-gradient(135deg, #2196F3, #1976D2);
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-left: 20px;
        }

        .confirm-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(33, 150, 243, 0.4);
        }

        .waiting-message {
            text-align: center;
            color: #aaa;
            padding: 20px;
            font-size: 1.1em;
        }

        .npc-config {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .npc-config h3 {
            color: #00d4ff;
            margin-bottom: 15px;
            text-align: center;
        }

        .npc-row {
            display: flex;
            justify-content: space-around;
            gap: 20px;
        }

        .npc-group {
            flex: 1;
            text-align: center;
        }

        .npc-group label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
        }

        .npc-group select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 1em;
        }

        .npc-group select option {
            background: #1a1a2e;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>FPS8 - 房间</h1>
        <button class="back-btn" onclick="leaveRoom()">离开房间</button>
    </div>

    <div class="room-container">
        <div class="room-id">房间 ID: <span id="room-id-display"></span></div>

        <div class="npc-config" id="npc-config">
            <h3>NPC 配置</h3>
            <div class="npc-row">
                <div class="npc-group">
                    <label>蓝方 NPC 数量</label>
                    <select id="blue-npcs">
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3" selected>3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                    </select>
                </div>
                <div class="npc-group">
                    <label>红方 NPC 数量</label>
                    <select id="red-npcs">
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3" selected>3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="teams-container">
            <div class="team-panel blue">
                <div class="team-title">蓝方</div>
                <div class="player-list" id="blue-list">
                    <div class="empty-team">暂无玩家</div>
                </div>
            </div>
            <div class="team-panel red">
                <div class="team-title">红方</div>
                <div class="player-list" id="red-list">
                    <div class="empty-team">暂无玩家</div>
                </div>
            </div>
        </div>

        <div class="actions" id="team-actions">
            <button class="team-select-btn blue" onclick="selectTeam('blue')">选择蓝方</button>
            <button class="team-select-btn red" onclick="selectTeam('red')">选择红方</button>
            <button class="confirm-btn" onclick="joinRoom()">确认加入</button>
        </div>

        <div class="actions" id="start-actions" style="display: none;">
            <button class="start-btn" id="start-btn" onclick="startGame()">开始游戏</button>
        </div>

        <div class="waiting-message" id="waiting-message" style="display: none;">
            等待房主开始游戏...
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room_id');
        const isHost = params.get('host') === 'true';
        const playerName = decodeURIComponent(params.get('name') || 'Player');
        const userId = params.get('user_id') || '';

        let socket;
        let currentTeam = 'blue';
        let roomState = null;
        let hasJoined = false;

        document.getElementById('room-id-display').textContent = roomId;

        if (isHost) {
            document.getElementById('start-actions').style.display = 'flex';
            document.getElementById('team-actions').style.display = 'none';
            connectSocket();
        } else {
            document.getElementById('team-actions').style.display = 'flex';
            document.getElementById('waiting-message').style.display = 'none';
            updateTeamButtons();
        }

        function selectTeam(team) {
            currentTeam = team;
            updateTeamButtons();
        }

        function updateTeamButtons() {
            document.querySelectorAll('.team-select-btn').forEach(btn => btn.classList.remove('selected'));
            document.querySelector(`.team-select-btn.${currentTeam}`).classList.add('selected');
        }

        function joinRoom() {
            if (hasJoined) return;
            hasJoined = true;
            document.getElementById('team-actions').style.display = 'none';
            document.getElementById('waiting-message').style.display = 'block';
            connectSocket();
        }

        function connectSocket() {
            socket = io(window.location.origin);

            socket.on('connect', () => {
                console.log('[Room] Connected to server');
                socket.emit('join_room', {
                    room_id: roomId,
                    player_name: playerName,
                    team: currentTeam,
                    user_id: userId
                });
            });

            socket.on('room_joined', (data) => {
                console.log('[Room] Joined room:', data);
                console.log('[Room] blue_team:', data.room_state.blue_team);
                console.log('[Room] red_team:', data.room_state.red_team);
                console.log('[Room] players:', data.room_state.players);
                roomState = data.room_state;
                updatePlayerList();
            });

            socket.on('player_joined', (data) => {
                console.log('[Room] Player joined:', data.player.name);
                if (roomState) {
                    roomState.players[data.player.id] = data.player;
                    if (data.player.team === 'blue' && !roomState.blue_team.includes(data.player.id)) {
                        roomState.blue_team.push(data.player.id);
                    } else if (data.player.team === 'red' && !roomState.red_team.includes(data.player.id)) {
                        roomState.red_team.push(data.player.id);
                    }
                    updatePlayerList();
                }
            });

            socket.on('player_left', (data) => {
                console.log('[Room] Player left:', data.player_id);
                if (roomState && roomState.players[data.player_id]) {
                    delete roomState.players[data.player_id];
                    roomState.blue_team = roomState.blue_team.filter(id => id !== data.player_id);
                    roomState.red_team = roomState.red_team.filter(id => id !== data.player_id);
                    updatePlayerList();
                }
            });

            socket.on('game_start', (data) => {
                console.log('[Room] game_start received, saving game state...');
                const gameState = data.room_state;
                localStorage.setItem('fps8_game_state', JSON.stringify(gameState));
                console.log('[Room] Game state saved, redirecting to loading page...');
                window.location.href = 'loading.html?room_id=' + roomId + '&name=' + encodeURIComponent(playerName);
            });

            socket.on('room_dissolved', (data) => {
                alert('房主已离开，房间已解散');
                window.location.href = 'lobby.html';
            });

            socket.on('error', (data) => {
                alert(data.message);
            });

            socket.on('disconnect', () => {
                console.log('[Room] Disconnected from server');
            });
        }

        function updatePlayerList() {
            if (!roomState) return;

            const blueList = document.getElementById('blue-list');
            const redList = document.getElementById('red-list');

            const bluePlayers = roomState.blue_team.map(id => roomState.players[id]).filter(p => p);
            const redPlayers = roomState.red_team.map(id => roomState.players[id]).filter(p => p);

            blueList.innerHTML = bluePlayers.length === 0 
                ? '<div class="empty-team">暂无玩家</div>'
                : bluePlayers.map(p => `
                    <div class="player-item">
                        <span class="name">${p.name}</span>
                        ${p.id === roomState.host_id ? '<span class="host-badge">房主</span>' : ''}
                    </div>
                `).join('');

            redList.innerHTML = redPlayers.length === 0
                ? '<div class="empty-team">暂无玩家</div>'
                : redPlayers.map(p => `
                    <div class="player-item">
                        <span class="name">${p.name}</span>
                        ${p.id === roomState.host_id ? '<span class="host-badge">房主</span>' : ''}
                    </div>
                `).join('');
        }

        function startGame() {
            if (!isHost) return;

            const blueNpcs = parseInt(document.getElementById('blue-npcs').value);
            const redNpcs = parseInt(document.getElementById('red-npcs').value);

            console.log('[Room] Host starting game, blue_npcs:', blueNpcs, 'red_npcs:', redNpcs);

            socket.emit('start_game', {
                room_id: roomId,
                user_id: userId,
                blue_npcs: blueNpcs,
                red_npcs: redNpcs
            });
        }

        function leaveRoom() {
            if (socket) {
                socket.emit('leave_room', { room_id: roomId, user_id: userId });
                socket.disconnect();
            }
            window.location.href = 'lobby.html';
        }

    </script>
</body>
</html>
