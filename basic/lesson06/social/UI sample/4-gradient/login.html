<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Gradient Colorful</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #FF6B6B, #FFA07A, #FFD93D, #6BCB77, #4D96FF, #9B59B6);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #FF6B6B, #9B59B6);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(155, 89, 182, 0.3);
        }

        .logo svg { width: 36px; height: 36px; }

        h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #FF6B6B, #9B59B6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: #6B7280;
        }

        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #E5E7EB;
            border-radius: 12px;
            font-size: 15px;
            color: #1F2937;
            transition: all 0.3s;
        }

        .form-group input::placeholder { color: #9CA3AF; }

        .form-group input:focus {
            outline: none;
            border-color: #9B59B6;
            box-shadow: 0 0 0 4px rgba(155, 89, 182, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #FF6B6B, #9B59B6);
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(155, 89, 182, 0.3);
            transition: all 0.3s;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(155, 89, 182, 0.4);
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #6B7280;
        }

        .footer a {
            background: linear-gradient(135deg, #FF6B6B, #9B59B6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-area">
            <div class="logo">
                <svg viewBox="0 0 48 48" fill="none">
                    <path d="M16 20C16 17.79 17.79 16 20 16H28C30.21 16 32 17.79 32 20V28C32 30.21 30.21 32 28 32H20C17.79 32 16 30.21 16 28V20Z" fill="white"/>
                    <circle cx="20" cy="22" r="2" fill="#9B59B6"/>
                    <circle cx="28" cy="22" r="2" fill="#9B59B6"/>
                    <path d="M20 27C20 27 22 29 24 29C26 29 28 27 28 27" stroke="#9B59B6" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
            <h1>欢迎回来</h1>
            <p class="subtitle">登录到您的账户</p>
        </div>

        <form>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" placeholder="请输入密码">
            </div>
            <button type="button" class="btn-login">登 录</button>
        </form>

        <p class="footer">还没有账户？<a href="#">立即注册</a></p>
    </div>
</body>
</html>
