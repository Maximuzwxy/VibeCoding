<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; color: #eee; font-family: 'Arial', sans-serif; padding: 30px; }
        h1 { color: #ffcc00; margin-bottom: 20px; }

        .section {
            background: #2d2d44; border-radius: 10px; padding: 20px; margin-bottom: 20px;
            border: 1px solid #444;
        }
        .section h2 { color: #44aaff; margin-bottom: 12px; font-size: 1.1rem; }
        .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        input {
            background: #1a1a2e; color: #fff; border: 1px solid #555;
            padding: 8px 12px; border-radius: 6px; font-size: 0.9rem;
        }
        input:focus { outline: none; border-color: #ffcc00; }
        button {
            background: #44aaff; color: #fff; border: none; padding: 8px 16px;
            border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: #66bbff; }
        button.danger { background: #ff4444; }
        button.danger:hover { background: #ff6666; }
        button.create { background: #44cc44; }
        button.create:hover { background: #66ee66; }
        button.read { background: #ffcc00; color: #1a1a2e; }
        button.read:hover { background: #ffdd44; }
        .label { color: #888; font-size: 0.8rem; margin-right: 4px; }

        /* Table */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td {
            padding: 10px 14px; text-align: left; border-bottom: 1px solid #444;
        }
        th { color: #aaa; font-size: 0.8rem; text-transform: uppercase; }
        td { font-size: 1rem; }
        td.name { color: #44aaff; }
        td.score { color: #44ff44; font-weight: bold; }
        td.id-col { color: #888; }
        .empty { text-align: center; color: #666; padding: 30px; font-style: italic; }
        .count { color: #888; font-size: 0.85rem; float: right; }
    </style>
</head>
<body>

    <h1>CRUD API Tester</h1>

    <!-- DATA TABLE — always visible -->
    <div class="section">
        <h2>All Items <span class="count" id="item-count">0 items</span></h2>
        <table>
            <thead>
                <tr><th>ID</th><th>Name</th><th>Score</th><th></th></tr>
            </thead>
            <tbody id="table-body">
                <tr><td class="empty" colspan="4">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- CREATE -->
    <div class="section">
        <h2>CREATE — Add a new item</h2>
        <div class="row">
            <span class="label">Name:</span>
            <input type="text" id="create-name" placeholder="e.g. Alice">
            <span class="label">Score:</span>
            <input type="number" id="create-score" placeholder="e.g. 42">
            <button class="create" onclick="createItem()">Create</button>
        </div>
    </div>

    <!-- UPDATE -->
    <div class="section">
        <h2>UPDATE — Modify an item</h2>
        <div class="row">
            <span class="label">ID:</span>
            <input type="number" id="update-id" placeholder="Item ID">
            <span class="label">Name:</span>
            <input type="text" id="update-name" placeholder="New name">
            <span class="label">Score:</span>
            <input type="number" id="update-score" placeholder="New score">
            <button onclick="updateItem()">Update</button>
        </div>
    </div>

    <script>
        const API = '/items';

        async function refreshTable() {
            const res = await fetch(API);
            const items = await res.json();
            const tbody = document.getElementById('table-body');
            document.getElementById('item-count').textContent = items.length + ' items';

            if (items.length === 0) {
                tbody.innerHTML = '<tr><td class="empty" colspan="4">No items yet. Create one above!</td></tr>';
                return;
            }

            tbody.innerHTML = items.map(item => `
                <tr>
                    <td class="id-col">${item.id}</td>
                    <td class="name">${escapeHtml(item.name)}</td>
                    <td class="score">${item.score}</td>
                    <td><button class="danger" style="padding:4px 10px;font-size:0.8rem" onclick="deleteById(${item.id})">Delete</button></td>
                </tr>
            `).join('');
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        async function deleteById(id) {
            await fetch(API + '/' + id, { method: 'DELETE' });
            refreshTable();
        }

        async function createItem() {
            const name = document.getElementById('create-name').value.trim();
            const score = parseInt(document.getElementById('create-score').value);
            if (!name || isNaN(score)) { alert('Please enter name and score'); return; }
            await fetch(API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, score })
            });
            document.getElementById('create-name').value = '';
            document.getElementById('create-score').value = '';
            refreshTable();
        }

        async function updateItem() {
            const id = parseInt(document.getElementById('update-id').value);
            if (isNaN(id)) { alert('Please enter an ID'); return; }
            const body = {};
            const name = document.getElementById('update-name').value.trim();
            const score = document.getElementById('update-score').value;
            if (name) body.name = name;
            if (score !== '') body.score = parseInt(score);
            const res = await fetch(API + '/' + id, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!res.ok) { alert('Item not found'); return; }
            refreshTable();
        }

        refreshTable();
    </script>
</body>
</html>
