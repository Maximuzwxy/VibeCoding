<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通讯录 - Gradient Colorful</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: linear-gradient(-45deg, #FF6B6B, #FFA07A, #FFD93D, #6BCB77, #4D96FF, #9B59B6);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .app-layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: rgba(255, 255, 255, 0.95);
            padding: 24px 0;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.1);
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 20px;
            margin-bottom: 32px;
        }

        .logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #FF6B6B, #9B59B6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(155, 89, 182, 0.3);
        }

        .logo svg { width: 22px; height: 22px; }

        .sidebar-title {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #FF6B6B, #9B59B6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            color: #6B7280;
            text-decoration: none;
            transition: all 0.3s;
            margin: 0 12px;
            border-radius: 10px;
        }

        .nav-item:hover { background: rgba(155, 89, 182, 0.1); color: #9B59B6; }

        .nav-item.active {
            background: linear-gradient(135deg, #FF6B6B, #9B59B6);
            color: #fff;
            box-shadow: 0 4px 12px rgba(155, 89, 182, 0.3);
        }

        .nav-item svg { width: 20px; height: 20px; }

        .main-content {
            flex: 1;
            padding: 32px;
        }

        .page-header {
            background: rgba(255, 255, 255, 0.95);
            padding: 24px 32px;
            border-radius: 16px;
            margin-bottom: 28px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-title {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #FF6B6B, #9B59B6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-bar input {
            padding: 12px 20px;
            border: 2px solid #E5E7EB;
            border-radius: 12px;
            font-size: 14px;
            color: #1F2937;
            width: 280px;
            transition: all 0.3s;
        }

        .search-bar input::placeholder { color: #9CA3AF; }
        .search-bar input:focus { outline: none; border-color: #9B59B6; box-shadow: 0 0 0 4px rgba(155, 89, 182, 0.1); }

        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .contact-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            transition: all 0.3s;
        }

        .contact-card:hover {
            transform: translateX(8px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        .avatar {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FF6B6B, #9B59B6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 4px 12px rgba(155, 89, 182, 0.3);
        }

        .contact-info { flex: 1; }

        .contact-name {
            font-size: 16px;
            font-weight: 600;
            color: #1F2937;
            margin-bottom: 4px;
        }

        .contact-status {
            font-size: 13px;
            color: #6B7280;
        }

        .online-dot {
            width: 12px;
            height: 12px;
            background: #6BCB77;
            border-radius: 50%;
            box-shadow: 0 0 8px #6BCB77;
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg viewBox="0 0 48 48" fill="none">
                        <path d="M16 20C16 17.79 17.79 16 20 16H28C30.21 16 32 17.79 32 20V28C32 30.21 30.21 32 28 32H20C17.79 32 16 30.21 16 28V20Z" fill="white"/>
                    </svg>
                </div>
                <span class="sidebar-title">Social</span>
            </div>

            <nav>
                <a href="#" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span>聊天</span>
                </a>
                <a href="#" class="nav-item active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                    <span>通讯录</span>
                </a>
                <a href="#" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                    </svg>
                    <span>朋友圈</span>
                </a>
                <a href="#" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                    <span>设置</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1 class="page-title">通讯录</h1>
                <div class="search-bar">
                    <input type="text" placeholder="搜索联系人...">
                </div>
            </div>

            <div class="contact-list">
                <div class="contact-card">
                    <div class="avatar">李</div>
                    <div class="contact-info">
                        <div class="contact-name">李明</div>
                        <div class="contact-status">在线</div>
                    </div>
                    <div class="online-dot"></div>
                </div>
                <div class="contact-card">
                    <div class="avatar">王</div>
                    <div class="contact-info">
                        <div class="contact-name">王小红</div>
                        <div class="contact-status">最后在线 5 分钟前</div>
                    </div>
                </div>
                <div class="contact-card">
                    <div class="avatar">张</div>
                    <div class="contact-info">
                        <div class="contact-name">张伟</div>
                        <div class="contact-status">在线</div>
                    </div>
                    <div class="online-dot"></div>
                </div>
                <div class="contact-card">
                    <div class="avatar">陈</div>
                    <div class="contact-info">
                        <div class="contact-name">陈思思</div>
                        <div class="contact-status">离线</div>
                    </div>
                </div>
                <div class="contact-card">
                    <div class="avatar">刘</div>
                    <div class="contact-info">
                        <div class="contact-name">刘强</div>
                        <div class="contact-status">在线</div>
                    </div>
                    <div class="online-dot"></div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
