<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Math Practice - Grades 6 to 8</title>
  <!-- Cartoon-style font from Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Comic Neue', cursive, sans-serif;
      background: linear-gradient(135deg, #ffecd2, #fcb69f);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
      color: #2c3e50;
    }

    h1 {
      font-family: 'Fredoka One', cursive;
      font-size: 2.8rem;
      color: #e74c3c;
      margin-bottom: 20px;
      text-align: center;
    }

    .grade-select {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .grade-btn {
      padding: 14px 28px;
      font-size: 1.4rem;
      font-family: 'Fredoka One', cursive;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    .grade-btn:hover {
      background: #2980b9;
      transform: scale(1.05);
    }

    .quiz-container {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      max-width: 700px;
      width: 100%;
      text-align: center;
      display: none; /* Hidden until grade is selected */
    }

    .question {
      font-size: 1.6rem;
      margin-bottom: 25px;
      line-height: 1.5;
      color: #2c3e50;
    }

    .answer-input {
      padding: 12px;
      font-size: 1.4rem;
      width: 200px;
      text-align: center;
      border: 3px solid #3498db;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .submit-btn {
      padding: 12px 30px;
      font-size: 1.3rem;
      background: #2ecc71;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-family: 'Fredoka One', cursive;
      transition: background 0.3s;
    }

    .submit-btn:hover {
      background: #27ae60;
    }

    .feedback {
      margin-top: 20px;
      font-size: 1.4rem;
      font-weight: bold;
      min-height: 28px;
    }

    .correct { color: #27ae60; }
    .incorrect { color: #e74c3c; }

    .explanation {
      margin-top: 20px;
      padding: 15px;
      background: #f9f9f9;
      border-left: 4px solid #3498db;
      text-align: left;
      font-size: 1.2rem;
      line-height: 1.5;
      border-radius: 0 8px 8px 0;
      display: none;
    }

    .new-question-btn {
      margin-top: 20px;
      padding: 10px 20px;
      background: #9b59b6;
      color: white;
      border: none;
      border-radius: 10px;
      font-family: 'Fredoka One', cursive;
      cursor: pointer;
    }

    .new-question-btn:hover {
      background: #8e44ad;
    }
  </style>
</head>
<body>
  <h1>🚀 Math Practice Adventure!</h1>

  <div class="grade-select">
    <button class="grade-btn" data-grade="grade6">Grade 6</button>
    <button class="grade-btn" data-grade="grade7">Grade 7</button>
    <button class="grade-btn" data-grade="grade8">Grade 8</button>
  </div>

  <div class="quiz-container" id="quizContainer">
    <div class="question" id="question"></div>
    <input type="text" class="answer-input" id="answerInput" placeholder="Your answer" />
    <br />
    <button class="submit-btn" id="submitBtn">Submit Answer</button>
    <div class="feedback" id="feedback"></div>
    <div class="explanation" id="explanation"></div>
    <button class="new-question-btn" id="newQuestionBtn" style="display:none;">Try Another!</button>
  </div>

  <script>
    // Embed the math questions directly as a JavaScript object (no external JSON file needed)
    const questionsData = {
      "grade6": [
        {
          "question": "Calculate: 3.5 + 2.75 = ______",
          "answer": "6.25",
          "explanation": "Align the decimals and add: 3.50 + 2.75 = 6.25."
        },
        {
          "question": "A circle has a radius of 4 cm. Its circumference is ______ cm. (Use π = 3.14)",
          "answer": "25.12",
          "explanation": "Circumference = 2πr = 2 × 3.14 × 4 = 25.12 cm."
        },
        {
          "question": "Simplify the fraction \\(\\frac{18}{24}\\) to its lowest terms: ______",
          "answer": "3/4",
          "explanation": "The greatest common divisor of 18 and 24 is 6. Divide numerator and denominator by 6: 18÷6=3, 24÷6=4."
        },
        {
          "question": "Solve for x: x + 12 = 25. x = ______",
          "answer": "13",
          "explanation": "Subtract 12 from both sides: x = 25 − 12 = 13."
        },
        {
          "question": "What is 35% of 20? ______",
          "answer": "7",
          "explanation": "35% = 0.35. Multiply: 20 × 0.35 = 7."
        },
        {
          "question": "A rectangular prism is 5 cm long, 3 cm wide, and 2 cm high. Its volume is ______ cm³.",
          "answer": "30",
          "explanation": "Volume = length × width × height = 5 × 3 × 2 = 30 cm³."
        },
        {
          "question": "Compare: −3 ______ −7 (fill in >, <, or =)",
          "answer": ">",
          "explanation": "On the number line, −3 is to the right of −7, so −3 > −7."
        },
        {
          "question": "Calculate: \\(\\frac{2}{3} \\times \\frac{9}{10} =\\) ______",
          "answer": "3/5",
          "explanation": "Multiply numerators: 2×9=18. Multiply denominators: 3×10=30. Simplify 18/30 to 3/5."
        },
        {
          "question": "If 5 apples weigh 1.25 kg, then one apple weighs ______ kg.",
          "answer": "0.25",
          "explanation": "Divide total weight by number of apples: 1.25 ÷ 5 = 0.25 kg."
        },
        {
          "question": "A triangle has a base of 8 cm and a height of 5 cm. Its area is ______ cm².",
          "answer": "20",
          "explanation": "Area = (base × height) ÷ 2 = (8 × 5) ÷ 2 = 20 cm²."
        }
      ],
      "grade7": [
        {
          "question": "Calculate: (−4) × (−6) + (−10) = ______",
          "answer": "14",
          "explanation": "First, multiply: (−4)×(−6)=24. Then add: 24 + (−10) = 14."
        },
        {
          "question": "Solve for x: 3x − 7 = 14. x = ______",
          "answer": "7",
          "explanation": "Add 7 to both sides: 3x = 21. Divide by 3: x = 7."
        },
        {
          "question": "Write 0.00045 in scientific notation: ______",
          "answer": "4.5e-4",
          "explanation": "Move the decimal point 4 places right to get 4.5, so it's 4.5 × 10⁻⁴, written as 4.5e-4."
        },
        {
          "question": "Simplify: 5a − 2b + 3a + b = ______",
          "answer": "8a - b",
          "explanation": "Combine like terms: 5a + 3a = 8a; −2b + b = −b. Result: 8a − b."
        },
        {
          "question": "The supplement of an angle is 110°. The angle measures ______ degrees.",
          "answer": "70",
          "explanation": "Supplementary angles add to 180°. So the angle = 180° − 110° = 70°."
        },
        {
          "question": "Calculate: |−8| + |3| = ______",
          "answer": "11",
          "explanation": "Absolute value of −8 is 8; absolute value of 3 is 3. Sum: 8 + 3 = 11."
        },
        {
          "question": "If x = −2, what is x² + 3x? ______",
          "answer": "-2",
          "explanation": "Substitute: (−2)² + 3×(−2) = 4 − 6 = −2."
        },
        {
          "question": "Solve the proportion: \\(\\frac{x}{6} = \\frac{5}{3}\\). x = ______",
          "answer": "10",
          "explanation": "Cross-multiply: 3x = 30. Divide by 3: x = 10."
        },
        {
          "question": "Calculate: 2.5 ÷ 0.5 = ______",
          "answer": "5",
          "explanation": "2.5 ÷ 0.5 = 25 ÷ 5 = 5."
        },
        {
          "question": "The sum of interior angles of a polygon is 720°. It is a ______-gon.",
          "answer": "6",
          "explanation": "Formula: (n−2)×180° = 720° → n−2 = 4 → n = 6."
        }
      ],
      "grade8": [
        {
          "question": "Solve for x: 2(x + 3) = 16. x = ______",
          "answer": "5",
          "explanation": "Distribute: 2x + 6 = 16. Subtract 6: 2x = 10. Divide by 2: x = 5."
        },
        {
          "question": "Calculate: √64 + √25 = ______",
          "answer": "13",
          "explanation": "√64 = 8, √25 = 5. Sum: 8 + 5 = 13."
        },
        {
          "question": "Find the slope of the line passing through (2, 3) and (6, 7): ______",
          "answer": "1",
          "explanation": "Slope = (y₂−y₁)/(x₂−x₁) = (7−3)/(6−2) = 4/4 = 1."
        },
        {
          "question": "Solve: \\(\\frac{2x - 4}{3} = 6\\). x = ______",
          "answer": "11",
          "explanation": "Multiply both sides by 3: 2x − 4 = 18. Add 4: 2x = 22. Divide by 2: x = 11."
        },
        {
          "question": "What is the value of \\(5^0 + 2^3\\)? ______",
          "answer": "9",
          "explanation": "Any non-zero number to the power 0 is 1. So 5⁰ = 1, 2³ = 8. Sum: 1 + 8 = 9."
        },
        {
          "question": "If y varies directly with x, and y = 12 when x = 4, find y when x = 7: ______",
          "answer": "21",
          "explanation": "Direct variation: y = kx. Find k: 12 = k×4 → k = 3. Then y = 3×7 = 21."
        },
        {
          "question": "Expand: (x + 5)(x − 2) = ______",
          "answer": "x^2 + 3x - 10",
          "explanation": "Use FOIL: x·x = x², x·(−2)=−2x, 5·x=5x, 5·(−2)=−10. Combine: x² + 3x − 10."
        },
        {
          "question": "The Pythagorean triple includes 5 and 12. The third side is ______.",
          "answer": "13",
          "explanation": "5² + 12² = 25 + 144 = 169 = 13². So the third side is 13."
        },
        {
          "question": "Solve the system: x + y = 10, x − y = 2. What is x? ______",
          "answer": "6",
          "explanation": "Add the equations: 2x = 12 → x = 6."
        },
        {
          "question": "What is the probability of rolling an even number on a standard die? ______",
          "answer": "1/2",
          "explanation": "Even numbers: 2, 4, 6 (3 outcomes). Total outcomes: 6. Probability = 3/6 = 1/2."
        }
      ]
    };

    // Global variables
    let currentGrade = '';
    let currentQuestionIndex = 0;

    // Grade selection buttons
    document.querySelectorAll('.grade-btn').forEach(button => {
      button.addEventListener('click', () => {
        currentGrade = button.dataset.grade;
        showRandomQuestion();
        document.getElementById('quizContainer').style.display = 'block';
      });
    });

    // Submit answer
    document.getElementById('submitBtn').addEventListener('click', checkAnswer);
    document.getElementById('answerInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkAnswer();
    });

    // New question button
    document.getElementById('newQuestionBtn').addEventListener('click', () => {
      showRandomQuestion();
    });

    // Function to display a random question from the selected grade
    function showRandomQuestion() {
      const questions = questionsData[currentGrade];
      if (!questions || questions.length === 0) return;

      currentQuestionIndex = Math.floor(Math.random() * questions.length);
      const q = questions[currentQuestionIndex];

      document.getElementById('question').textContent = q.question;
      document.getElementById('answerInput').value = '';
      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').className = 'feedback';
      document.getElementById('explanation').style.display = 'none';
      document.getElementById('newQuestionBtn').style.display = 'none';
    }

    // Function to check the user's answer
    function checkAnswer() {
      const userAnswer = document.getElementById('answerInput').value.trim();
      const correctAnswer = questionsData[currentGrade][currentQuestionIndex].answer;
      const explanation = questionsData[currentGrade][currentQuestionIndex].explanation;

      if (userAnswer.toLowerCase() === correctAnswer.toLowerCase()) {
        document.getElementById('feedback').textContent = '✅ Correct!';
        document.getElementById('feedback').className = 'feedback correct';
      } else {
        document.getElementById('feedback').textContent = '❌ Incorrect!';
        document.getElementById('feedback').className = 'feedback incorrect';
      }

      document.getElementById('explanation').textContent = explanation;
      document.getElementById('explanation').style.display = 'block';
      document.getElementById('newQuestionBtn').style.display = 'inline-block';
    }
  </script>
</body>
</html>
