<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello</title>
    <style>
        .mydiv {
            color: gold;
        }
    </style>
</head>
<body>
    <h1>Hello, SW!</h1>
    <p>This is a paragraph before the div.</p>
    <div class="mydiv">
        <p>This is a paragraph inside the div.</p>
    </div>
    <p>This is a paragraph after the div.</p>
    <script>
        console.log("Hello from JS!");
        // NEW: Set the element's background color (backgroundColor) to green via JS
        document.getElementsByClassName("mydiv")[0].style.backgroundColor = "Black";
    </script>
</body>
</html>
