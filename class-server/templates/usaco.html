<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USACO 题目链接</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #1e3c72;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .subtitle {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 40px;
        }

        .link-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 30px;
            margin: 20px 0;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .link-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .link-box a {
            color: #fff;
            text-decoration: none;
            font-size: 1.5em;
            font-weight: 600;
            word-break: break-all;
        }

        .link-box a:hover {
            text-decoration: underline;
        }

        .link-title {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .ip-info {
            margin-top: 40px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
            color: #666;
            font-size: 0.9em;
        }

        .icon {
            font-size: 3em;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🏆</div>
        <h1>USACO 题目链接</h1>
        <p class="subtitle">点击以下链接访问题目</p>

        <div class="link-box">
            <div class="link-title">USACO Problem</div>
            <a href="https://usaco.org/index.php?page=viewproblem2&cpid=711" target="_blank">
                https://usaco.org/index.php?page=viewproblem2&cpid=711
            </a>
        </div>

        <div class="ip-info">
            <p>💡 提示：点击链接会在新标签页打开题目</p>
        </div>
    </div>
</body>
</html>
