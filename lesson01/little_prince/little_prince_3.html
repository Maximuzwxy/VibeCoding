<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Little Prince – Animated Colors</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cormorant Garamond', serif;
            background: linear-gradient(135deg, #f8f4e9 0%, #f0e6d2 100%);
            color: #3a3226;
            line-height: 1.7;
            padding: 40px 20px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(6px);
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            padding: 45px;
            position: relative;
            overflow: hidden;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #c9a97e, #a88c6b, #c9a97e);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            text-align: center;
            font-size: 2.9rem;
            color: #5d4037;
            margin-bottom: 30px;
            letter-spacing: 1px;
            position: relative;
            padding-bottom: 22px;
            animation: titleGlow 3s infinite alternate;
        }

        @keyframes titleGlow {
            from { text-shadow: 0 0 8px rgba(201, 169, 126, 0.3); }
            to { text-shadow: 0 0 16px rgba(201, 169, 126, 0.6); }
        }

        h1::after {
            content: "✦";
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            box-shadow: 0 3px 8px rgba(0,0,0,0.12);
            color: #c9a97e;
            font-size: 1.3rem;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-8px); }
        }

        .instructions {
            background: #f9f5ee;
            padding: 22px;
            border-radius: 12px;
            margin: 30px 0;
            border-left: 4px solid #c9a97e;
            font-style: italic;
            color: #5d4037;
            font-size: 1.05rem;
            line-height: 1.6;
            opacity: 0;
            animation: slideIn 0.8s forwards 0.3s;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 26px;
            margin: 40px 0;
            flex-wrap: wrap;
            opacity: 0;
            animation: slideIn 0.8s forwards 0.5s;
        }

        button {
            padding: 15px 34px;
            font-size: 1.18rem;
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.18);
            position: relative;
            overflow: hidden;
            z-index: 1;
            transform: scale(1);
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(100%);
            transition: transform 0.5s ease;
            z-index: -1;
        }

        button:hover::before {
            transform: translateY(0);
        }

        #textColorBtn {
            background: linear-gradient(135deg, #8e44ad 0%, #3498db 100%);
            color: white;
        }

        #bgColorBtn {
            background: linear-gradient(135deg, #e74c3c 0%, #f39c12 100%);
            color: white;
        }

        button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.28);
        }

        button:active {
            transform: translateY(0) scale(1);
        }

        /* Paragraph animations */
        .paragraph {
            padding: 24px;
            margin: 24px 0;
            border-radius: 16px;
            font-size: 1.22rem;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(15px);
            transition: 
                background-color 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                color 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                transform 0.5s ease,
                opacity 0.5s ease;
        }

        .paragraph.appear {
            opacity: 1;
            transform: translateY(0);
        }

        .paragraph::before {
            content: "";
            position: absolute;
            top: 12px;
            left: 12px;
            font-size: 5.2rem;
            opacity: 0.09;
            font-family: Georgia, serif;
            line-height: 1;
            transition: opacity 0.4s ease;
        }

        .paragraph:hover::before {
            opacity: 0.15;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            color: #7d664e;
            font-style: italic;
            font-size: 1.12rem;
            padding-top: 22px;
            border-top: 1px dashed #e0d6c5;
            opacity: 0;
            animation: fadeIn 1s forwards 1.2s;
        }

        /* Color change animation effect */
        .color-change {
            animation: pulseColor 0.7s ease-out;
        }

        @keyframes pulseColor {
            0% { transform: scale(1); }
            50% { transform: scale(1.015); }
            100% { transform: scale(1); }
        }

        @media (max-width: 600px) {
            .container {
                padding: 28px 20px;
            }
            
            h1 {
                font-size: 2.3rem;
            }
            
            .paragraph {
                font-size: 1.12rem;
                padding: 20px;
            }
            
            button {
                padding: 13px 26px;
                font-size: 1.05rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>The Little Prince</h1>
        
        <div class="instructions">
            <p>Click the buttons below to randomly change text colors or background colors of the paragraphs. The system ensures text remains readable by avoiding identical text and background colors.</p>
        </div>
        
        <div class="controls">
            <button id="textColorBtn">Change Text Color</button>
            <button id="bgColorBtn">Change Background Color</button>
        </div>
        
        <div id="content">
            <!-- Paragraphs will be inserted here by JavaScript -->
        </div>
        
        <div class="footer">
            <p>Excerpts from <em>“The Little Prince”</em> by Antoine de Saint-Exupéry</p>
        </div>
    </div>

    <script>
        const excerpts = [
            "All grown-ups were once children... but only few of them remember it.",
            "It is only with the heart that one can see rightly; what is essential is invisible to the eye.",
            "The most beautiful things in the world cannot be seen or touched, they are felt with the heart.",
            "You become responsible, forever, for what you have tamed.",
            "Grown-ups never understand anything by themselves, and it is tiresome for children to be always and forever explaining things to them.",
            "What makes the desert beautiful is that somewhere it hides a well.",
            "It is the time you have wasted for your rose that makes your rose so important.",
            "One sees clearly only with the heart. Anything essential is invisible to the eyes.",
            "The stars are beautiful because of a flower that cannot be seen.",
            "You're beautiful, but you're empty... One could not die for you."
        ];
        
        const textColors = [
            '#000000', '#2E294E', '#1B998B', '#D90368', 
            '#FF9A00', '#005F73', '#9B2226', '#AE2012',
            '#003049', '#6A040F', '#5D4037'
        ];
        
        const bgColors = [
            '#FFFFFF', '#FDF0D5', '#FFEEAD', '#C1FBA4', 
            '#A0E7E5', '#BDE0FE', '#FFCAD4', '#E2E2B6',
            '#FFE0B5', '#D8F3DC', '#F9F5EE'
        ];
        
        const contentDiv = document.getElementById('content');
        const paragraphs = [];
        
        // Create paragraphs with staggered animation
        excerpts.forEach((excerpt, index) => {
            const p = document.createElement('p');
            p.className = 'paragraph';
            p.textContent = excerpt;
            contentDiv.appendChild(p);
            paragraphs.push(p);
            
            // Staggered appearance
            setTimeout(() => {
                p.classList.add('appear');
            }, 200 + index * 100);
        });
        
        function getRandomColor(colorArray) {
            return colorArray[Math.floor(Math.random() * colorArray.length)];
        }
        
        function getContrastingTextColor(bgColor) {
            const hex = bgColor.replace('#', '');
            if (hex.length !== 6) return '#000000';
            const r = parseInt(hex.substr(0, 2), 16);
            const g = parseInt(hex.substr(2, 2), 16);
            const b = parseInt(hex.substr(4, 2), 16);
            const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            return luminance > 0.6 ? '#000000' : '#FFFFFF';
        }
        
        // Add animation class during color changes
        function animateElement(element) {
            element.classList.remove('color-change');
            // Trigger reflow
            void element.offsetWidth;
            element.classList.add('color-change');
        }
        
        document.getElementById('textColorBtn').addEventListener('click', () => {
            paragraphs.forEach(paragraph => {
                let newTextColor;
                let currentBg = paragraph.style.backgroundColor || '#FFFFFF';
                
                if (currentBg.startsWith('rgb')) {
                    const match = currentBg.match(/\d+/g);
                    if (match && match.length >= 3) {
                        const r = parseInt(match[0]).toString(16).padStart(2, '0');
                        const g = parseInt(match[1]).toString(16).padStart(2, '0');
                        const b = parseInt(match[2]).toString(16).padStart(2, '0');
                        currentBg = `#${r}${g}${b}`;
                    } else {
                        currentBg = '#FFFFFF';
                    }
                }
                
                do {
                    newTextColor = getRandomColor(textColors);
                } while (newTextColor.toLowerCase() === currentBg.toLowerCase());
                
                paragraph.style.color = newTextColor;
                animateElement(paragraph);
            });
        });
        
        document.getElementById('bgColorBtn').addEventListener('click', () => {
            paragraphs.forEach(paragraph => {
                let newBgColor;
                let currentText = paragraph.style.color || '#000000';
                
                do {
                    newBgColor = getRandomColor(bgColors);
                } while (newBgColor.toLowerCase() === currentText.toLowerCase());
                
                paragraph.style.backgroundColor = newBgColor;
                const contrastingColor = getContrastingTextColor(newBgColor);
                paragraph.style.color = contrastingColor;
                animateElement(paragraph);
            });
        });
        
        // Initialize with colors after a short delay for better visual effect
        setTimeout(() => {
            document.getElementById('textColorBtn').click();
            setTimeout(() => {
                document.getElementById('bgColorBtn').click();
            }, 300);
        }, 800);
    </script>
</body>
</html>
