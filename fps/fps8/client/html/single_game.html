<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPS8 - 单机游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #crosshair {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 20px; height: 20px;
            pointer-events: none; z-index: 100;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(255,255,255,0.8);
        }
        #crosshair::before {
            width: 2px; height: 100%; left: 50%; transform: translateX(-50%);
        }
        #crosshair::after {
            height: 2px; width: 100%; top: 50%; transform: translateY(-50%);
        }
    </style>
</head>
<body>
    <canvas id="scene-canvas"></canvas>
    <div id="crosshair"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/audio/AudioManager.js"></script>
    <script src="../js/config/SkeletonConfig.js"></script>
    <script src="../js/config/CharacterConfig.js"></script>
    <script src="../js/skeleton/SkeletonFactory.js"></script>
    <script src="../js/skeleton/SkeletonAnimator.js"></script>
    <script src="../js/core/MapGenerator.js"></script>
    <script src="../js/core/Character.js"></script>
    <script src="../js/core/NPC.js"></script>
    <script src="../js/core/NPCAI.js"></script>
    <script src="../js/core/Player.js"></script>
    <script src="../js/game_single.js"></script>
</body>
</html>
