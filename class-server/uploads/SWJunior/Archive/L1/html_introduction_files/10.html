<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello</title>
</head>
<body>
    <h1>Hello, world!</h1>
    <p>This is a paragraph before the div.</p>
    <div class="mydiv">
        <p>This is a paragraph inside the div.</p>
    </div>
    <p>This is a paragraph after the div.</p>
    <div class="mydiv">
        <p>This is a paragraph inside the second div.</p>
    </div>
    <!-- NEW: A button that calls the change_color() function when clicked -->
    <button onClick="change_color()">Change Color</button>
    <script>
        console.log("Hello from JS!");
        // NEW: change_color function randomly picks colors using Math.random()
        // Randomly sets both backgroundColor and color for each div
        function change_color () {
            let divs = document.getElementsByClassName("mydiv");
            for (let div of divs) {
                div.style.backgroundColor = ["Gold", "Purple", "Cyan"][Math.floor(Math.random() * 3)];
                div.style.color = ["black", "blue", "white"][Math.floor(Math.random() * 3)];
            }
        }
    </script>
</body>
</html>
