<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            user-select: none;
        }
        .container {
            background: #deb887;
            padding: 30px 40px 40px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 0 2px #8b6914, 0 0 0 6px #654321;
        }
        h1 {
            text-align: center;
            font-size: 28px;
            color: #4a2800;
            margin-bottom: 15px;
            letter-spacing: 6px;
            text-shadow: 1px 1px 2px rgba(255,255,200,0.3);
            font-weight: bold;
        }
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 8px;
            background: #dcb35c;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.15);
            cursor: pointer;
        }
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 18px;
            padding: 0 5px;
        }
        .turn-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.08);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            color: #3a1f00;
        }
        .turn-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: inline-block;
            border: 2px solid rgba(0,0,0,0.2);
            transition: background 0.2s;
        }
        .turn-dot.black {
            background: #222;
        }
        .turn-dot.white {
            background: #f5f5f5;
        }
        .turn-text {
            min-width: 60px;
        }
        .restart-btn {
            padding: 10px 28px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background: #4a2800;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.25s;
            letter-spacing: 2px;
            box-shadow: 0 4px 0 #2a1500;
        }
        .restart-btn:hover {
            background: #6b3a00;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #2a1500;
        }
        .restart-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #2a1500;
        }
        .status-message {
            margin-top: 12px;
            font-size: 20px;
            font-weight: bold;
            color: #3a1f00;
            text-align: center;
            min-height: 32px;
            padding: 4px 20px;
            border-radius: 30px;
            background: rgba(0,0,0,0.05);
        }
        .status-message.win {
            color: #c0392b;
            animation: pulse 0.6s ease-in-out infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }
        .footer {
            margin-top: 10px;
            font-size: 13px;
            color: #7a5a30;
            text-align: center;
        }
        @media (max-width: 600px) {
            .container {
                padding: 15px 15px 20px 15px;
            }
            h1 { font-size: 22px; }
            .info-bar { flex-wrap: wrap; justify-content: center; gap: 10px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚫ 五子棋 ⚪</h1>
    <div class="game-wrapper">
        <canvas id="boardCanvas"></canvas>
        <div class="info-bar">
            <div class="turn-indicator">
                <span>回合:</span>
                <span class="turn-dot black" id="turnDot"></span>
                <span class="turn-text" id="turnText">黑棋</span>
            </div>
            <button class="restart-btn" id="restartBtn">🔄 重新开始</button>
        </div>
        <div class="status-message" id="statusMsg"></div>
        <div class="footer">点击棋盘落子 · 黑白轮流 · 五子连珠即胜</div>
    </div>
</div>

<script>
    (function() {
        // ----- 配置 -----
        const BOARD_SIZE = 15;          // 15x15 标准五子棋
        const CELL_SIZE = 36;           // 每格像素
        const PADDING = 28;             // 棋盘边距
        const PIECE_RADIUS = 14;        // 棋子半径
        const CANVAS_SIZE = PADDING * 2 + CELL_SIZE * (BOARD_SIZE - 1);

        // ----- DOM -----
        const canvas = document.getElementById('boardCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = CANVAS_SIZE;
        canvas.height = CANVAS_SIZE;

        const turnDot = document.getElementById('turnDot');
        const turnText = document.getElementById('turnText');
        const statusMsg = document.getElementById('statusMsg');

        // ----- 状态 -----
        let board = [];                 // 0=空, 1=黑, 2=白
        let currentPlayer = 1;          // 1=黑, 2=白
        let gameOver = false;
        let winLine = null;             // [{r, c}, ...] 获胜连线
        let moveHistory = [];           // [{r, c, player}, ...]

        // ----- 初始化棋盘 -----
        function initBoard() {
            board = [];
            for (let r = 0; r < BOARD_SIZE; r++) {
                board[r] = new Array(BOARD_SIZE).fill(0);
            }
            currentPlayer = 1;
            gameOver = false;
            winLine = null;
            moveHistory = [];
            updateTurnDisplay();
            statusMsg.textContent = '';
            statusMsg.className = 'status-message';
        }

        // ----- 绘制棋盘 -----
        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 背景木纹色
            ctx.fillStyle = '#dcb35c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 画网格线
            ctx.strokeStyle = '#6b4226';
            ctx.lineWidth = 1.2;
            for (let i = 0; i < BOARD_SIZE; i++) {
                const x = PADDING + i * CELL_SIZE;
                const y = PADDING + i * CELL_SIZE;
                ctx.beginPath();
                ctx.moveTo(PADDING, y);
                ctx.lineTo(PADDING + (BOARD_SIZE - 1) * CELL_SIZE, y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x, PADDING);
                ctx.lineTo(x, PADDING + (BOARD_SIZE - 1) * CELL_SIZE);
                ctx.stroke();
            }

            // 画星位 (天元 & 小目)
            const starPoints = [
                [3,3], [3,7], [3,11],
                [7,3], [7,7], [7,11],
                [11,3], [11,7], [11,11]
            ];
            ctx.fillStyle = '#6b4226';
            for (const [r, c] of starPoints) {
                const x = PADDING + c * CELL_SIZE;
                const y = PADDING + r * CELL_SIZE;
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            // 画所有棋子
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c] !== 0) {
                        drawPiece(r, c, board[r][c], false);
                    }
                }
            }

            // 画获胜连线高亮
            if (winLine) {
                for (const pos of winLine) {
                    drawPiece(pos.r, pos.c, board[pos.r][pos.c], true);
                }
                // 画获胜连线
                if (winLine.length >= 2) {
                    const first = winLine[0];
                    const last = winLine[winLine.length - 1];
                    const x1 = PADDING + first.c * CELL_SIZE;
                    const y1 = PADDING + first.r * CELL_SIZE;
                    const x2 = PADDING + last.c * CELL_SIZE;
                    const y2 = PADDING + last.r * CELL_SIZE;
                    ctx.strokeStyle = '#ffd700';
                    ctx.lineWidth = 3;
                    ctx.shadowColor = '#ff6600';
                    ctx.shadowBlur = 12;
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
            }

            // 边框装饰
            ctx.strokeStyle = '#8b6914';
            ctx.lineWidth = 3;
            ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);
        }

        // ----- 画棋子 -----
        function drawPiece(row, col, player, highlight) {
            const x = PADDING + col * CELL_SIZE;
            const y = PADDING + row * CELL_SIZE;
            const radius = PIECE_RADIUS;

            ctx.shadowColor = 'rgba(0,0,0,0.4)';
            ctx.shadowBlur = highlight ? 18 : 6;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;

            // 棋子渐变
            const gradient = ctx.createRadialGradient(
                x - radius * 0.3, y - radius * 0.3, radius * 0.1,
                x, y, radius
            );
            if (player === 1) { // 黑棋
                gradient.addColorStop(0, '#555');
                gradient.addColorStop(0.6, '#222');
                gradient.addColorStop(1, '#000');
            } else { // 白棋
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(0.6, '#f0f0f0');
                gradient.addColorStop(1, '#cccccc');
            }

            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();

            // 边框
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
            ctx.strokeStyle = player === 1 ? '#111' : '#999';
            ctx.lineWidth = 1;
            ctx.stroke();

            // 高亮光环
            if (highlight) {
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 3;
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(x, y, radius + 3, 0, Math.PI * 2);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }

        // ----- 更新回合显示 -----
        function updateTurnDisplay() {
            if (gameOver) return;
            const isBlack = currentPlayer === 1;
            turnDot.className = 'turn-dot ' + (isBlack ? 'black' : 'white');
            turnText.textContent = isBlack ? '黑棋' : '白棋';
        }

        // ----- 检查胜利 (五子连珠) -----
        function checkWin(row, col, player) {
            const directions = [
                [0, 1],   // 水平
                [1, 0],   // 垂直
                [1, 1],   // 主对角线
                [1, -1]   // 副对角线
            ];

            for (const [dr, dc] of directions) {
                let cells = [{ r: row, c: col }];

                // 正方向延伸
                for (let step = 1; step < 5; step++) {
                    const nr = row + dr * step;
                    const nc = col + dc * step;
                    if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE) break;
                    if (board[nr][nc] !== player) break;
                    cells.push({ r: nr, c: nc });
                }
                // 反方向延伸
                for (let step = 1; step < 5; step++) {
                    const nr = row - dr * step;
                    const nc = col - dc * step;
                    if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE) break;
                    if (board[nr][nc] !== player) break;
                    cells.push({ r: nr, c: nc });
                }

                if (cells.length >= 5) {
                    // 排序使连线有序 (从一端到另一端)
                    cells.sort((a, b) => {
                        if (a.r !== b.r) return a.r - b.r;
                        return a.c - b.c;
                    });
                    return cells;
                }
            }
            return null;
        }

        // ----- 检查是否平局 -----
        function isBoardFull() {
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c] === 0) return false;
                }
            }
            return true;
        }

        // ----- 落子逻辑 -----
        function placePiece(row, col) {
            // 边界 / 已有子 / 游戏结束
            if (row < 0 || row >= BOARD_SIZE || col < 0 || col >= BOARD_SIZE) return false;
            if (board[row][col] !== 0) return false;
            if (gameOver) return false;

            // 落子
            board[row][col] = currentPlayer;
            moveHistory.push({ r: row, c: col, player: currentPlayer });

            // 检查胜利
            const winCells = checkWin(row, col, currentPlayer);
            if (winCells) {
                gameOver = true;
                winLine = winCells;
                const winner = currentPlayer === 1 ? '黑棋' : '白棋';
                statusMsg.textContent = `🏆 ${winner} 获胜！`;
                statusMsg.className = 'status-message win';
                drawBoard();
                return true;
            }

            // 检查平局
            if (isBoardFull()) {
                gameOver = true;
                statusMsg.textContent = '🤝 平局！';
                statusMsg.className = 'status-message';
                drawBoard();
                return true;
            }

            // 切换玩家
            currentPlayer = currentPlayer === 1 ? 2 : 1;
            updateTurnDisplay();
            drawBoard();
            return true;
        }

        // ----- 悔棋 (简单的) -----
        function undoMove() {
            if (moveHistory.length === 0) return;
            if (gameOver && winLine) {
                // 如果游戏结束且赢了，需要重置游戏结束状态
                gameOver = false;
                winLine = null;
                statusMsg.textContent = '';
                statusMsg.className = 'status-message';
            }
            const last = moveHistory.pop();
            board[last.r][last.c] = 0;
            currentPlayer = last.player;
            updateTurnDisplay();
            drawBoard();
            statusMsg.textContent = '';
            statusMsg.className = 'status-message';
        }

        // ----- 重新开始 -----
        function restartGame() {
            initBoard();
            drawBoard();
        }

        // ----- 鼠标/触摸事件 -----
        function handleCanvasClick(e) {
            if (gameOver) return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
                e.preventDefault();
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const canvasX = (clientX - rect.left) * scaleX;
            const canvasY = (clientY - rect.top) * scaleY;

            // 计算最近的交叉点
            const col = Math.round((canvasX - PADDING) / CELL_SIZE);
            const row = Math.round((canvasY - PADDING) / CELL_SIZE);

            // 检查点击是否在交叉点附近
            const cx = PADDING + col * CELL_SIZE;
            const cy = PADDING + row * CELL_SIZE;
            const dist = Math.sqrt((canvasX - cx) ** 2 + (canvasY - cy) ** 2);
            if (dist > CELL_SIZE * 0.45) return;

            placePiece(row, col);
        }

        canvas.addEventListener('click', handleCanvasClick);
        canvas.addEventListener('touchstart', handleCanvasClick, { passive: false });

        // ----- 键盘快捷键 -----
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                restartGame();
            }
            if ((e.key === 'z' || e.key === 'Z') && (e.ctrlKey || e.metaKey)) {
                undoMove();
            }
        });

        // ----- 重新开始按钮 -----
        document.getElementById('restartBtn').addEventListener('click', restartGame);

        // ----- 启动游戏 -----
        initBoard();
        drawBoard();

        // 窗口调整大小时保持清晰 (Retina适配)
        function handleResize() {
            // canvas 像素不变，只做CSS缩放
        }
        window.addEventListener('resize', handleResize);

        // 暴露一些方便调试
        window.gomoku = {
            board, currentPlayer, gameOver,
            restart: restartGame,
            undo: undoMove,
            place: placePiece
        };
    })();
</script>
</body>
</html>
