<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello</title>
    <style>
        .mydiv {
            color: orange;
        }
    </style>
</head>
<body>
    <h1>Hello, world!</h1>
    <p>This is a paragraph before the div.</p>
    <div class="mydiv">
        <p>This is a paragraph inside the div.</p>
    </div>
    <p>This is a paragraph after the div.</p>
    <!-- NEW: A second div, also using class="mydiv", observe how the style is reused -->
    <div class="mydiv">
        <p>This is a paragraph inside the second div.</p>
    </div>
    <script>
        console.log("Hello from JS!");
        document.getElementsByClassName("mydiv")[0].style.backgroundColor = "green";
    </script>
</body>
</html>
