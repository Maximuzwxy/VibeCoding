<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Pong</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }
    </script>
</head>
<body>
    <canvas id="game"></canvas>

    <button id="btn-start">Start Game</button>

    <div id="effects-bar"></div>

    <div id="hud">
        <div class="score">
            <div class="label">AI Green</div>
            <div class="value" id="player-score">0</div>
        </div>
        <div class="score">
            <div class="label">AI Red</div>
            <div class="value" id="cpu-score">0</div>
        </div>
    </div>

    <div id="overlay">
        <h1>3D PONG</h1>
        <p class="info">AI vs AI &bull; Drag to orbit &bull; Scroll to zoom &bull; First to <span>5</span> wins</p>
        <p class="info" style="font-size:14px;color:#666;">Click to start</p>
    </div>

    <script type="module">
import * as THREE from 'three';

// ==================== DOM ====================
const canvas = document.getElementById("game");
const overlay = document.getElementById("overlay");
const playerScoreEl = document.getElementById("player-score");
const cpuScoreEl = document.getElementById("cpu-score");

// ==================== THREE.JS SETUP ====================
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color("#0a0a1a");
scene.fog = new THREE.Fog("#0a0a1a", 15, 40);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(8, 6, 14);
camera.lookAt(0, 0, 0);

// Lighting
const ambient = new THREE.AmbientLight(0x334466, 1.5);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(5, 10, 8);
scene.add(dirLight);
const pointLight = new THREE.PointLight(0x4488ff, 30, 20);
pointLight.position.set(0, 0, -8);
scene.add(pointLight);
const pointLight2 = new THREE.PointLight(0xff4444, 30, 20);
pointLight2.position.set(0, 0, 8);
scene.add(pointLight2);

// ==================== ARENA CUBE ====================
const cubeSize = 12;
const halfCube = cubeSize / 2;

// Wireframe edges
const edgesGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize));
const edgesMat = new THREE.LineBasicMaterial({ color: 0x4488ff, linewidth: 1, transparent: true, opacity: 0.6 });
const wireframe = new THREE.LineSegments(edgesGeo, edgesMat);
scene.add(wireframe);

// Semi-transparent faces
const faceMat = new THREE.MeshPhysicalMaterial({
    color: 0x4488ff,
    metalness: 0,
    roughness: 0,
    transparent: true,
    opacity: 0.08,
    side: THREE.DoubleSide,
});
const faceGeo = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);
const faces = new THREE.Mesh(faceGeo, faceMat);
scene.add(faces);

// Corner glow spheres
for (let x = -1; x <= 1; x += 2) {
    for (let y = -1; y <= 1; y += 2) {
        for (let z = -1; z <= 1; z += 2) {
            const corner = new THREE.Mesh(
                new THREE.SphereGeometry(0.2, 8, 8),
                new THREE.MeshBasicMaterial({ color: 0x4488ff })
            );
            corner.position.set(x * halfCube, y * halfCube, z * halfCube);
            scene.add(corner);
        }
    }
}

// Floor grid inside cube
const gridHelper = new THREE.PolarGridHelper(halfCube - 0.5, 32, 20, 64, 0x334466, 0x223355);
scene.add(gridHelper);

// ==================== BALL ====================
const ballGeo = new THREE.SphereGeometry(0.4, 32, 32);
const ballMat = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    roughness: 0.2,
    metalness: 0.3,
    emissive: 0xffffff,
    emissiveIntensity: 0.5,
});
const ball = new THREE.Mesh(ballGeo, ballMat);
ball.castShadow = true;
scene.add(ball);

// Ball glow
const glowGeo = new THREE.SphereGeometry(0.55, 32, 32);
const glowMat = new THREE.MeshBasicMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.2,
});
const glow = new THREE.Mesh(glowGeo, glowMat);
ball.add(glow);

let ballPos = new THREE.Vector3(0, 0, 0);
let ballVel = new THREE.Vector3(0, 0, 0);

function resetBall(direction) {
    ballPos.set(0, 0, 0);
    const speed = 8;
    const angleH = (Math.random() - 0.5) * Math.PI * 0.6;
    const angleV = (Math.random() - 0.5) * Math.PI * 0.15;
    ballVel.set(
        Math.cos(angleH) * Math.cos(angleV) * speed * direction,
        Math.sin(angleV) * speed,
        Math.abs(Math.sin(angleH)) * Math.cos(angleV) * speed * direction
    );
}

// ==================== POWER-UP BLOCK ====================
let powerBlock, powerBlockActive = false, powerBlockRespawn = 0;
let extraBalls = [];
let frozen = { who: null, timer: 0 };
let activeEffects = [];

function createPowerBlock() {
    const geo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
    const mat = new THREE.MeshStandardMaterial({
        color: 0xffcc00,
        roughness: 0.2,
        metalness: 0.6,
        emissive: 0xffaa00,
        emissiveIntensity: 0.6,
    });
    const block = new THREE.Mesh(geo, mat);
    // Wireframe outline
    const edgeGeo = new THREE.EdgesGeometry(geo);
    const edgeMat = new THREE.LineBasicMaterial({ color: 0xffffff });
    const edges = new THREE.LineSegments(edgeGeo, edgeMat);
    block.add(edges);
    // Glow
    const glowGeo2 = new THREE.BoxGeometry(1.5, 1.5, 1.5);
    const glowMat2 = new THREE.MeshBasicMaterial({ color: 0xffcc00, transparent: true, opacity: 0.15 });
    const glowBlock = new THREE.Mesh(glowGeo2, glowMat2);
    block.add(glowBlock);
    scene.add(block);
    return block;
}

// Initialize power block
powerBlock = createPowerBlock();
powerBlock.visible = false;

function spawnPowerBlock() {
    if (powerBlockActive) return;
    powerBlock.position.set(
        (Math.random() - 0.5) * 8,
        (Math.random() - 0.5) * 8,
        0
    );
    powerBlock.visible = true;
    powerBlock.material.emissiveIntensity = 0.6;
    powerBlockActive = true;
}

// Power-up effects
function applyPowerUp() {
    const r = Math.random();
    let effectName = "";

    if (r < 0.25) {
        // Speed boost — ball speeds up 1.5x
        const currentSpeed = ballVel.length();
        ballVel.normalize().multiplyScalar(currentSpeed * 1.5);
        effectName = "SPEED";
    } else if (r < 0.5) {
        // Delete 2 points from opponent
        if (ballVel.z > 0) {
            // Ball heading toward CPU — delete from CPU
            cpuScore = Math.max(0, cpuScore - 2);
            effectName = "CPU -2 PTS";
        } else {
            // Ball heading toward player — delete from player
            playerScore = Math.max(0, playerScore - 2);
            effectName = "GREEN -2 PTS";
        }
        updateScoreboard();
    } else if (r < 0.75) {
        // Freeze opponent for 3 seconds
        if (ballVel.z > 0) {
            frozen.who = "cpu";
            effectName = "FREEZE RED";
        } else {
            frozen.who = "player";
            effectName = "FREEZE GREEN";
        }
        frozen.timer = 3;
    } else {
        // Split ball into 5 heading toward opponent
        const baseDir = ballVel.clone().normalize();
        const baseSpeed = ballVel.length();
        for (let i = -2; i <= 2; i++) {
            const spread = new THREE.Vector3(
                baseDir.x + i * 0.2,
                baseDir.y + i * 0.15,
                baseDir.z
            ).normalize().multiplyScalar(baseSpeed);
            // Ensure Z direction is toward the opponent
            if (ballVel.z > 0) spread.z = Math.abs(spread.z);
            else spread.z = -Math.abs(spread.z);
            extraBalls.push({
                pos: ballPos.clone().add(new THREE.Vector3(i * 0.3, 0, 0)),
                vel: spread,
                mesh: null
            });
        }
        // Keep original ball as one of the five
        ballVel.copy(extraBalls.shift().vel);
        // Create meshes for remaining extras
        extraBalls.forEach(eb => {
            const ebGeo = new THREE.SphereGeometry(0.3, 16, 16);
            const ebMesh = new THREE.Mesh(ebGeo, ballMat.clone());
            ebMesh.material.emissive = new THREE.Color(0xffaa00);
            scene.add(ebMesh);
            eb.mesh = ebMesh;
        });
        effectName = "SPLIT x5";
    }

    activeEffects.push({ name: effectName, timer: 2 });
}

// ==================== PADDLES ====================
const paddleRadius = 1.5;
const paddleGeo = new THREE.CylinderGeometry(paddleRadius, paddleRadius, 0.2, 32);
// Rotate so flat face points in Z direction
paddleGeo.rotateX(Math.PI / 2);

const playerPaddleMat = new THREE.MeshStandardMaterial({
    color: 0x44ff44,
    roughness: 0.3,
    metalness: 0.4,
    emissive: 0x44ff44,
    emissiveIntensity: 0.3,
});
const playerPaddle = new THREE.Mesh(paddleGeo, playerPaddleMat);
playerPaddle.castShadow = true;
playerPaddle.position.set(0, 0, -halfCube);
scene.add(playerPaddle);

const cpuPaddleMat = new THREE.MeshStandardMaterial({
    color: 0xff4444,
    roughness: 0.3,
    metalness: 0.4,
    emissive: 0xff4444,
    emissiveIntensity: 0.3,
});
const cpuPaddle = new THREE.Mesh(paddleGeo, cpuPaddleMat);
cpuPaddle.castShadow = true;
cpuPaddle.position.set(0, 0, halfCube);
scene.add(cpuPaddle);

// Paddle ring outlines
function makePaddleRing(colorHex) {
    const ringGeo = new THREE.TorusGeometry(paddleRadius, 0.06, 16, 48);
    const ringMat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.8 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    return ring;
}
const playerRing = makePaddleRing(0x44ff44);
playerRing.position.z = -halfCube + 0.11;
scene.add(playerRing);

const cpuRing = makePaddleRing(0xff4444);
cpuRing.position.z = halfCube - 0.11;
scene.add(cpuRing);

// ==================== PLAYER AI ====================
function updatePlayerAI() {
    const distToPlayer = halfCube + ballPos.z;
    const timeToReach = ballVel.z < 0 ? distToPlayer / Math.abs(ballVel.z) : 999;
    const predictedX = ballPos.x + ballVel.x * Math.min(timeToReach, 0.6);
    const predictedY = ballPos.y + ballVel.y * Math.min(timeToReach, 0.6);

    // Slightly different personality than CPU — faster tracking but a tiny delay
    const playerAISpeed = 7 + (playerScore * 0.6);
    const dx = predictedX - playerPaddle.position.x;
    const dy = predictedY - playerPaddle.position.y;

    playerPaddle.position.x += Math.sign(dx) * Math.min(Math.abs(dx), playerAISpeed * 0.016);
    playerPaddle.position.y += Math.sign(dy) * Math.min(Math.abs(dy), playerAISpeed * 0.016);

    const limit = halfCube - paddleRadius;
    playerPaddle.position.x = Math.max(-limit, Math.min(limit, playerPaddle.position.x));
    playerPaddle.position.y = Math.max(-limit + 1, Math.min(limit - 1, playerPaddle.position.y));

    playerRing.position.x = playerPaddle.position.x;
    playerRing.position.y = playerPaddle.position.y;
}

// ==================== TRAIL PARTICLES ====================
const trailParticles = [];
const MAX_TRAIL = 30;

function updateTrail() {
    // Add new particle at ball position
    const dot = new THREE.Mesh(
        new THREE.SphereGeometry(0.08, 4, 4),
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 })
    );
    dot.position.copy(ballPos);
    scene.add(dot);
    trailParticles.push({ mesh: dot, life: 0.5 });

    // Update existing particles
    for (let i = trailParticles.length - 1; i >= 0; i--) {
        const p = trailParticles[i];
        p.life -= 0.016;
        p.mesh.material.opacity = p.life * 1.2;
        p.mesh.scale.multiplyScalar(0.96);
        if (p.life <= 0) {
            scene.remove(p.mesh);
            trailParticles.splice(i, 1);
        }
    }
}

// ==================== GAME STATE ====================
let playerScore = 0, cpuScore = 0;
let gameRunning = false;
const MAX_SCORE = 5;

function updateScoreboard() {
    playerScoreEl.textContent = playerScore;
    cpuScoreEl.textContent = cpuScore;

    if (playerScore >= MAX_SCORE) {
        endGame("GREEN AI WINS!");
    } else if (cpuScore >= MAX_SCORE) {
        endGame("RED AI WINS!");
    }
}

function endGame(msg) {
    gameRunning = false;
    overlay.classList.remove("hidden");
    overlay.querySelector("h1").textContent = msg;
    overlay.querySelector(".info").innerHTML = 'Score: <span>' + playerScore + '</span> - <span>' + cpuScore + '</span>';
    overlay.querySelector("p:last-child").textContent = "Click to play again";
    playerScore = 0;
    cpuScore = 0;
    updateScoreboard();
    // Clean up
    extraBalls.forEach(eb => scene.remove(eb.mesh));
    extraBalls = [];
    if (powerBlock) powerBlock.visible = false;
    powerBlockActive = false;
    activeEffects = [];
    updateEffectsBar();
    frozen = { who: null, timer: 0 };
}

// ==================== INPUT ====================
const keys = {};
window.addEventListener("keydown", (e) => { keys[e.key.toLowerCase()] = true; });
window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

function startGame() {
    if (!gameRunning) {
        gameRunning = true;
        overlay.classList.add("hidden");
        playerScore = 0;
        cpuScore = 0;
        updateScoreboard();
        resetBall(1);
        // Clear extra balls
        extraBalls.forEach(eb => scene.remove(eb.mesh));
        extraBalls = [];
        // Reset effects
        frozen = { who: null, timer: 0 };
        activeEffects = [];
        updateEffectsBar();
        // Spawn first power block after 5 seconds
        powerBlockActive = false;
        powerBlockRespawn = 5;
    }
}

canvas.addEventListener("click", startGame);
overlay.addEventListener("click", startGame);
document.getElementById("btn-start").addEventListener("click", startGame);

// ==================== COLLISION ====================
function checkBallPaddleCollision(paddleZ, isPlayer) {
    const paddleX = isPlayer ? playerPaddle.position.x : cpuPaddle.position.x;
    const paddleY = isPlayer ? playerPaddle.position.y : cpuPaddle.position.y;

    // Check if ball is at the paddle's Z plane
    const ballEdge = ballPos.z + Math.sign(ballVel.z) * ball.geometry.parameters.radius;
    const paddleEdge = paddleZ - Math.sign(paddleZ) * 0.1;

    const prevBallZ = ballPos.z - ballVel.z * 0.016;

    // Check if ball crossed the paddle plane this frame
    if (isPlayer) {
        if (prevBallZ >= paddleEdge - 0.3 && ballPos.z <= paddleEdge + 0.1) {
            const dx = ballPos.x - paddleX;
            const dy = ballPos.y - paddleY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < paddleRadius) {
                // Hit! Reflect with angle based on hit position
                const angle = Math.atan2(dy, dx);
                const speed = ballVel.length() * 1.05;
                const hitFactor = dist / paddleRadius;
                ballVel.z = Math.abs(ballVel.z) * (1 + hitFactor * 0.3);
                ballVel.x = Math.cos(angle) * speed * 0.8;
                ballVel.y = Math.sin(angle) * speed * 1.0;
                // Clamp speed
                const maxSpeed = 14;
                if (ballVel.length() > maxSpeed) {
                    ballVel.normalize().multiplyScalar(maxSpeed);
                }
                ballPos.z = paddleEdge + 0.1;
                return true;
            }
        }
    } else {
        if (prevBallZ <= paddleEdge + 0.3 && ballPos.z >= paddleEdge - 0.1) {
            const dx = ballPos.x - paddleX;
            const dy = ballPos.y - paddleY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < paddleRadius) {
                const angle = Math.atan2(dy, dx);
                const speed = ballVel.length() * 1.05;
                const hitFactor = dist / paddleRadius;
                ballVel.z = -Math.abs(ballVel.z) * (1 + hitFactor * 0.3);
                ballVel.x = Math.cos(angle) * speed * 0.8;
                ballVel.y = Math.sin(angle) * speed * 1.0;
                const maxSpeed = 14;
                if (ballVel.length() > maxSpeed) {
                    ballVel.normalize().multiplyScalar(maxSpeed);
                }
                ballPos.z = paddleEdge - 0.1;
                return true;
            }
        }
    }
    return false;
}

// ==================== CPU AI ====================
function updateCPU() {
    const targetX = ballPos.x;
    const targetY = ballPos.y;

    // Predict where ball will be at CPU's Z plane
    const distToCPU = halfCube - ballPos.z;
    const timeToReach = ballVel.z > 0 ? distToCPU / ballVel.z : 999;
    const predictedX = ballPos.x + ballVel.x * Math.min(timeToReach, 0.5);
    const predictedY = ballPos.y + ballVel.y * Math.min(timeToReach, 0.5);

    const cpuSpeed = 6 + (cpuScore * 0.8);
    const dx = predictedX - cpuPaddle.position.x;
    const dy = predictedY - cpuPaddle.position.y;

    cpuPaddle.position.x += Math.sign(dx) * Math.min(Math.abs(dx), cpuSpeed * 0.016);
    cpuPaddle.position.y += Math.sign(dy) * Math.min(Math.abs(dy), cpuSpeed * 0.016);

    // Keep within cube bounds
    const limit = halfCube - paddleRadius;
    cpuPaddle.position.x = Math.max(-limit, Math.min(limit, cpuPaddle.position.x));
    cpuPaddle.position.y = Math.max(-limit + 1, Math.min(limit - 1, cpuPaddle.position.y));

    cpuRing.position.x = cpuPaddle.position.x;
    cpuRing.position.y = cpuPaddle.position.y;
}

// ==================== SCORING ====================
function checkScoring() {
    if (ballPos.z < -halfCube - 1) {
        // CPU scores
        cpuScore++;
        updateScoreboard();
        resetBall(1);
    } else if (ballPos.z > halfCube + 1) {
        // Player scores
        playerScore++;
        updateScoreboard();
        resetBall(-1);
    }
}

// ==================== UPDATE ====================
function update(dt) {
    dt = Math.min(dt, 0.05);

    // Update frozen timer
    if (frozen.timer > 0) {
        frozen.timer -= dt;
        if (frozen.timer <= 0) frozen.who = null;
    }

    // Update active effects display
    for (let i = activeEffects.length - 1; i >= 0; i--) {
        activeEffects[i].timer -= dt;
        if (activeEffects[i].timer <= 0) activeEffects.splice(i, 1);
    }
    updateEffectsBar();

    // Power block respawn
    if (!powerBlockActive) {
        powerBlockRespawn -= dt;
        if (powerBlockRespawn <= 0) spawnPowerBlock();
    }

    // Player AI (freeze check)
    if (frozen.who !== "player") updatePlayerAI();

    // Update CPU (freeze check)
    if (frozen.who !== "cpu") updateCPU();

    // Move main ball
    ballPos.x += ballVel.x * dt;
    ballPos.y += ballVel.y * dt;
    ballPos.z += ballVel.z * dt;

    // Bounce off X walls
    if (Math.abs(ballPos.x) > halfCube - 0.4) {
        ballPos.x = Math.sign(ballPos.x) * (halfCube - 0.4);
        ballVel.x *= -1;
    }

    // Bounce off Y walls
    if (Math.abs(ballPos.y) > halfCube - 0.4) {
        ballPos.y = Math.sign(ballPos.y) * (halfCube - 0.4);
        ballVel.y *= -1;
    }

    // Power block collision
    if (powerBlockActive) {
        const dist = ballPos.distanceTo(powerBlock.position);
        if (dist < 1.2) {
            applyPowerUp();
            powerBlock.visible = false;
            powerBlockActive = false;
            powerBlockRespawn = 3 + Math.random() * 4; // Respawn in 3-7 seconds
        }
    }

    // Paddle collisions
    checkBallPaddleCollision(-halfCube, true);
    checkBallPaddleCollision(halfCube, false);

    // Scoring
    checkScoring();

    // Update ball mesh
    ball.position.copy(ballPos);

    // --- Extra balls ---
    for (let i = extraBalls.length - 1; i >= 0; i--) {
        const eb = extraBalls[i];
        eb.pos.x += eb.vel.x * dt;
        eb.pos.y += eb.vel.y * dt;
        eb.pos.z += eb.vel.z * dt;

        // X walls
        if (Math.abs(eb.pos.x) > halfCube - 0.4) {
            eb.pos.x = Math.sign(eb.pos.x) * (halfCube - 0.4);
            eb.vel.x *= -1;
        }
        // Y walls
        if (Math.abs(eb.pos.y) > halfCube - 0.4) {
            eb.pos.y = Math.sign(eb.pos.y) * (halfCube - 0.4);
            eb.vel.y *= -1;
        }

        // Paddle collisions for extra balls
        checkExtraBallPaddle(eb, -halfCube, true);
        checkExtraBallPaddle(eb, halfCube, false);

        // Out of bounds
        if (eb.pos.z < -halfCube - 1 || eb.pos.z > halfCube + 1) {
            scene.remove(eb.mesh);
            extraBalls.splice(i, 1);
            continue;
        }

        eb.mesh.position.copy(eb.pos);
    }

    // Trail
    updateTrail();
}

function checkExtraBallPaddle(eb, paddleZ, isPlayer) {
    const px = isPlayer ? playerPaddle.position.x : cpuPaddle.position.x;
    const py = isPlayer ? playerPaddle.position.y : cpuPaddle.position.y;
    const edge = paddleZ - Math.sign(paddleZ) * 0.1;
    const prevZ = eb.pos.z - eb.vel.z * 0.016;

    if (isPlayer) {
        if (prevZ >= edge - 0.3 && eb.pos.z <= edge + 0.1) {
            const dx = eb.pos.x - px;
            const dy = eb.pos.y - py;
            if (Math.abs(dx) < paddleRadius + 0.4 && Math.abs(dy) < paddleRadius + 0.4) {
                eb.pos.z = edge;
                eb.vel.z = Math.abs(eb.vel.z);
                eb.vel.x += dx * 0.3;
                eb.vel.y += dy * 0.3;
            }
        }
    } else {
        if (prevZ <= edge + 0.3 && eb.pos.z >= edge - 0.1) {
            const dx = eb.pos.x - px;
            const dy = eb.pos.y - py;
            if (Math.abs(dx) < paddleRadius + 0.4 && Math.abs(dy) < paddleRadius + 0.4) {
                eb.pos.z = edge;
                eb.vel.z = -Math.abs(eb.vel.z);
                eb.vel.x += dx * 0.3;
                eb.vel.y += dy * 0.3;
            }
        }
    }
}

function updateEffectsBar() {
    const bar = document.getElementById("effects-bar");
    bar.innerHTML = activeEffects.map(e =>
        `<span class="effect-tag">${e.name} ${e.timer.toFixed(1)}s</span>`
    ).join("");
}

// ==================== RENDER LOOP ====================
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();

    if (gameRunning) {
        update(dt);
    }

    // Power block animation
    if (powerBlockActive && powerBlock) {
        powerBlock.rotation.x += 0.02;
        powerBlock.rotation.y += 0.03;
        powerBlock.material.emissiveIntensity = 0.4 + Math.sin(Date.now() * 0.005) * 0.3;
    }

    // Subtle wireframe color shift
    const hue = 0.6 + Math.sin(Date.now() * 0.0005) * 0.05;
    edgesMat.color.setHSL(hue, 0.8, 0.6);
    faceMat.color.setHSL(hue, 0.8, 0.5);

    applyOrbitCamera();
    renderer.render(scene, camera);
}

// ==================== RESIZE ====================
window.addEventListener("resize", () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
});

// ==================== ORBIT CONTROLS ====================
let orbitTarget = new THREE.Vector3(0, 0, 0);
let spherical = new THREE.Spherical();
let isDragging = false;
let isPanning = false;
let prevMouse = { x: 0, y: 0 };

function updateSpherical() {
    const offset = camera.position.clone().sub(orbitTarget);
    spherical.setFromVector3(offset);
}
updateSpherical();

canvas.addEventListener("mousedown", (e) => {
    if (e.button === 0) isDragging = true;
    if (e.button === 2) isPanning = true;
    prevMouse.x = e.clientX;
    prevMouse.y = e.clientY;
});

window.addEventListener("mouseup", () => { isDragging = false; isPanning = false; });

window.addEventListener("mousemove", (e) => {
    const dx = e.clientX - prevMouse.x;
    const dy = e.clientY - prevMouse.y;
    prevMouse.x = e.clientX;
    prevMouse.y = e.clientY;

    if (isDragging) {
        spherical.theta -= dx * 0.005;
        spherical.phi -= dy * 0.005;
        spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi));
    }
    if (isPanning) {
        const camDir = new THREE.Vector3();
        camera.getWorldDirection(camDir);
        const right = new THREE.Vector3().crossVectors(camDir, new THREE.Vector3(0, 1, 0)).normalize();
        const up = new THREE.Vector3(0, 1, 0);
        const panSpeed = 0.005 * spherical.radius;
        orbitTarget.addScaledVector(right, -dx * panSpeed);
        orbitTarget.addScaledVector(up, dy * panSpeed);
    }
});

canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    spherical.radius *= 1 + e.deltaY * 0.001;
    spherical.radius = Math.max(3, Math.min(40, spherical.radius));
}, { passive: false });

canvas.addEventListener("contextmenu", (e) => e.preventDefault());

function applyOrbitCamera() {
    const offset = new THREE.Vector3().setFromSpherical(spherical);
    camera.position.copy(orbitTarget).add(offset);
    camera.lookAt(orbitTarget);
}

animate();
    </script>
</body>
</html>
