<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Pong</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
  canvas { display: block; }

  #scoreboard {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 40px; z-index: 10; pointer-events: none;
  }
  #scoreboard > div {
    background: rgba(0,0,0,0.7); padding: 10px 24px; border-radius: 8px;
    font-size: 28px; font-weight: bold; text-align: center; min-width: 80px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  #player-score { color: #4fc3f7; text-shadow: 0 0 12px rgba(79,195,247,0.5); }
  #ai-score { color: #ff5252; text-shadow: 0 0 12px rgba(255,82,82,0.5); }

  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
  }
  #overlay h1 {
    font-size: 48px; color: #fff; text-shadow: 0 0 20px rgba(79,195,247,0.6);
    letter-spacing: 5px;
  }
  #overlay button {
    padding: 14px 40px; font-size: 22px; cursor: pointer;
    background: rgba(79,195,247,0.15); color: #4fc3f7;
    border: 2px solid #4fc3f7; border-radius: 8px;
    transition: all 0.2s; letter-spacing: 2px;
  }
  #overlay button:hover { background: rgba(79,195,247,0.3); transform: scale(1.05); }
  #overlay p { color: #aaa; font-size: 14px; }

  #message {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-size: 36px; font-weight: bold; z-index: 10; pointer-events: none;
    opacity: 0; transition: opacity 0.3s;
  }
  #message.show { opacity: 1; }
  .win { color: #4fc3f7; text-shadow: 0 0 20px rgba(79,195,247,0.6); }
  .lose { color: #ff5252; text-shadow: 0 0 20px rgba(255,82,82,0.6); }

  #info {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    color: #555; font-size: 12px; font-family: monospace;
    background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 4px;
    pointer-events: none; z-index: 5;
  }
</style>
</head>
<body>

<div id="scoreboard">
  <div id="player-score">0</div>
  <div id="ai-score">0</div>
</div>
<div id="message"></div>
<div id="overlay">
  <h1>3D PONG</h1>
  <button id="startBtn">开始游戏</button>
  <p>W/S 或 ↑↓ 移动球拍 | 先得 7 分获胜</p>
</div>
<div id="info">W/S / ↑↓ 移动球拍 | 拖拽旋转视角 | 球触碰道具盒获得效果</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Constants ──
const TABLE_W = 14, TABLE_D = 20, TABLE_H = 0.3;
const PADDLE_W = 2.5, PADDLE_H = 0.6, PADDLE_D = 0.3;
const BALL_R = 0.3;
const WIN_SCORE = 7;

// ── DOM ──
const elPlayerScore = document.getElementById('player-score');
const elAiScore = document.getElementById('ai-score');
const elMessage = document.getElementById('message');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

// ── Scene ──
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a14);
scene.fog = new THREE.Fog(0x0a0a14, 15, 40);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 14, 11);
camera.lookAt(0, 0, 2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// OrbitControls
const orbitControls = new OrbitControls(camera, renderer.domElement);
orbitControls.target.set(0, 0, 0);
orbitControls.enableDamping = true;
orbitControls.dampingFactor = 0.08;
orbitControls.minDistance = 8;
orbitControls.maxDistance = 30;
orbitControls.maxPolarAngle = Math.PI / 2.2;
orbitControls.update();

// ── Lights ──
const ambient = new THREE.AmbientLight(0x334466, 1);
scene.add(ambient);

const spotLight = new THREE.SpotLight(0xffffff, 30, 50, Math.PI / 5, 0.3, 0.5);
spotLight.position.set(0, 20, 5);
spotLight.castShadow = true;
spotLight.shadow.mapSize.set(1024, 1024);
spotLight.shadow.bias = -0.0003;
scene.add(spotLight);

const pointLight = new THREE.PointLight(0x4488ff, 8, 15);
pointLight.position.set(0, 3, -10);
scene.add(pointLight);

// ── Table ──
const tableGroup = new THREE.Group();
scene.add(tableGroup);

// Table top (felt texture)
function createFeltTexture() {
  const size = 512;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  // Base green felt color
  ctx.fillStyle = '#1a6b30';
  ctx.fillRect(0, 0, size, size);
  // Add noise grain for felt texture
  const imageData = ctx.getImageData(0, 0, size, size);
  const data = imageData.data;
  for (let i = 0; i < data.length; i += 4) {
    const noise = (Math.random() - 0.5) * 16;
    data[i] = Math.max(0, Math.min(255, data[i] + noise));
    data[i + 1] = Math.max(0, Math.min(255, data[i + 1] + noise));
    data[i + 2] = Math.max(0, Math.min(255, data[i + 2] - noise * 0.3));
  }
  ctx.putImageData(imageData, 0, 0);
  // Subtle horizontal fabric lines
  ctx.strokeStyle = 'rgba(0,0,0,0.04)';
  ctx.lineWidth = 1;
  for (let y = 0; y < size; y += 4) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(size, y);
    ctx.stroke();
  }
  return new THREE.CanvasTexture(canvas);
}

const feltTexture = createFeltTexture();
feltTexture.wrapS = THREE.RepeatWrapping;
feltTexture.wrapT = THREE.RepeatWrapping;
feltTexture.repeat.set(2, 4);

const topGeo = new THREE.BoxGeometry(TABLE_W, TABLE_H, TABLE_D);
const topMat = new THREE.MeshStandardMaterial({
  map: feltTexture,
  color: 0xffffff,
  roughness: 0.85,
  metalness: 0.0,
});
const top = new THREE.Mesh(topGeo, topMat);
top.position.y = TABLE_H / 2;
top.castShadow = true;
top.receiveShadow = true;
tableGroup.add(top);

// Table legs
const legGeo = new THREE.CylinderGeometry(0.2, 0.2, 2, 8);
const legMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.5, metalness: 0.6 });
const legPositions = [
  [-TABLE_W/2 + 0.5, -1, -TABLE_D/2 + 0.5],
  [TABLE_W/2 - 0.5, -1, -TABLE_D/2 + 0.5],
  [-TABLE_W/2 + 0.5, -1, TABLE_D/2 - 0.5],
  [TABLE_W/2 - 0.5, -1, TABLE_D/2 - 0.5],
];
legPositions.forEach(([x, y, z]) => {
  const leg = new THREE.Mesh(legGeo, legMat);
  leg.position.set(x, y, z);
  leg.castShadow = true;
  tableGroup.add(leg);
});

// Table edges (walls on sides)
const edgeGeo = new THREE.BoxGeometry(0.3, 1.5, TABLE_D);
const edgeMat = new THREE.MeshStandardMaterial({ color: 0x336644, roughness: 0.4 });
const leftEdge = new THREE.Mesh(edgeGeo, edgeMat);
leftEdge.position.set(-TABLE_W/2 - 0.15, 0.9, 0);
leftEdge.receiveShadow = true;
tableGroup.add(leftEdge);
const rightEdge = new THREE.Mesh(edgeGeo, edgeMat);
rightEdge.position.set(TABLE_W/2 + 0.15, 0.9, 0);
rightEdge.receiveShadow = true;
tableGroup.add(rightEdge);

// Net line
const netGeo = new THREE.BoxGeometry(TABLE_W + 0.2, 0.08, 0.08);
const netMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.3 });
const net = new THREE.Mesh(netGeo, netMat);
net.position.y = TABLE_H + 0.04;
tableGroup.add(net);

// Table markings
const lineGeo = new THREE.PlaneGeometry(TABLE_W * 0.9, 0.06);
const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.5 });
const centerLine = new THREE.Mesh(lineGeo, lineMat);
centerLine.rotation.x = -Math.PI / 2;
centerLine.position.y = TABLE_H + 0.005;
tableGroup.add(centerLine);

// ── Floor ──
const floorGeo = new THREE.PlaneGeometry(25, 35);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.8 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -3;
floor.receiveShadow = true;
scene.add(floor);

// Grid on floor
const gridHelper = new THREE.GridHelper(30, 30, 0x222244, 0x222244);
gridHelper.position.y = -2.99;
scene.add(gridHelper);

// ── Paddles ──
const paddleGeo = new THREE.BoxGeometry(PADDLE_W, PADDLE_H, PADDLE_D);
const playerPaddleMat = new THREE.MeshStandardMaterial({
  color: 0x4fc3f7, roughness: 0.2, metalness: 0.5, emissive: 0x4fc3f7, emissiveIntensity: 0.3
});
const aiPaddleMat = new THREE.MeshStandardMaterial({
  color: 0xff5252, roughness: 0.2, metalness: 0.5, emissive: 0xff5252, emissiveIntensity: 0.3
});

const playerPaddle = new THREE.Mesh(paddleGeo, playerPaddleMat);
playerPaddle.position.set(0, TABLE_H + PADDLE_H / 2, TABLE_D / 2 - 1);
playerPaddle.castShadow = true;
scene.add(playerPaddle);

const aiPaddle = new THREE.Mesh(paddleGeo, aiPaddleMat);
aiPaddle.position.set(0, TABLE_H + PADDLE_H / 2, -TABLE_D / 2 + 1);
aiPaddle.castShadow = true;
scene.add(aiPaddle);

// ── Ball ──
const ballGeo = new THREE.SphereGeometry(BALL_R, 32, 32);
const ballMat = new THREE.MeshStandardMaterial({
  color: 0xffffff, roughness: 0.1, metalness: 0.3, emissive: 0xffffff, emissiveIntensity: 0.5
});
const ball = new THREE.Mesh(ballGeo, ballMat);
ball.position.set(0, TABLE_H + BALL_R, 0);
ball.castShadow = true;
scene.add(ball);

// Ball glow
const glowGeo = new THREE.SphereGeometry(BALL_R * 1.5, 16, 16);
const glowMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15 });
const glow = new THREE.Mesh(glowGeo, glowMat);
ball.add(glow);

// Ball trail
const trailParticles = [];
const maxTrail = 20;

function spawnTrailParticle() {
  const geo = new THREE.SphereGeometry(BALL_R * 0.5, 8, 8);
  const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.4 });
  const p = new THREE.Mesh(geo, mat);
  p.position.copy(ball.position);
  p.userData.life = 1;
  scene.add(p);
  trailParticles.push(p);
}

// ── Game state ──
let playerScore = 0, aiScore = 0;
let ballVX = 0, ballVY = 0;
let gameRunning = false;
let gameOver = false;
const keys = {};

// ── Power-up system ──
const powerUps = [];
const POWERUP_TYPES = [
  { name: '加速', color: 0xff4444, icon: '⚡', effect: 'speedUp' },
  { name: '减速', color: 0x4488ff, icon: '🐢', effect: 'slowDown' },
  { name: '变大', color: 0x44ff44, icon: '⬆', effect: 'enlarge' },
  { name: '缩小', color: 0xff8800, icon: '⬇', effect: 'shrink' },
  { name: '双倍分', color: 0xffdd00, icon: '×2', effect: 'doubleScore' },
];
let activeEffects = { player: null, ai: null };
let powerUpTimer = 0;
const POWERUP_SPAWN_INTERVAL = 180; // frames
const POWERUP_DURATION = 300; // frames

function spawnPowerUp() {
  if (powerUps.length >= 4) return;
  const type = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
  const side = Math.random() < 0.5 ? 'player' : 'ai';
  const z = side === 'player' ? TABLE_D / 2 - 1 : -(TABLE_D / 2 - 1);
  const x = (Math.random() - 0.5) * (TABLE_W - 0.8);
  const y = TABLE_H + 0.25;

  const geo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
  const mat = new THREE.MeshStandardMaterial({
    color: type.color,
    emissive: type.color,
    emissiveIntensity: 0.8,
    roughness: 0.2,
    metalness: 0.3,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  scene.add(mesh);

  powerUps.push({ mesh, type, side, x, z, life: POWERUP_DURATION, collected: false });
}

function applyPowerUp(type, target) {
  activeEffects[target] = { type, remaining: POWERUP_DURATION };
  if (type.effect === 'enlarge') {
    if (target === 'player') playerPaddle.scale.set(1.8, 1, 1);
    else aiPaddle.scale.set(1.8, 1, 1);
  }
}

function clearEffect(target) {
  activeEffects[target] = null;
  playerPaddle.scale.set(1, 1, 1);
  aiPaddle.scale.set(1, 1, 1);
}

function getBallSpeed() {
  let baseSpeed = 0.14 + (playerScore + aiScore) * 0.008;
  if (activeEffects.player?.type.effect === 'speedUp') baseSpeed *= 1.4;
  if (activeEffects.player?.type.effect === 'slowDown') baseSpeed *= 0.6;
  if (activeEffects.ai?.type.effect === 'speedUp') baseSpeed *= 1.4;
  if (activeEffects.ai?.type.effect === 'slowDown') baseSpeed *= 0.6;
  return baseSpeed;
}

// ── Reset ball ──
function resetBall(direction) {
  ball.position.set(0, TABLE_H + BALL_R, 0);
  const speed = getBallSpeed();
  const angle = (Math.random() - 0.5) * 1.2;
  ballVX = Math.sin(angle) * speed;
  ballVY = direction * speed * Math.cos(angle);
  trailParticles.forEach(p => scene.remove(p));
  trailParticles.length = 0;
  // Clear effects on score
  clearEffect('player');
  clearEffect('ai');
}

// ── Score ──
function playerScores() {
  const points = activeEffects.player?.type.effect === 'doubleScore' ? 2 : 1;
  playerScore += points;
  elPlayerScore.textContent = playerScore;
  showMessage(points > 1 ? '双倍得分! +2' : '得分!', 'win');
  if (playerScore >= WIN_SCORE) endGame('你赢了!');
  else resetBall(-1);
}

function aiScores() {
  const points = activeEffects.ai?.type.effect === 'doubleScore' ? 2 : 1;
  aiScore += points;
  elAiScore.textContent = aiScore;
  showMessage(points > 1 ? 'AI x2!' : 'AI 得分', 'lose');
  if (aiScore >= WIN_SCORE) endGame('AI 赢了!');
  else resetBall(1);
}

function showMessage(text, cls) {
  elMessage.textContent = text;
  elMessage.className = cls + ' show';
  setTimeout(() => { elMessage.className = ''; }, 1200);
}

function endGame(text) {
  gameRunning = false;
  gameOver = true;
  elMessage.textContent = text;
  elMessage.className = text.includes('你') ? 'win show' : 'lose show';
  overlay.style.display = 'flex';
  startBtn.textContent = '再来一局';
}

// ── Start / restart ──
function startGame() {
  playerScore = 0;
  aiScore = 0;
  elPlayerScore.textContent = '0';
  elAiScore.textContent = '0';
  elMessage.className = '';
  gameRunning = true;
  gameOver = false;
  overlay.style.display = 'none';
  // Clear power-ups and effects
  powerUps.forEach(pu => { scene.remove(pu.mesh); pu.mesh.geometry.dispose(); pu.mesh.material.dispose(); });
  powerUps.length = 0;
  clearEffect('player');
  clearEffect('ai');
  powerUpTimer = 0;
  resetBall(Math.random() > 0.5 ? 1 : -1);
}

startBtn.addEventListener('click', startGame);

// ── Input ──
document.addEventListener('keydown', (e) => { keys[e.code] = true; });
document.addEventListener('keyup', (e) => { keys[e.code] = false; });

// ── AI ──
function updateAI() {
  const targetX = ball.position.x;
  const aiX = aiPaddle.position.x;
  const speed = 0.08 + (playerScore + aiScore) * 0.003;
  const diff = targetX - aiX;
  const maxMove = speed * Math.min(1, Math.abs(diff) / 0.5);
  aiPaddle.position.x += Math.sign(diff) * Math.min(Math.abs(diff), maxMove);
  aiPaddle.position.x = Math.max(-TABLE_W/2 + PADDLE_W/2, Math.min(TABLE_W/2 - PADDLE_W/2, aiPaddle.position.x));
}

// ── Update ──
function update() {
  if (!gameRunning) return;

  // Player paddle
  const moveSpeed = 0.15;
  if (keys['KeyW'] || keys['ArrowUp']) playerPaddle.position.x -= moveSpeed;
  if (keys['KeyS'] || keys['ArrowDown']) playerPaddle.position.x += moveSpeed;
  playerPaddle.position.x = Math.max(-TABLE_W/2 + PADDLE_W/2, Math.min(TABLE_W/2 - PADDLE_W/2, playerPaddle.position.x));

  // AI
  updateAI();

  // Save old position for segment collision
  const oldX = ball.position.x;
  const oldZ = ball.position.z;

  // Ball movement
  ball.position.x += ballVX;
  ball.position.z += ballVY;

  // Trail
  if (Math.random() < 0.5) spawnTrailParticle();

  // Side wall bounce
  if (ball.position.x <= -TABLE_W/2 + BALL_R) {
    ball.position.x = -TABLE_W/2 + BALL_R;
    ballVX = Math.abs(ballVX);
    spawnImpact(ball.position);
  }
  if (ball.position.x >= TABLE_W/2 - BALL_R) {
    ball.position.x = TABLE_W/2 - BALL_R;
    ballVX = -Math.abs(ballVX);
    spawnImpact(ball.position);
  }

  // ── Power-up management ──
  // Spawn
  powerUpTimer++;
  if (powerUpTimer >= POWERUP_SPAWN_INTERVAL && Math.random() < 0.6) {
    powerUpTimer = 0;
    spawnPowerUp();
  }

  // Update power-ups
  for (let i = powerUps.length - 1; i >= 0; i--) {
    const pu = powerUps[i];
    pu.mesh.rotation.y += 0.04;
    pu.mesh.rotation.x += 0.03;
    pu.mesh.position.y = TABLE_H + 0.25 + Math.sin(Date.now() * 0.005) * 0.15;

    // Check ball pickup
    const dx = ball.position.x - pu.x;
    const dz = ball.position.z - pu.z;
    const dist = Math.sqrt(dx * dx + dz * dz);
    if (dist < BALL_R + 0.35) {
      pu.collected = true;
      const target = pu.side === 'player' ? 'player' : 'ai';
      applyPowerUp(pu.type, target);
      showMessage(`${target === 'player' ? '你' : 'AI'} 获得 ${pu.type.icon}${pu.type.name}!`, 'win');
    }

    // Check paddle pickup
    if (!pu.collected) {
      if (pu.side === 'player') {
        if (Math.abs(playerPaddle.position.x - pu.x) < PADDLE_W / 2 + 0.3) {
          pu.collected = true;
          applyPowerUp(pu.type, 'player');
          showMessage(`你拾取 ${pu.type.icon}${pu.type.name}!`, 'win');
        }
      } else {
        if (Math.abs(aiPaddle.position.x - pu.x) < PADDLE_W / 2 + 0.3) {
          pu.collected = true;
          applyPowerUp(pu.type, 'ai');
          showMessage(`AI 拾取 ${pu.type.icon}${pu.type.name}!`, 'lose');
        }
      }
    }

    // Timer expiration
    pu.life--;
    if (pu.life <= 0 || pu.collected) {
      scene.remove(pu.mesh);
      pu.mesh.geometry.dispose();
      pu.mesh.material.dispose();
      powerUps.splice(i, 1);
    }
  }

  // Update active effects
  ['player', 'ai'].forEach(target => {
    if (activeEffects[target]) {
      activeEffects[target].remaining--;
      if (activeEffects[target].remaining <= 0) {
        clearEffect(target);
        showMessage(`${target === 'player' ? '你' : 'AI'} 的效果结束了`, 'info');
      }
    }
  });

  // Shrink effect
  if (activeEffects.player?.type.effect === 'shrink') playerPaddle.scale.set(0.55, 1, 1);
  else if (!activeEffects.player || activeEffects.player.type.effect !== 'enlarge') playerPaddle.scale.set(1, 1, 1);
  if (activeEffects.ai?.type.effect === 'shrink') aiPaddle.scale.set(0.55, 1, 1);
  else if (!activeEffects.ai || activeEffects.ai.type.effect !== 'enlarge') aiPaddle.scale.set(1, 1, 1);

  // ── Segment-based paddle collision ──
  // Player paddle at z = TABLE_D/2 - 1
  const pPaddleZ = TABLE_D/2 - 1;
  const pPaddleFront = pPaddleZ - PADDLE_D / 2;
  const pPaddleBack = pPaddleZ + PADDLE_D / 2;

  // AI paddle at z = -(TABLE_D/2 - 1)
  const aPaddleZ = -(TABLE_D/2 - 1);
  const aPaddleFront = aPaddleZ + PADDLE_D / 2;

  // Check if ball segment crosses player paddle plane
  function segmentHitsPaddle(oZ, nZ, paddleZ, px, halfW) {
    if ((oZ - paddleZ) * (nZ - paddleZ) > 0) return { hit: false };
    if (oZ === nZ) return { hit: false };
    const t = (paddleZ - oZ) / (nZ - oZ);
    if (t < 0 || t > 1) return { hit: false };
    const crossX = oldX + t * (ball.position.x - oldX);
    if (Math.abs(crossX - px) < halfW + BALL_R) {
      return { hit: true, crossX, t };
    }
    return { hit: false };
  }

  // Player paddle check (ball moving toward +Z)
  if (ballVY > 0 && oldZ < pPaddleFront) {
    const plrHit = segmentHitsPaddle(oldZ, ball.position.z, pPaddleFront, playerPaddle.position.x, PADDLE_W / 2);
    if (plrHit.hit) {
      ball.position.z = pPaddleFront - BALL_R;
      ball.position.x = plrHit.crossX;
      const hitPos = (plrHit.crossX - playerPaddle.position.x) / (PADDLE_W / 2 + BALL_R);
      const maxAngle = Math.PI / 3;
      const angle = Math.max(-1, Math.min(1, hitPos)) * maxAngle;
      const speed = Math.sqrt(ballVX * ballVX + ballVY * ballVY) * 1.02;
      ballVX = Math.sin(angle) * speed;
      ballVY = -Math.cos(angle) * speed;
      spawnImpact(ball.position);
    }
  }

  // AI paddle check (ball moving toward -Z)
  if (ballVY < 0 && oldZ > aPaddleFront) {
    const aiHit = segmentHitsPaddle(oldZ, ball.position.z, aPaddleFront, aiPaddle.position.x, PADDLE_W / 2);
    if (aiHit.hit) {
      ball.position.z = aPaddleFront + BALL_R;
      ball.position.x = aiHit.crossX;
      const hitPos = (aiHit.crossX - aiPaddle.position.x) / (PADDLE_W / 2 + BALL_R);
      const maxAngle = Math.PI / 3;
      const angle = Math.max(-1, Math.min(1, hitPos)) * maxAngle;
      const speed = Math.sqrt(ballVX * ballVX + ballVY * ballVY) * 1.02;
      ballVX = Math.sin(angle) * speed;
      ballVY = Math.cos(angle) * speed;
      spawnImpact(ball.position);
    }
  }

  // Score detection — ball passed the paddle's Z completely
  // Player side: ball goes past player paddle toward +Z
  if (ball.position.z > pPaddleBack + BALL_R) {
    // Check if it already crossed paddle (handled above) — only score if no hit
    if (!(ballVY > 0)) aiScores();
    else aiScores();
  }

  // AI side: ball goes past AI paddle toward -Z
  if (ball.position.z < aPaddleFront - PADDLE_D / 2 - BALL_R) {
    if (!(ballVY < 0)) playerScores();
    else playerScores();
  }
}

// ── Impact particles ──
function spawnImpact(pos) {
  for (let i = 0; i < 8; i++) {
    const geo = new THREE.SphereGeometry(0.04, 4, 4);
    const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
    const p = new THREE.Mesh(geo, mat);
    p.position.copy(pos);
    p.userData.vel = new THREE.Vector3(
      (Math.random() - 0.5) * 0.1,
      Math.random() * 0.05,
      (Math.random() - 0.5) * 0.1
    );
    p.userData.life = 1;
    scene.add(p);
    trailParticles.push(p);
  }
}

// ── Ambient lights under table ──
const ambientGlowGeo = new THREE.PlaneGeometry(TABLE_W * 0.8, TABLE_D * 0.8);
const ambientGlowMat = new THREE.MeshBasicMaterial({ color: 0x113344, side: THREE.DoubleSide, transparent: true, opacity: 0.3 });
const ambientGlow = new THREE.Mesh(ambientGlowGeo, ambientGlowMat);
ambientGlow.rotation.x = -Math.PI / 2;
ambientGlow.position.y = -2.8;
scene.add(ambientGlow);

// ── Animation ──
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.1);
  update();

  // Update trail
  trailParticles.forEach(p => {
    p.userData.life -= dt * 3;
    p.material.opacity = p.userData.life * 0.4;
    if (p.userData.vel) {
      p.position.add(p.userData.vel);
      p.userData.vel.y -= 0.002;
    }
  });
  for (let i = trailParticles.length - 1; i >= 0; i--) {
    if (trailParticles[i].userData.life <= 0) {
      scene.remove(trailParticles[i]);
      trailParticles[i].geometry.dispose();
      trailParticles[i].material.dispose();
      trailParticles.splice(i, 1);
    }
  }

  // Ball rotation for visual interest
  ball.rotation.x += dt * 2;
  ball.rotation.z += dt * 3;

  // Ball glow pulse
  const pulse = 1 + Math.sin(performance.now() * 0.005) * 0.15;
  glow.scale.setScalar(pulse);

  // Paddle idle hover
  if (!gameRunning) {
    const hover = Math.sin(performance.now() * 0.003) * 0.15;
    playerPaddle.position.y = TABLE_H + PADDLE_H / 2 + hover;
    aiPaddle.position.y = TABLE_H + PADDLE_H / 2 + hover;
  }

  orbitControls.update();
  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
