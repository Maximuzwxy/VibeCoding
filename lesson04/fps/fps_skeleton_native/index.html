<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPS - Native Three.js Skeleton</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <canvas id="scene-canvas"></canvas>
        <div id="crosshair"></div>
        <div id="info">
            <h3>Three.js 原生骨骼系统</h3>
            <p>使用 THREE.Bone + THREE.Skeleton + THREE.SkinnedMesh</p>
            <p>按 W/S 旋转腰部 | A/D 旋转上半身 | Q/E 手臂</p>
            <p>或使用右侧控制器</p>
        </div>
        <div id="controls">
            <div class="control-group">
                <label>腰部旋转 Y</label>
                <input type="range" id="pelvisRotY" min="-180" max="180" value="0">
            </div>
            <div class="control-group">
                <label>上半身旋转 Y</label>
                <input type="range" id="spineRotY" min="-180" max="180" value="0">
            </div>
            <div class="control-group">
                <label>左臂旋转 X</label>
                <input type="range" id="leftArmRotX" min="-180" max="180" value="0">
            </div>
            <div class="control-group">
                <label>右臂旋转 X</label>
                <input type="range" id="rightArmRotX" min="-180" max="180" value="0">
            </div>
            <div class="control-group">
                <label>头部旋转 Y</label>
                <input type="range" id="headRotY" min="-180" max="180" value="0">
            </div>
            <div class="control-group">
                <label>左腿旋转 X</label>
                <input type="range" id="leftLegRotX" min="-90" max="90" value="0">
            </div>
            <div class="control-group">
                <label>右腿旋转 X</label>
                <input type="range" id="rightLegRotX" min="-90" max="90" value="0">
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="script.js"></script>
</body>
</html>
