<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phantom SS — Bird's Eye View</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding-top: 60px; }
  canvas { display: block; }

  #info {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 1.2rem;
    font-weight: 300;
    letter-spacing: 2px;
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
    pointer-events: none;
  }

  #legend {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    background: rgba(0,0,0,0.65);
    padding: 10px 16px;
    border-radius: 24px;
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .legend-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: #999;
    font-size: 0.6rem;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 12px;
    transition: all 0.25s;
    border: 1px solid transparent;
    min-width: 48px;
    text-decoration: none;
  }
  .legend-item:hover {
    color: #fff;
    background: rgba(255,255,255,0.1);
  }
  .legend-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
    transition: box-shadow 0.25s;
  }
  .legend-item:hover .legend-dot {
    box-shadow: 0 0 8px currentColor;
  }

  #controls-hint {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    color: #666;
    font-size: 0.7rem;
    pointer-events: none;
  }

  #wasd-btn {
    position: absolute; top: 70px; right: 20px; z-index: 100;
    padding: 8px 18px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.5); color: #888; font-size: 0.75rem;
    cursor: pointer; transition: all 0.2s; font-family: inherit;
    letter-spacing: 1px;
  }
  #wasd-btn.active {
    background: rgba(253,184,19,0.15); border-color: #FDB813;
    color: #FDB813; box-shadow: 0 0 12px rgba(253,184,19,0.2);
  }
  #wasd-btn:hover { border-color: rgba(255,255,255,0.3); color: #ccc; }

  .label {
    color: #fff;
    font-size: 0.65rem;
    font-weight: 400;
    text-shadow: 0 0 6px rgba(0,0,0,0.8);
    pointer-events: none;
    white-space: nowrap;
  }
  /* ─── AI Search Bar ───────────────────────────────── */
  .ai-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    padding: 10px 20px;
    background: rgba(10,10,20,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
  }
  .ai-bar-inner {
    display: flex; align-items: center; gap: 10px;
    max-width: 520px; width: 100%; position: relative;
  }
  .ai-input {
    flex: 1; padding: 10px 18px; border-radius: 25px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    color: #fff; font-size: 0.9rem; outline: none;
    transition: border-color 0.2s;
  }
  .ai-input:focus { border-color: #FDB813; }
  .ai-input::placeholder { color: #556; }
  .ai-btn {
    width: 40px; height: 40px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, #FDB813, #ff9500);
    color: #000; font-size: 1.2rem; cursor: pointer;
    flex-shrink: 0; transition: transform 0.15s;
  }
  .ai-btn:hover { transform: scale(1.08); }
  .ai-btn.loading { opacity: 0.6; pointer-events: none; }
  .ai-answer {
    position: absolute; top: calc(100% + 8px); left: 0; right: 0;
    background: rgba(16,16,32,0.96); border: 1px solid rgba(253,184,19,0.2);
    border-radius: 12px; padding: 14px 18px; display: none;
    color: #c8c8e0; font-size: 0.84rem; line-height: 1.55;
    max-height: 220px; overflow-y: auto; z-index: 10;
    text-shadow: none;
  }
  .ai-answer.show { display: block; }
  .ai-label {
    color: #FDB813; font-size: 0.7rem; letter-spacing: 2px;
    text-transform: uppercase; margin-bottom: 6px;
  }
</style>
</head>
<body>
<!-- ─── AI Assistant Bar ──────────────────────────── -->
<div class="ai-bar">
  <div class="ai-bar-inner">
    <input class="ai-input" id="aiInput" placeholder="Ask Cosmos anything about space..." autocomplete="off">
    <button class="ai-btn" id="aiBtn" title="Ask">&#8593;</button>
    <div class="ai-answer" id="aiAnswer"></div>
  </div>
</div>
<div id="info">☀ PHANTOM SS — Bird's Eye View</div>
<div id="controls-hint">Drag to rotate &bull; Scroll to zoom &bull; Right-drag to pan</div>
<button id="wasd-btn" title="Toggle WASD flight mode">WASD FLY</button>
<div id="legend">
  <a class="legend-item" href="planet.html?planet=sun"><div class="legend-dot" style="background:#FDB813"></div>Sun</a>
  <a class="legend-item" href="planet.html?planet=mercury"><div class="legend-dot" style="background:#b5b5b5"></div>Mercury</a>
  <a class="legend-item" href="planet.html?planet=venus"><div class="legend-dot" style="background:#e6c229"></div>Venus</a>
  <a class="legend-item" href="planet.html?planet=earth"><div class="legend-dot" style="background:#4da6ff"></div>Earth</a>
  <a class="legend-item" href="planet.html?planet=mars"><div class="legend-dot" style="background:#c1440e"></div>Mars</a>
  <a class="legend-item" href="planet.html?planet=jupiter"><div class="legend-dot" style="background:#d4a574"></div>Jupiter</a>
  <a class="legend-item" href="planet.html?planet=saturn"><div class="legend-dot" style="background:#e0c070"></div>Saturn</a>
  <a class="legend-item" href="planet.html?planet=uranus"><div class="legend-dot" style="background:#7ec8e3"></div>Uranus</a>
  <a class="legend-item" href="planet.html?planet=neptune"><div class="legend-dot" style="background:#3f54ba"></div>Neptune</a>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── Scene ─────────────────────────────────────────────────
const scene = new THREE.Scene();

// Starfield background
const starsGeo = new THREE.BufferGeometry();
const starsCount = 3000;
const starsPos = new Float32Array(starsCount * 3);
for (let i = 0; i < starsCount * 3; i += 3) {
  starsPos[i] = (Math.random() - 0.5) * 900;
  starsPos[i+1] = (Math.random() - 0.5) * 900;
  starsPos[i+2] = (Math.random() - 0.5) * 900;
}
starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.25, sizeAttenuation: true });
scene.add(new THREE.Points(starsGeo, starsMat));

// ─── Camera (bird's eye — looking down) ──────────────────
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 1000);
camera.position.set(0, 130, 8);
camera.lookAt(0, 0, 0);

// ─── Renderer ─────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// ─── Controls ─────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.18;
controls.target.set(0, 0, 0);
controls.minDistance = 15;
controls.maxDistance = 450;
controls.maxPolarAngle = Math.PI / 2.3;
controls.zoomSpeed = 6.0;
controls.update();

// ─── Lighting ─────────────────────────────────────────────
// Natural daylight ambient — soft fill
const ambientLight = new THREE.AmbientLight(0x334466, 1.8);
scene.add(ambientLight);

// Hemisphere: warm sky, dark ground
const hemiLight = new THREE.HemisphereLight(0xffffcc, 0x223344, 0.8);
scene.add(hemiLight);

// Sun as a strong point light with natural distance falloff
const sunLight = new THREE.PointLight(0xfff5e8, 300, 120, 1.5);
sunLight.position.set(0, 0, 0);
scene.add(sunLight);

// ─── Sun ──────────────────────────────────────────────────
const sunGeo = new THREE.SphereGeometry(7, 64, 64);
const sunMat = new THREE.MeshBasicMaterial({ color: 0xFDB813 });
const sun = new THREE.Mesh(sunGeo, sunMat);
scene.add(sun);

// Sun glow shader
const glowGeo = new THREE.SphereGeometry(7.8, 64, 64);
const glowMat = new THREE.ShaderMaterial({
  uniforms: {},
  vertexShader: `
    varying vec3 vNormal;
    varying vec3 vPosition;
    void main() {
      vec4 worldPos = modelMatrix * vec4(position, 1.0);
      vNormal = normalize(mat3(modelMatrix) * normal);
      vPosition = worldPos.xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vNormal;
    varying vec3 vPosition;
    void main() {
      vec3 viewDir = normalize(cameraPosition - vPosition);
      float intensity = pow(0.75 - dot(vNormal, viewDir), 3.0);
      gl_FragColor = vec4(1.0, 0.75, 0.15, intensity * 0.6);
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const glow = new THREE.Mesh(glowGeo, glowMat);
scene.add(glow);

// ─── Planet Data ──────────────────────────────────────────
// size, orbitRadius, color, axialTilt (degrees), speed, name
const planetDefs = [
  { name: 'Mercury', size: 0.55, orbit: 10,  color: 0xb5b5b5, tilt: 0.03,  speed: 4.15,  moons: [] },
  { name: 'Venus',   size: 1.35, orbit: 15,  color: 0xe6c229, tilt: 177.4, speed: 1.62,  moons: [] },
  { name: 'Earth',   size: 1.45, orbit: 20,  color: 0x4da6ff, tilt: 23.44, speed: 1.0,   moons: [
    { name: 'Moon', size: 0.27, orbit: 2.5, color: 0xcccccc, speed: 5.0 }
  ]},
  { name: 'Mars',    size: 0.8,  orbit: 26,  color: 0xc1440e, tilt: 25.19, speed: 0.53,  moons: [
    { name: 'Phobos', size: 0.08, orbit: 1.4, color: 0x8b7355, speed: 8.0 },
    { name: 'Deimos', size: 0.06, orbit: 2.0, color: 0x998877, speed: 5.0 }
  ]},
  { name: 'Jupiter', size: 3.5,  orbit: 36,  color: 0xd4a574, tilt: 3.13,  speed: 0.084, moons: [
    { name: 'Io', size: 0.2, orbit: 4.8, color: 0xffcc44, speed: 7.0 },
    { name: 'Europa', size: 0.18, orbit: 5.6, color: 0xeeddcc, speed: 5.5 },
    { name: 'Ganymede', size: 0.24, orbit: 6.5, color: 0xbbb8a8, speed: 4.5 },
    { name: 'Callisto', size: 0.22, orbit: 7.4, color: 0x888877, speed: 3.5 }
  ]},
  { name: 'Saturn',  size: 2.9,  orbit: 46,  color: 0xe0c070, tilt: 26.73, speed: 0.034, hasRings: true, moons: [
    { name: 'Titan', size: 0.22, orbit: 4.5, color: 0xddaa66, speed: 3.0 },
    { name: 'Enceladus', size: 0.08, orbit: 5.3, color: 0xeeeeff, speed: 5.0 },
    { name: 'Mimas', size: 0.06, orbit: 5.9, color: 0xcccccc, speed: 6.0 }
  ]},
  { name: 'Uranus',  size: 2.25, orbit: 56,  color: 0x7ec8e3, tilt: 97.77, speed: 0.012, moons: [
    { name: 'Miranda', size: 0.06, orbit: 3.5, color: 0xaaaaaa, speed: 6.0 },
    { name: 'Ariel', size: 0.08, orbit: 4.0, color: 0xbbc8cc, speed: 5.0 },
    { name: 'Umbriel', size: 0.08, orbit: 4.6, color: 0x887766, speed: 4.0 },
    { name: 'Titania', size: 0.1, orbit: 5.2, color: 0x99aabb, speed: 3.5 },
    { name: 'Oberon', size: 0.1, orbit: 5.9, color: 0x887766, speed: 3.0 }
  ]},
  { name: 'Neptune', size: 2.15, orbit: 66,  color: 0x3f54ba, tilt: 28.32, speed: 0.006, moons: [
    { name: 'Triton', size: 0.16, orbit: 3.8, color: 0xddccee, speed: 4.5 }
  ]},
];

const planets = [];

planetDefs.forEach(def => {
  // Orbit ring
  const orbitGeo = new THREE.TorusGeometry(def.orbit, 0.12, 6, 100);
  const orbitMat = new THREE.MeshBasicMaterial({ color: 0x556688, transparent: true, opacity: 0.45 });
  const orbitRing = new THREE.Mesh(orbitGeo, orbitMat);
  orbitRing.rotation.x = Math.PI / 2;
  scene.add(orbitRing);

// ─── Asteroid Belt ──────────────────────────────────────
const asteroidCount = 800;
const asteroidGeo = new THREE.BufferGeometry();
const asteroidPositions = [];
const asteroidColors = [];
const innerRadius = 28;
const outerRadius = 32;
for (let i = 0; i < asteroidCount; i++) {
  const angle = Math.random() * Math.PI * 2;
  const r = innerRadius + Math.random() * (outerRadius - innerRadius);
  const y = (Math.random() - 0.5) * 1.2;
  asteroidPositions.push(Math.cos(angle) * r, y, Math.sin(angle) * r);
  const shade = 0.15 + Math.random() * 0.25;
  asteroidColors.push(shade, shade * 0.9, shade * 0.75);
}
asteroidGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(asteroidPositions), 3));
asteroidGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(asteroidColors), 3));
const asteroidMat = new THREE.PointsMaterial({ size: 0.08, vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false });
const asteroidBelt = new THREE.Points(asteroidGeo, asteroidMat);
asteroidBelt.rotation.x = -0.02;
scene.add(asteroidBelt);

// ─── Planet pivot (for orbit animation) ─────────────────
  const pivot = new THREE.Object3D();
  pivot.rotation.y = Math.random() * Math.PI * 2; // random start angle
  scene.add(pivot);

  // Planet group (for axial tilt)
  const planetGroup = new THREE.Object3D();
  planetGroup.position.set(def.orbit, 0, 0);
  // Apply axial tilt (rotate around X axis to tilt the axis)
  planetGroup.rotation.x = THREE.MathUtils.degToRad(def.tilt);
  pivot.add(planetGroup);

  // Planet mesh
  const planetGeo = new THREE.SphereGeometry(def.size, 48, 48);
  
  // More detailed materials
  let planetMat;
  if (def.name === 'Earth') {
    // Earth-like with blue and green
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 128;
    const ctx = canvas.getContext('2d');
    // Ocean
    const grad = ctx.createLinearGradient(0, 0, 0, 128);
    grad.addColorStop(0, '#4da6ff');
    grad.addColorStop(0.3, '#4da6ff');
    grad.addColorStop(0.35, '#2ecc71');
    grad.addColorStop(0.55, '#4da6ff');
    grad.addColorStop(0.7, '#2ecc71');
    grad.addColorStop(0.75, '#4da6ff');
    grad.addColorStop(1, '#ffffff');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 256, 128);
    // White clouds
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    for (let i = 0; i < 30; i++) {
      ctx.beginPath();
      ctx.ellipse(Math.random()*256, Math.random()*128, 20+Math.random()*40, 5+Math.random()*10, Math.random()*Math.PI, 0, Math.PI*2);
      ctx.fill();
    }
    const earthTex = new THREE.CanvasTexture(canvas);
    planetMat = new THREE.MeshPhongMaterial({ map: earthTex, specular: 0x222244, shininess: 10, emissive: 0x001122 });
  } else if (def.name === 'Jupiter') {
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 128;
    const ctx = canvas.getContext('2d');
    const jGrad = ctx.createLinearGradient(0, 0, 0, 128);
    jGrad.addColorStop(0, '#d4a574');
    jGrad.addColorStop(0.15, '#c4956a');
    jGrad.addColorStop(0.2, '#e8c89e');
    jGrad.addColorStop(0.35, '#c4956a');
    jGrad.addColorStop(0.45, '#b87050');
    jGrad.addColorStop(0.5, '#e8c89e');
    jGrad.addColorStop(0.65, '#c4956a');
    jGrad.addColorStop(0.8, '#e8c89e');
    jGrad.addColorStop(0.9, '#b87050');
    jGrad.addColorStop(1, '#d4a574');
    ctx.fillStyle = jGrad;
    ctx.fillRect(0, 0, 256, 128);
    // Great Red Spot
    ctx.fillStyle = '#b85a3a';
    ctx.beginPath();
    ctx.ellipse(180, 55, 15, 8, 0, 0, Math.PI*2);
    ctx.fill();
    const jTex = new THREE.CanvasTexture(canvas);
    planetMat = new THREE.MeshPhongMaterial({ map: jTex, specular: 0x111111, shininess: 5, emissive: 0x110800 });
  } else {
    planetMat = new THREE.MeshPhongMaterial({
      color: def.color,
      specular: 0x333333,
      shininess: 15,
      emissive: new THREE.Color(def.color).multiplyScalar(0.15)
    });
  }
  
  const planetMesh = new THREE.Mesh(planetGeo, planetMat);
  planetMesh.castShadow = true;
  planetGroup.add(planetMesh);

  // Saturn's rings (particle-based like asteroid belt)
  if (def.hasRings) {
    const ringCount = 2000;
    const ringGeo = new THREE.BufferGeometry();
    const ringPositions = [];
    const ringColors = [];
    const innerR = def.size * 1.25;
    const outerR = def.size * 2.4;
    for (let i = 0; i < ringCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = innerR + Math.random() * (outerR - innerR);
      const y = (Math.random() - 0.5) * 0.15;
      ringPositions.push(Math.cos(angle) * r, y, Math.sin(angle) * r);
      const shade = 0.5 + Math.random() * 0.45;
      ringColors.push(shade, shade * 0.85, shade * 0.55);
    }
    ringGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(ringPositions), 3));
    ringGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(ringColors), 3));
    const ringMat = new THREE.PointsMaterial({
      size: 0.18,
      vertexColors: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      transparent: true,
      opacity: 0.75
    });
    const ringParticles = new THREE.Points(ringGeo, ringMat);
    ringParticles.rotation.x = Math.PI / 2;
    planetGroup.add(ringParticles);
  }

  // Label using sprite
  const canvasLabel = document.createElement('canvas');
  canvasLabel.width = 256; canvasLabel.height = 64;
  const ctxLabel = canvasLabel.getContext('2d');
  ctxLabel.font = 'bold 32px -apple-system, BlinkMacSystemFont, sans-serif';
  ctxLabel.fillStyle = '#ffffff';
  ctxLabel.textAlign = 'center';
  ctxLabel.fillText(def.name, 128, 40);
  const labelTex = new THREE.CanvasTexture(canvasLabel);
  labelTex.minFilter = THREE.LinearFilter;
  const labelSpriteMat = new THREE.SpriteMaterial({ map: labelTex, transparent: true, depthTest: false, depthWrite: false });
  const labelSprite = new THREE.Sprite(labelSpriteMat);
  labelSprite.scale.set(5.5, 1.375, 1);
  labelSprite.position.y = def.size + 1;
  planetGroup.add(labelSprite);

  // Moons
  const moonObjects = [];
  def.moons.forEach(moon => {
    const moonPivot = new THREE.Object3D();
    moonPivot.rotation.y = Math.random() * Math.PI * 2;
    planetGroup.add(moonPivot);

    const moonGroup = new THREE.Object3D();
    moonGroup.position.set(moon.orbit, 0, 0);
    moonPivot.add(moonGroup);

    const moonGeo = new THREE.SphereGeometry(moon.size, 16, 16);
    const moonMat = new THREE.MeshPhongMaterial({ color: moon.color, specular: 0x111111, shininess: 5 });
    const moonMesh = new THREE.Mesh(moonGeo, moonMat);
    moonGroup.add(moonMesh);

    moonObjects.push({ pivot: moonPivot, speed: moon.speed });
  });

  planets.push({
    def,
    pivot,
    group: planetGroup,
    mesh: planetMesh,
    label: labelSprite,
    moons: moonObjects
  });
});

// ─── International Space Station ─────────────────────────
const issOrbitRadius = 2.0;
const issPivot = new THREE.Object3D();
scene.add(issPivot);

const issGroup = new THREE.Object3D();
issGroup.position.set(issOrbitRadius, 0, 0);
issPivot.add(issGroup);

// Main body
const issBodyGeo = new THREE.BoxGeometry(0.25, 0.08, 0.08);
const issBodyMat = new THREE.MeshPhongMaterial({ color: 0xffffff, specular: 0x666666, shininess: 40, emissive: 0x111111 });
const issBody = new THREE.Mesh(issBodyGeo, issBodyMat);
issGroup.add(issBody);

// Center truss
const issTrussGeo = new THREE.BoxGeometry(0.6, 0.02, 0.02);
const issTruss = new THREE.Mesh(issTrussGeo, issBodyMat);
issGroup.add(issTruss);

// Solar panels (2 pairs)
[-0.32, 0.32].forEach(xOff => {
  const panelGeo = new THREE.BoxGeometry(0.18, 0.005, 0.12);
  const panelMat = new THREE.MeshPhongMaterial({ color: 0x1a3a5c, emissive: 0x050f1a, specular: 0x111111, shininess: 20 });
  const panel = new THREE.Mesh(panelGeo, panelMat);
  panel.position.set(xOff, 0.03, 0);
  issGroup.add(panel);
  const panel2 = new THREE.Mesh(panelGeo, panelMat);
  panel2.position.set(xOff, -0.03, 0);
  issGroup.add(panel2);
});

// ISS label
const issCanvas = document.createElement('canvas');
issCanvas.width = 128; issCanvas.height = 32;
const issCtx = issCanvas.getContext('2d');
issCtx.font = 'bold 14px -apple-system, BlinkMacSystemFont, sans-serif';
issCtx.fillStyle = '#ffffff';
issCtx.textAlign = 'center';
issCtx.fillText('ISS', 64, 20);
const issTex = new THREE.CanvasTexture(issCanvas);
issTex.minFilter = THREE.LinearFilter;
const issLabelSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: issTex, transparent: true, depthTest: false, depthWrite: false }));
issLabelSprite.scale.set(1.5, 0.375, 1);
issLabelSprite.position.y = 0.3;
issGroup.add(issLabelSprite);

// ─── Ender Dragon ────────────────────────────────────────
const dragon = new THREE.Group();

// Minecraft-style: wide flat head, no legs, large wings, spine ridges
const bodyMat = new THREE.MeshPhongMaterial({ color: 0x8a6d2b, specular: 0xffd700, shininess: 40, emissive: 0x2a1a00, emissiveIntensity: 2 });
const darkMat = new THREE.MeshPhongMaterial({ color: 0x5a4520, emissive: 0x1a0d00, emissiveIntensity: 1 });
const wingMat = new THREE.MeshPhongMaterial({ color: 0xb8963a, side: THREE.DoubleSide, emissive: 0x3a2200, emissiveIntensity: 1.5, transparent: true, opacity: 0.55 });
const eyeMat  = new THREE.MeshPhongMaterial({ color: 0xffd700, emissive: 0xffd700, emissiveIntensity: 3 });

// Head — wide flat boxy snout
const headGeo = new THREE.BoxGeometry(0.7, 0.3, 0.65);
const head = new THREE.Mesh(headGeo, bodyMat);
head.position.set(0.9, 0.05, 0);
dragon.add(head);

// Upper snout
const snoutGeo = new THREE.BoxGeometry(0.4, 0.15, 0.5);
const snout = new THREE.Mesh(snoutGeo, bodyMat);
snout.position.set(1.05, -0.02, 0);
dragon.add(snout);

// Lower jaw
const jawGeo = new THREE.BoxGeometry(0.35, 0.08, 0.35);
const jaw = new THREE.Mesh(jawGeo, darkMat);
jaw.position.set(1.1, -0.16, 0);
jaw.rotation.z = 0.25;
dragon.add(jaw);

// Eyes
[-0.15, 0.15].forEach(zOff => {
  const eyeGeo = new THREE.BoxGeometry(0.06, 0.06, 0.06);
  const eye = new THREE.Mesh(eyeGeo, eyeMat);
  eye.position.set(1.08, 0.16, zOff);
  dragon.add(eye);
});

// Neck
const neckGeo = new THREE.BoxGeometry(0.6, 0.25, 0.45);
const neck = new THREE.Mesh(neckGeo, bodyMat);
neck.position.set(0.3, 0.12, 0);
dragon.add(neck);

// Body
const bodyGeo = new THREE.BoxGeometry(1.4, 0.4, 0.55);
const body = new THREE.Mesh(bodyGeo, bodyMat);
body.position.set(-0.3, 0, 0);
dragon.add(body);

// Abdomen
const abdomenGeo = new THREE.BoxGeometry(0.8, 0.3, 0.45);
const abdomen = new THREE.Mesh(abdomenGeo, bodyMat);
abdomen.position.set(-1.0, -0.02, 0);
dragon.add(abdomen);

// Spine ridges on back
for (let i = 0; i < 5; i++) {
  const ridgeGeo = new THREE.BoxGeometry(0.15, 0.22, 0.12);
  const ridge = new THREE.Mesh(ridgeGeo, darkMat);
  ridge.position.set(-0.6 + i * 0.3, 0.3, 0);
  dragon.add(ridge);
}

// Tail — 10 segments with spines
for (let i = 0; i < 10; i++) {
  const s = 1 - i * 0.08;
  const segGeo = new THREE.BoxGeometry(0.25 * s, 0.16 * s, 0.2 * s);
  const seg = new THREE.Mesh(segGeo, bodyMat);
  seg.position.set(-1.5 - i * 0.28, 0.02 + i * 0.025, Math.sin(i * 0.35) * 0.2);
  seg.rotation.z = i * 0.04;
  dragon.add(seg);
  const tipGeo = new THREE.BoxGeometry(0.08, 0.1 * s, 0.06);
  const tip = new THREE.Mesh(tipGeo, darkMat);
  tip.position.set(-1.5 - i * 0.28, 0.18 * s, Math.sin(i * 0.35) * 0.2);
  dragon.add(tip);
}

// Wings — large upward-spreading insect wings
[-0.3, 0.3].forEach(zOff => {
  const strutGeo = new THREE.BoxGeometry(0.05, 1.2, 0.05);
  const strut = new THREE.Mesh(strutGeo, darkMat);
  strut.position.set(-0.15, 0.8, zOff);
  strut.rotation.z = zOff > 0 ? 0.5 : -0.5;
  strut.rotation.x = zOff > 0 ? 0.25 : -0.25;
  dragon.add(strut);
  for (let w = 0; w < 3; w++) {
    const memGeo = new THREE.BoxGeometry(0.04, 0.7 - w * 0.15, 0.35 - w * 0.08);
    const mem = new THREE.Mesh(memGeo, wingMat);
    mem.position.set(-0.2 + w * 0.12, 0.6 - w * 0.1, zOff);
    mem.rotation.z = zOff > 0 ? 0.55 : -0.55;
    mem.rotation.x = zOff > 0 ? 0.2 : -0.2;
    dragon.add(mem);
  }
  const tipGeo = new THREE.BoxGeometry(0.06, 0.3, 0.08);
  const tip = new THREE.Mesh(tipGeo, darkMat);
  tip.position.set(-0.5, 1.1, zOff);
  tip.rotation.z = zOff > 0 ? 0.8 : -0.8;
  dragon.add(tip);
});

// Scale to Neptune size
dragon.scale.set(4, 4, 4);

// Initial position
dragon.position.set(10, 2, 10);
dragon.rotation.y = Math.random() * Math.PI * 2;
scene.add(dragon);

// Gold glow light
const dragonLight = new THREE.PointLight(0xffb833, 20, 15, 2);
dragon.add(dragonLight);

// Dragon wander state
let dragonDir = new THREE.Vector3(Math.random() - 0.5, 0, Math.random() - 0.5).normalize();
let dragonTimer = 0;
let dragonTurnRate = 0; // random angular velocity
const DRAGON_SPEED = 5;

// ─── Animation ────────────────────────────────────────────
let clock = new THREE.Clock();

// ---- WASD fly controls ----
const keys = { w:false, a:false, s:false, d:false, q:false, e:false };
let wasdActive = false;
const wasdBtn = document.getElementById('wasd-btn');
if (wasdBtn) {
  wasdBtn.addEventListener('click', () => {
    wasdActive = !wasdActive;
    wasdBtn.classList.toggle('active', wasdActive);
    wasdBtn.textContent = wasdActive ? 'WASD ON' : 'WASD FLY';
    if (wasdActive) {
      controls.target.copy(camera.position).add(
        new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion)
      );
    }
  });
}
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k in keys) { keys[k] = true; if (wasdActive) e.preventDefault(); }
});
window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k in keys) keys[k] = false;
});

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);

  // ---- WASD movement ----
  if (wasdActive) {
    const speed = 150 * dt;
    const dir = new THREE.Vector3();
    const forward = new THREE.Vector3();
    camera.getWorldDirection(forward);
    // Flatten to horizontal plane — W/S fly horizontally, Q/E handle vertical
    forward.y = 0;
    if (forward.length() < 0.001) forward.set(0, 0, 1);
    forward.normalize();
    const worldUp = new THREE.Vector3(0, 1, 0);
    const right = new THREE.Vector3().crossVectors(forward, worldUp).normalize();

    if (keys.w) dir.add(forward);
    if (keys.s) dir.sub(forward);
    if (keys.d) dir.add(right);
    if (keys.a) dir.sub(right);
    if (keys.e) dir.add(worldUp);
    if (keys.q) dir.sub(worldUp);

    if (dir.length() > 0) {
      dir.normalize().multiplyScalar(speed);
      camera.position.add(dir);
      controls.target.add(dir);
    }
  }

  // Rotate sun
  sun.rotation.y += dt * 0.1;

  // Orbit planets
  planets.forEach(p => {
    p.pivot.rotation.y += dt * p.def.speed * 0.5;
    // Self rotation
    p.mesh.rotation.y += dt * (0.3 + Math.random() * 0.01);
    // Rotate moons
    p.moons.forEach(m => {
      m.pivot.rotation.y += dt * m.speed;
    });
  });

  // ISS follows Earth and orbits it
  const earthGroup = planets[2].group;
  const earthWorldPos = new THREE.Vector3();
  earthGroup.getWorldPosition(earthWorldPos);
  issPivot.position.copy(earthWorldPos);
  issPivot.rotation.y += dt * 3.0;

  // Dragon aimless wandering with random turning
  dragonTimer -= dt;
  if (dragonTimer <= 0) {
    // Pick a new random turn rate every few seconds
    dragonTurnRate = (Math.random() - 0.5) * 3.0;
    dragonTimer = 1.5 + Math.random() * 3;
  }
  // Apply continuous random turning
  const angle = dragonTurnRate * dt;
  const cos = Math.cos(angle), sin = Math.sin(angle);
  const rx = dragonDir.x * cos - dragonDir.z * sin;
  const rz = dragonDir.x * sin + dragonDir.z * cos;
  dragonDir.set(rx, dragonDir.y + (Math.random() - 0.5) * 0.02, rz).normalize();
  
  const dMove = dragonDir.clone().multiplyScalar(DRAGON_SPEED * dt);
  dragon.position.add(dMove);
  // Face movement direction (smooth)
  const targetAngle = Math.atan2(dragonDir.x, dragonDir.z);
  let dAngle = targetAngle - dragon.rotation.y;
  while (dAngle > Math.PI) dAngle -= Math.PI * 2;
  while (dAngle < -Math.PI) dAngle += Math.PI * 2;
  dragon.rotation.y += dAngle * Math.min(1, dt * 3);
  // Wing flap animation
  dragon.rotation.z = Math.sin(Date.now() * 0.004) * 0.15;

  controls.update();
  renderer.render(scene, camera);
}

animate();

// ─── Resize ───────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

<!-- ─── AI Assistant JS ───────────────────────────── -->
<script>
  const aiInput = document.getElementById('aiInput');
  const aiBtn = document.getElementById('aiBtn');
  const aiAnswer = document.getElementById('aiAnswer');

  async function askCosmos() {
    const q = aiInput.value.trim();
    if (!q || aiBtn.classList.contains('loading')) return;
    aiBtn.classList.add('loading');
    aiBtn.textContent = '...';
    aiAnswer.classList.remove('show');
    try {
      const r = await fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q })
      });
      const data = await r.json();
      aiAnswer.innerHTML = '<div class="ai-label">Cosmos</div>' + data.answer;
      aiAnswer.classList.add('show');
    } catch (e) {
      aiAnswer.innerHTML = '<div class="ai-label">Cosmos</div>Lost in space — try again?';
      aiAnswer.classList.add('show');
    }
    aiBtn.classList.remove('loading');
    aiBtn.textContent = '\u2191';
  }

  aiBtn.addEventListener('click', askCosmos);
  aiInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') askCosmos();
    if (e.key === 'Escape') aiAnswer.classList.remove('show');
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.ai-bar-inner')) aiAnswer.classList.remove('show');
  });
</script>

</body>
</html>
