<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Vintage</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F5E6D3;
            background-image:
                radial-gradient(circle at 20% 80%, rgba(139, 90, 43, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(139, 90, 43, 0.08) 0%, transparent 50%);
            font-family: "Palatino Linotype", "Book Antiqua", Palatino, serif;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: #FFFEF7;
            border: 3px solid #8B5A2B;
            border-radius: 4px;
            padding: 48px 40px;
            box-shadow:
                0 0 0 6px #F5E6D3,
                0 0 0 9px #8B5A2B,
                0 12px 40px rgba(139, 90, 43, 0.2);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 2px dashed #D4C4A8;
        }

        .logo {
            width: 64px;
            height: 64px;
            background: #8B5A2B;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            border: 3px solid #D4C4A8;
        }

        .logo svg { width: 36px; height: 36px; }

        h1 {
            font-size: 26px;
            font-weight: 700;
            color: #5D4E37;
            margin-bottom: 6px;
            font-family: "Georgia", serif;
        }

        .subtitle {
            font-size: 14px;
            color: #8B7355;
            font-style: italic;
        }

        .form-group { margin-bottom: 22px; }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #5D4E37;
            margin-bottom: 8px;
            font-family: "Georgia", serif;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #D4C4A8;
            border-radius: 2px;
            font-size: 15px;
            color: #5D4E37;
            background: #FFFEF7;
            font-family: inherit;
            transition: all 0.3s;
        }

        .form-group input::placeholder { color: #B8A882; font-style: italic; }

        .form-group input:focus {
            outline: none;
            border-color: #8B5A2B;
            box-shadow: inset 0 0 0 1px #8B5A2B;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: #8B5A2B;
            color: #FFFEF7;
            border: none;
            border-radius: 2px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: "Georgia", serif;
            letter-spacing: 2px;
            transition: all 0.3s;
            border: 2px solid #8B5A2B;
        }

        .btn-login:hover {
            background: #6B4423;
            border-color: #6B4423;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #8B7355;
            font-style: italic;
        }

        .footer a {
            color: #8B5A2B;
            text-decoration: none;
            font-weight: 600;
            font-style: normal;
        }

        .footer a:hover { color: #6B4423; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-area">
            <div class="logo">
                <svg viewBox="0 0 48 48" fill="none">
                    <path d="M16 20C16 17.79 17.79 16 20 16H28C30.21 16 32 17.79 32 20V28C32 30.21 30.21 32 28 32H20C17.79 32 16 30.21 16 28V20Z" fill="#FFFEF7"/>
                    <circle cx="20" cy="22" r="2" fill="#8B5A2B"/>
                    <circle cx="28" cy="22" r="2" fill="#8B5A2B"/>
                    <path d="M20 27C20 27 22 29 24 29C26 29 28 27 28 27" stroke="#8B5A2B" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
            <h1>欢迎回来</h1>
            <p class="subtitle">登录到您的账户</p>
        </div>

        <form>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" placeholder="请输入密码">
            </div>
            <button type="button" class="btn-login">登 录</button>
        </form>

        <p class="footer">还没有账户？<a href="#">立即注册</a></p>
    </div>
</body>
</html>
