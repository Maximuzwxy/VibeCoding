<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #010a12;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            user-select: none;
            overflow: hidden;
        }
        #water-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
        }
        #game-wrapper { text-align: center; position: relative; z-index: 1; }
        #scoreboard {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 10px;
            margin-bottom: 10px;
            gap: 8px;
        }
        #player-score, #ai-score {
            font-size: 48px;
            font-weight: bold;
            width: 80px;
        }
        #player-score { color: #4fc3f7; }
        #ai-score { color: #ff5252; }
        #divider { color: #555; font-size: 32px; }
        #trio-scoreboard {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px 20px;
            margin-bottom: 10px;
            gap: 40px;
            background: rgba(0,0,0,0.6);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        #trio-scoreboard > div {
            font-size: 32px;
            font-weight: bold;
            min-width: 100px;
            text-align: center;
            text-shadow: 0 0 10px currentColor;
        }
        canvas {
            border: 2px solid #1a3a5c;
            border-radius: 4px;
            background: #020d1a;
        }
        #game-over {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            color: #fff;
            padding: 30px 50px;
            border-radius: 12px;
            text-align: center;
            display: none;
            pointer-events: auto;
        }
        #game-over h2 { font-size: 32px; margin-bottom: 10px; }
        #game-over .winner { color: #4fc3f7; }
        #game-over .loser { color: #ff5252; }
        #game-over p { margin: 6px 0; color: #ccc; }
        #game-over button {
            margin-top: 16px;
            padding: 10px 30px;
            font-size: 18px;
            border: none;
            background: #4fc3f7;
            color: #000;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        #game-over button:hover { background: #81d4fa; }
        #effects-bar {
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
        }
        .effect-icon {
            font-size: 20px;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(0,0,0,0.7);
            animation: pulse 0.8s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        #instructions {
            color: #555;
            font-size: 13px;
            margin-top: 8px;
        }
        #instructions span { color: #4fc3f7; }

        #start-screen {
            position: relative; z-index: 1;
            width: 800px;
            height: 500px;
            background: transparent;
            border: 2px solid #1a4a6e;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            backdrop-filter: blur(2px);
        }
        #user-page {
            position: relative; z-index: 1;
            width: 800px;
            height: 500px;
            background: transparent;
            border: 2px solid #1a4a6e;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            backdrop-filter: blur(2px);
        }
        #user-page h1 {
            font-size: 72px;
            color: #fff;
            letter-spacing: 12px;
            text-shadow: 0 0 30px rgba(79,195,247,0.5);
        }
        #user-page .subtitle {
            color: #666;
            font-size: 16px;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }
        #username-input {
            width: 260px;
            padding: 10px 16px;
            font-size: 18px;
            border: 2px solid #444;
            border-radius: 8px;
            background: #222;
            color: #fff;
            text-align: center;
            outline: none;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        #username-input:focus { border-color: #4fc3f7; }
        #enter-btn {
            padding: 12px 50px;
            font-size: 18px;
            border: none;
            background: #4fc3f7;
            color: #000;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: transform 0.15s;
        }
        #enter-btn:hover { transform: scale(1.05); }
        #username-display {
            font-size: 14px;
            color: #4fc3f7;
            margin-bottom: 4px;
            text-align: center;
        }
        #quit-btn {
            position: absolute;
            top: 6px;
            right: 8px;
            z-index: 10;
            background: transparent;
            border: 1px solid #555;
            color: #888;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        #quit-btn:hover { color: #f44336; border-color: #f44336; }
        #avatar-pick {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .av-opt {
            font-size: 32px;
            cursor: pointer;
            padding: 6px;
            border: 2px solid transparent;
            border-radius: 10px;
            transition: all 0.15s;
        }
        .av-opt:hover { background: rgba(79,195,247,0.15); }
        .av-opt.selected { border-color: #4fc3f7; background: rgba(79,195,247,0.15); }
        .big-av { font-size: 40px; }
        #settings-user {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #333;
        }
        .av-pick-small {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid #333;
        }
        .avs-opt {
            font-size: 22px;
            cursor: pointer;
            padding: 4px;
            border: 2px solid transparent;
            border-radius: 6px;
            transition: all 0.15s;
        }
        .avs-opt:hover { background: rgba(79,195,247,0.15); }
        .avs-opt.selected { border-color: #4fc3f7; background: rgba(79,195,247,0.15); }
        #settings-stats {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #333;
        }
        .stats-title {
            font-size: 14px;
            color: #4fc3f7;
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }
        .stat-item {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }
        .stat-val {
            display: block;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
        }
        .stat-label {
            font-size: 11px;
            color: #666;
        }
        .reset-btn {
            display: block;
            margin: 0 auto;
            padding: 6px 20px;
            font-size: 12px;
            border: 1px solid #555;
            background: transparent;
            color: #888;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
        }
        .reset-btn:hover { color: #f44336; border-color: #f44336; }
        #start-screen h1 {
            font-size: 72px;
            color: #fff;
            letter-spacing: 12px;
            text-shadow: 0 0 30px rgba(79,195,247,0.5);
            margin-bottom: 10px;
        }
        #start-screen .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 20px;
            letter-spacing: 4px;
        }
        #mode-select {
            display: flex;
            gap: 12px;
        }
        #mode-select button {
            padding: 12px 28px;
            font-size: 16px;
            border: 2px solid #444;
            background: transparent;
            color: #aaa;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        #mode-select button:hover { border-color: #4fc3f7; color: #fff; }
        #mode-select button.active {
            border-color: #4fc3f7;
            color: #4fc3f7;
            background: rgba(79,195,247,0.1);
        }
        #start-btn {
            padding: 14px 60px;
            font-size: 20px;
            border: none;
            background: #4fc3f7;
            color: #000;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: transform 0.15s;
        }
        #start-btn:hover { transform: scale(1.05); }
        #settings-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 42px;
            height: 42px;
            border: 2px solid #444;
            background: transparent;
            color: #888;
            font-size: 20px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #settings-btn:hover { border-color: #4fc3f7; color: #4fc3f7; transform: rotate(30deg); }
        #settings-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        #settings-panel {
            background: #1a1a2e;
            border: 2px solid #4fc3f7;
            border-radius: 12px;
            padding: 30px 36px;
            min-width: 340px;
            color: #ccc;
        }
        #settings-panel h2 {
            text-align: center;
            color: #4fc3f7;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 14px 0;
            gap: 14px;
        }
        .setting-row label {
            font-size: 15px;
            white-space: nowrap;
        }
        .setting-row input[type="range"] {
            flex: 1;
            accent-color: #4fc3f7;
        }
        .setting-row select {
            padding: 4px 10px;
            border: 1px solid #555;
            border-radius: 4px;
            background: #111;
            color: #ccc;
            font-size: 14px;
        }
        #settings-panel button {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            font-size: 16px;
            border: none;
            background: #4fc3f7;
            color: #000;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
        }
        #settings-panel button:hover { background: #81d4fa; }
        #play-again {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            color: #555;
            font-size: 13px;
        }
    </style>
</head>
<body>
<div id="user-page">
    <h1>PONG</h1>
    <div class="subtitle">选择头像 & 输入昵称</div>
    <div id="avatar-pick">
        <span class="av-opt" data-emoji="😎">😎</span>
        <span class="av-opt" data-emoji="🐱">🐱</span>
        <span class="av-opt selected" data-emoji="🎮">🎮</span>
        <span class="av-opt" data-emoji="⚡">⚡</span>
        <span class="av-opt" data-emoji="🔥">🔥</span>
        <span class="av-opt" data-emoji="🦊">🦊</span>
        <span class="av-opt" data-emoji="🐼">🐼</span>
        <span class="av-opt" data-emoji="👾">👾</span>
    </div>
    <input type="text" id="username-input" placeholder="输入昵称..." maxlength="12" autocomplete="off">
    <button id="enter-btn" onclick="enterGame()">进入游戏</button>
    <p id="name-hint" style="color:#f44336;font-size:13px;display:none;">请输入昵称</p>
</div>

<canvas id="water-bg"></canvas>

<div id="start-screen" style="display:none;">
    <h1>PONG</h1>
    <div class="subtitle">C L A S S I C</div>
    <div id="mode-select">
        <button class="active" data-mode="pve">玩家 vs AI</button>
        <button data-mode="pvp2">玩家 vs 玩家</button>
        <button data-mode="trio">三人三角</button>
        <button data-mode="2v2">2v2 vs AI</button>
        <button data-mode="1v2">1+AI v 2AI</button>
        <button data-mode="aia">AI vs AI</button>
    </div>
    <button id="start-btn" onclick="startGame()">开始游戏</button>
    <button id="settings-btn" onclick="openSettings()" class="gear">⚙</button>
</div>

<div id="settings-overlay" style="display:none;" onclick="if(event.target===this)closeSettings()">
    <div id="settings-panel">
        <h2>设置</h2>
        <div id="settings-user">
            <span id="settings-avatar" class="big-av">🎮</span>
            <div>
                <input type="text" id="settings-name" maxlength="12" onchange="updateUsername()" style="width:120px;padding:4px 8px;border:1px solid #555;border-radius:4px;background:#222;color:#fff;font-size:14px;text-align:center;">
            </div>
        </div>
        <div id="settings-avatar-pick" class="av-pick-small">
            <span class="avs-opt" data-emoji="😎">😎</span>
            <span class="avs-opt" data-emoji="🐱">🐱</span>
            <span class="avs-opt" data-emoji="🎮">🎮</span>
            <span class="avs-opt" data-emoji="⚡">⚡</span>
            <span class="avs-opt" data-emoji="🔥">🔥</span>
            <span class="avs-opt" data-emoji="🦊">🦊</span>
            <span class="avs-opt" data-emoji="🐼">🐼</span>
            <span class="avs-opt" data-emoji="👾">👾</span>
        </div>
        <div class="setting-row">
            <label>音乐音量</label>
            <input type="range" id="music-vol" min="0" max="100" value="100" oninput="updateMusicVol()">
        </div>
        <div class="setting-row">
            <label>音效音量</label>
            <input type="range" id="sfx-vol" min="0" max="100" value="100" oninput="updateSfxVol()">
        </div>
        <div class="setting-row">
            <label>球速</label>
            <input type="range" id="ball-speed" min="1" max="5" value="3" oninput="updateBallSpeed()">
        </div>
        <div class="setting-row">
            <label>球皮肤</label>
            <select id="ball-skin" onchange="updateBallSkin()">
                <option value="0">⚪ 经典</option>
                <option value="1">🏀 篮球</option>
                <option value="2">⚽ 足球</option>
                <option value="3">🎾 网球</option>
                <option value="4">⚾ 棒球</option>
                <option value="5">🧶 毛线球</option>
                <option value="6">🔮 弹珠</option>
                <option value="7">🔥 火球</option>
            </select>
        </div>
        <div class="setting-row">
            <label>拖尾颜色</label>
            <input type="color" id="trail-color" value="#ffffff" onchange="updateTrailColor()" style="width:40px;height:28px;border:1px solid #555;border-radius:4px;cursor:pointer;background:transparent;">
        </div>
        <div class="setting-row">
            <label>AI 难度</label>
            <input type="range" id="ai-diff" min="1" max="5" value="3" oninput="updateAiDiff()">
        </div>
        <div class="setting-row">
            <label>获胜分数</label>
            <select id="win-score" onchange="updateWinScore()">
                <option value="3">3 分</option>
                <option value="5">5 分</option>
                <option value="7" selected>7 分</option>
                <option value="11">11 分</option>
                <option value="15">15 分</option>
            </select>
        </div>
        <div id="settings-stats">
            <div class="stats-title">战绩</div>
            <div class="stats-grid">
                <div class="stat-item"><span class="stat-val" id="stat-total">0</span><span class="stat-label">总局数</span></div>
                <div class="stat-item"><span class="stat-val" id="stat-wins">0</span><span class="stat-label">胜场</span></div>
                <div class="stat-item"><span class="stat-val" id="stat-loses">0</span><span class="stat-label">败场</span></div>
                <div class="stat-item"><span class="stat-val" id="stat-pts">0</span><span class="stat-label">总得分</span></div>
            </div>
            <button onclick="resetStats()" class="reset-btn">重置战绩</button>
        </div>
        <button onclick="closeSettings()">关闭</button>
    </div>
</div>

<div id="game-wrapper" style="display:none;">
    <div id="username-display"></div>
    <button id="quit-btn" onclick="quitGame()" title="退出游戏">✕</button>
    <div id="scoreboard">
        <div id="player-score">0</div>
        <div id="divider">-</div>
        <div id="ai-score">0</div>
    </div>
    <div id="trio-scoreboard" style="display:none;">
        <div id="trio-left-score" style="color:#ff5252;">AI左 0</div>
        <div id="trio-bot-score" style="color:#4fc3f7;">你 0</div>
        <div id="trio-right-score" style="color:#ff9800;">AI右 0</div>
    </div>
    <div style="position:relative;">
        <canvas id="game"></canvas>
        <div id="effects-bar"></div>
        <div id="game-over">
            <h2 id="result-text"></h2>
            <p id="result-score"></p>
            <button onclick="restart()">再来一局</button>
        </div>
    </div>
    <div id="instructions">
        <span>AI vs AI</span> | <span>空格</span> 暂停
    </div>
</div>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const gameOverEl = document.getElementById('game-over');
    const playerScoreEl = document.getElementById('player-score');
    const aiScoreEl = document.getElementById('ai-score');
    const resultText = document.getElementById('result-text');
    const resultScore = document.getElementById('result-score');
    const effectsBar = document.getElementById('effects-bar');
    const trioScoreEls = [
        document.getElementById('trio-left-score'),
        document.getElementById('trio-bot-score'),
        document.getElementById('trio-right-score')
    ];
    const trioScoreboard = document.getElementById('trio-scoreboard');
    const scoreboard = document.getElementById('scoreboard');

    const W = 800, H = 500;
    canvas.width = W; canvas.height = H;

    const PADDLE_W = 12, PADDLE_H = 90, BALL_R = 8;
    let WIN = 7;

    let gameMode = 'pve'; // 'pve' | 'pvp2' | 'aia' | 'trio'
    let username = '';
    let avatar = '🎮';
    let stats = { total: 0, wins: 0, loses: 0, points: 0 };
    let gameStarted = false;
    let playerY, playerH, aiY, aiH, ballX, ballY, ballVX, ballVY;
    let p2Y, p2H, ai2Y, ai2H; // 2v2 mode paddles
    let lastHitBy = null; // 'player' | 'ai'
    let playerScore, aiScore, gameOver, paused;
    let ballSpeed, baseSpeed;
    // Trio mode
    let trioScores = [0, 0, 0]; // [left, bottom, right]
    let trioPaddlePos = [0.5, 0.5, 0.5]; // normalized positions along each side [left, bottom, right]
    const TRIO_PADDLE_LEN = 100; // paddle length along edge
    let ballSkin = 0; // 0=classic 1=basketball 2=soccer 3=tennis 4=baseball 5=yarn 6=marble 7=fire
    let trailColor = '#ffffff'; // customizable trail color
    let particles = [];
    let countdown = 0;
    let aiFrozen = 0;
    let ballTrail = [];
    const MAX_TRAIL = 12;

    // Sound system (Web Audio API)
    let audioCtx;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function playTone(freq, duration, type = 'square', vol = 0.08, glide = 0) {
        initAudio();
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        if (glide) osc.frequency.linearRampToValueAtTime(freq + glide, t + duration);
        gain.gain.setValueAtTime(vol * sfxVol, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + duration);
    }
    function sfxPaddleHit() { playTone(440, 0.08, 'square', 0.06); }
    function sfxWallHit()  { playTone(300, 0.06, 'triangle', 0.04); }
    function sfxScore()     { playTone(220, 0.25, 'sawtooth', 0.05, -100); }
    function sfxPowerUp()   {
        initAudio();
        const t = audioCtx.currentTime;
        [523, 659, 784].forEach((f, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(f, t + i * 0.08);
            g.gain.setValueAtTime(0.06 * sfxVol, t + i * 0.08);
            g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.15);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(t + i * 0.08);
            o.stop(t + i * 0.08 + 0.15);
        });
    }
    function sfxWin() {
        initAudio();
        const t = audioCtx.currentTime;
        [523, 659, 784, 1047].forEach((f, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(f, t + i * 0.12);
            g.gain.setValueAtTime(0.06 * sfxVol, t + i * 0.12);
            g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.12 + 0.2);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(t + i * 0.12);
            o.stop(t + i * 0.12 + 0.2);
        });
    }

    // Background music
    let musicOn = true;

    let masterGain; // Master gain for music

    function playMusic() {
        if (!audioCtx || !musicOn) return;
        stopMusic();
        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(musicVol * 0.7, audioCtx.currentTime);
        masterGain.connect(audioCtx.destination);

        const t = audioCtx.currentTime;
        const bpm = 130;
        const beat = 60 / bpm;

        // Simple retro bass line: C3 G3 A3 F3
        const bassNotes = [131, 196, 220, 175];
        // Melody: simple C-major pentatonic
        const melody = [
            523, 587, 659, 523, 784, 659, 523, 587,
            523, 659, 784, 659, 587, 523, 659, 523,
        ];

        // Bass
        for (let i = 0; i < 32; i++) {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = 'triangle';
            o.frequency.setValueAtTime(bassNotes[i % 4], t + i * beat * 2);
            g.gain.setValueAtTime(0.025, t + i * beat * 2);
            g.gain.linearRampToValueAtTime(0.025, t + i * beat * 2 + beat * 0.1);
            g.gain.linearRampToValueAtTime(0.001, t + i * beat * 2 + beat * 1.8);
            o.connect(g); g.connect(masterGain);
            o.start(t + i * beat * 2);
            o.stop(t + i * beat * 2 + beat * 2);
            musicNodes.push(o, g);
        }

        // Melody lead
        for (let i = 0; i < melody.length; i++) {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = 'square';
            o.frequency.setValueAtTime(melody[i], t + i * beat);
            g.gain.setValueAtTime(0.018, t + i * beat);
            g.gain.linearRampToValueAtTime(0.018, t + i * beat + 0.03);
            g.gain.linearRampToValueAtTime(0.001, t + i * beat + beat * 0.8);
            o.connect(g); g.connect(masterGain);
            o.start(t + i * beat);
            o.stop(t + i * beat + beat);
            musicNodes.push(o, g);
        }

        // Schedule loop
        const loopLen = melody.length * beat;
        musicInterval = setInterval(() => {
            if (!musicOn || !audioCtx) { clearInterval(musicInterval); return; }
            playMusic();
        }, loopLen * 1000 - 200); // Slight overlap
    }

    function stopMusic() {
        clearInterval(musicInterval);
        musicNodes.forEach(n => { try { n.stop(); } catch (e) {} });
        musicNodes = [];
    }

    function toggleMusic() {
        musicOn = !musicOn;
        if (musicOn) playMusic();
        else stopMusic();
    }

    // Pre-render background
    let waterTime = 0;

    function drawWaterBackground(ctx) {
        waterTime += 0.008;
        const t = waterTime;

        ctx.fillStyle = '#0e5a72';
        ctx.fillRect(0, 0, W, H);

        // Large wave bands — horizontal gradient strips
        for (let i = 0; i < 8; i++) {
            const baseY = (i * H / 8 + t * 20) % (H + 40) - 20;
            const grad = ctx.createLinearGradient(0, baseY - 14, 0, baseY + 14);
            grad.addColorStop(0, 'rgba(100,190,225,0)');
            grad.addColorStop(0.5, 'rgba(160,225,250,0.12)');
            grad.addColorStop(1, 'rgba(100,190,225,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, baseY - 14, W, 28);
        }
        // Diagonal cross-swells
        for (let i = 0; i < 6; i++) {
            ctx.save();
            ctx.beginPath();
            const y0 = (i * H / 5 + t * 25) % (H + 60) - 30;
            const grad = ctx.createLinearGradient(0, -15, 0, 15);
            grad.addColorStop(0, 'rgba(100,190,225,0)');
            grad.addColorStop(0.5, 'rgba(140,215,240,0.09)');
            grad.addColorStop(1, 'rgba(100,190,225,0)');
            ctx.fillStyle = grad;
            ctx.translate(0, y0);
            ctx.rotate(0.15 + i * 0.1);
            ctx.fillRect(-W, -15, W * 3, 30);
            ctx.restore();
        }

        // Foam lines
        ctx.globalAlpha = 0.1;
        ctx.strokeStyle = '#e0f4fa';
        ctx.lineWidth = 1.5;
        for (let i = 0; i < 5; i++) {
            ctx.beginPath();
            for (let j = 0; j <= W; j += 15) {
                const wy = H * 0.15 + i * H * 0.18
                         + Math.sin(j * 0.018 + t * 0.55 + i * 1.2) * 35
                         + Math.sin(j * 0.025 - t * 0.4 + i) * 20;
                j === 0 ? ctx.moveTo(j, wy) : ctx.lineTo(j, wy);
            }
            ctx.stroke();
        }
        ctx.globalAlpha = 1;

        // Sun glare
        ctx.globalAlpha = 0.09;
        for (let i = 0; i < 6; i++) {
            const gx = ((Math.sin(t * 0.25 + i * 1.5) * 0.5 + 0.5) * W);
            const gy = ((Math.cos(t * 0.2 + i * 1.8) * 0.5 + 0.5) * H);
            const gr = 20 + Math.sin(t * 1.2 + i) * 10;
            const gg = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
            gg.addColorStop(0, 'rgba(255,255,250,0.5)');
            gg.addColorStop(0.4, 'rgba(210,240,250,0.2)');
            gg.addColorStop(1, 'rgba(160,215,235,0)');
            ctx.fillStyle = gg;
            ctx.beginPath(); ctx.arc(gx, gy, gr, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
    }

    // Power-up system
    const POWER_TYPES = [
        { id: 'speed',    emoji: '⚡', name: '加速',     color: '#ffd740', desc: '球速提升' },
        { id: 'slow',     emoji: '🐢', name: '减速',     color: '#81c784', desc: '球速降低' },
        { id: 'grow',     emoji: '⬆️', name: '球拍变大', color: '#4fc3f7', desc: '我方球拍变大' },
        { id: 'shrink',   emoji: '⬇️', name: '对手缩小', color: '#ef5350', desc: 'AI 球拍缩小' },
        { id: 'freeze',   emoji: '❄️', name: '冻结',     color: '#80deea', desc: '冻结 AI' },
        { id: 'multiball',emoji: '🔵', name: '多球',     color: '#ce93d8', desc: '额外球' },

    let powerUp = null;
    let powerUpTimer = 0;
    let activeEffects = [];
    let extraBalls = [];

    function spawnPowerUp() {
        if (powerUp || gameOver) return;
        powerUpTimer++;
        if (powerUpTimer < 210) return; // ~3.5 seconds between spawns
        powerUpTimer = 0;
        const type = POWER_TYPES[Math.floor(Math.random() * POWER_TYPES.length)];
        // Spawn on paddle paths: randomly left (player) or right (AI) side
        const side = Math.random() > 0.5 ? 'left' : 'right';
        const px = side === 'left' ? 26 : W - 26;
        const py = 40 + Math.random() * (H - 80);
        powerUp = {
            type,
            x: px, y: py,
            life: 420, // 7 seconds
            pulse: 0,
        };
    }

    function collectPowerUp(type) {
        const px = powerUp.x, py = powerUp.y;
        powerUp = null;
        powerUpTimer = 0;

        // Remove conflicting effects
        activeEffects = activeEffects.filter(e =>
            !((e.id === 'speed' && type.id === 'slow') ||
              (e.id === 'slow' && type.id === 'speed') ||
              (e.id === 'grow' && type.id === 'shrink'))
        );

        // Add effect
        activeEffects.push({ ...type, timer: 360 }); // 6 seconds
        updateEffectsBar();

        // Apply
        switch (type.id) {
            case 'speed':  ballSpeed = Math.min(13, baseSpeed + 2.5); break;
            case 'slow':   ballSpeed = Math.max(2, baseSpeed - 2);   break;
            case 'grow':
                playerH = Math.min(160, PADDLE_H * 1.6);
                if (gameMode === '2v2' || gameMode === '1v2') p2H = Math.min(160, PADDLE_H * 0.55 * 1.6);
                break;
            case 'shrink':
                aiH = Math.max(35, PADDLE_H * 0.45);
                if (gameMode === '2v2' || gameMode === '1v2') ai2H = Math.max(35, PADDLE_H * 0.55 * 0.45);
                break;
            case 'freeze': aiFrozen = 180;                           break;
            case 'multiball': spawnExtraBall();                       break;
            case 'reverse':
                ballVX *= -1;
                ballVY *= -1;
                lastHitBy = ballVX > 0 ? 'player' : 'ai';
                break;
        }
        spawnParticles(px, py, type.color, 12);
        sfxPowerUp();
    }

    function spawnExtraBall() {
        const vx = -ballVX;
        extraBalls.push({
            x: ballX, y: ballY,
            vx: vx, vy: ballVY + (Math.random() - 0.5) * 3,
            lastBy: vx < 0 ? 'ai' : 'player'
        });
        // Cap extra balls
        if (extraBalls.length > 3) extraBalls.shift();
    }

    function updateEffectsBar() {
        effectsBar.innerHTML = activeEffects.map(e =>
            `<span class="effect-icon" style="color:${e.color}" title="${e.desc}">${e.emoji}</span>`
        ).join('');
    }

    function updateEffects() {
        // Timers
        activeEffects = activeEffects.filter(e => {
            e.timer--;
            if (e.timer <= 0) {
                endEffect(e);
                return false;
            }
            return true;
        });

        if (aiFrozen > 0) aiFrozen--;

        // PowerUp decay
        if (powerUp) {
            powerUp.life--;
            powerUp.pulse += 0.05;
            if (powerUp.life <= 0) {
                spawnParticles(powerUp.x, powerUp.y, '#888', 6);
                powerUp = null;
                powerUpTimer = 0;
            }
        }

        updateEffectsBar();
    }

    function endEffect(e) {
        switch (e.id) {
            case 'speed':
            case 'slow': ballSpeed = baseSpeed; break;
            case 'grow': playerH = PADDLE_H;     break;
            case 'shrink': aiH = PADDLE_H;        break;
            case 'freeze': aiFrozen = 0;           break;

    }

    function aiCollectPowerUp(pu) {
        const px = pu.x, py = pu.y;
        powerUp = null;
        powerUpTimer = 0;
        spawnParticles(px, py, pu.type.color, 12);
        sfxPowerUp();

        // AI-collected power-ups work against the player
        switch (pu.type.id) {
            case 'speed':  ballSpeed = Math.min(13, baseSpeed + 2.5); break;
            case 'slow':   ballSpeed = Math.max(2, baseSpeed - 2);   break;
            case 'grow':
                aiH = Math.min(160, PADDLE_H * 1.6);
                if (gameMode === '2v2' || gameMode === '1v2') ai2H = Math.min(160, PADDLE_H * 0.55 * 1.6);
                break;
            case 'shrink':

                if (gameMode === '2v2' || gameMode === '1v2') p2H = Math.max(35, PADDLE_H * 0.55 * 0.45);
                break;
            case 'freeze':
                // Reverse ball toward player side
                ballVX = -Math.abs(ballVX);
                break;
            case 'multiball':
                extraBalls.push({ x: ballX, y: ballY, vx: Math.abs(ballVX), vy: ballVY + (Math.random() - 0.5) * 3, lastBy: 'player' });
                if (extraBalls.length > 3) extraBalls.shift();
                break;
            case 'reverse':
                ballVX *= -1; ballVY *= -1;
                lastHitBy = ballVX > 0 ? 'player' : 'ai';
                break;
        }
    }

    // ---- Trio Mode Helpers ----
    function triVertices() {
        return [
            { x: W * 0.06, y: H * 0.88 },  // A: bottom-left
            { x: W * 0.94, y: H * 0.88 },  // B: bottom-right
            { x: W * 0.5,  y: H * 0.05 },  // C: top
        ];
    }
    function triEdges() {
        const [A, B, C] = triVertices();
        return [
            [A, C], // left edge
            [A, B], // bottom edge
            [C, B], // right edge
        ];
    }
    function edgeNormal(edge) {
        const [P1, P2] = edge;
        const dx = P2.x - P1.x, dy = P2.y - P1.y;
        const len = Math.hypot(dx, dy);
        // inward normal: rotate (dx,dy) 90° clockwise (screen coords: y-down)
        let nx = dy / len, ny = -dx / len;
        // Check it points inward (toward triangle center)
        const mid = { x: (P1.x + P2.x) / 2, y: (P1.y + P2.y) / 2 };
        const center = { x: W / 2, y: H * 0.55 };
        if ((center.x - mid.x) * nx + (center.y - mid.y) * ny < 0) { nx = -nx; ny = -ny; }
        return { nx, ny };
    }
    function signedDistToEdge(P, edge) {
        const [P1, P2] = edge;
        const { nx, ny } = edgeNormal(edge);
        return (P.x - P1.x) * nx + (P.y - P1.y) * ny;
    }
    function pointOnEdge(t, edge) {
        const [P1, P2] = edge;
        return { x: P1.x + t * (P2.x - P1.x), y: P1.y + t * (P2.y - P1.y) };
    }
    function segmentDist(P, P1, P2) {
        const dx = P2.x - P1.x, dy = P2.y - P1.y;
        const len2 = dx * dx + dy * dy;
        let tt = ((P.x - P1.x) * dx + (P.y - P1.y) * dy) / len2;
        tt = Math.max(0, Math.min(1, tt));
        const cx = P1.x + tt * dx, cy = P1.y + tt * dy;
        return Math.hypot(P.x - cx, P.y - cy);
    }
