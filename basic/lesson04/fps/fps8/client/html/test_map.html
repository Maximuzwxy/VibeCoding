<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MapGenerator Test</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        #info {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            font-family: monospace;
            font-size: 14px;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">MapGenerator Test - 鼠标左键拖动，右键旋转，滚轮缩放</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="../js/core/MapGenerator.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 30, 60);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 0, 0);
        
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(15, 20, 10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);
        
        const testObstacles = [];
        const mapData = MapGenerator.generateMapData();
        
        console.log('[Test] Map data generated:', mapData);
        console.log('[Test] Boxes count:', mapData.boxes.length);
        console.log('[Test] Trees count:', mapData.trees.length);
        console.log('[Test] Clouds count:', mapData.clouds.length);
        console.log('[Test] Grass count:', mapData.grass.length);
        
        MapGenerator.renderMap(scene, mapData, testObstacles);
        
        console.log('[Test] Rendered obstacles:', testObstacles.length);
        
        const info = document.getElementById('info');
        info.innerHTML = `
            MapGenerator Test<br>
            Boundary Walls: ${mapData.boundaryWalls.length}<br>
            Walls: ${mapData.walls.length}<br>
            Boxes: ${mapData.boxes.length}<br>
            Trees: ${mapData.trees.length}<br>
            Clouds: ${mapData.clouds.length}<br>
            Grass: ${mapData.grass.length}<br>
            Total Obstacles: ${testObstacles.length}
        `;
        
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
