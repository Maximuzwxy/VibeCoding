<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Survival — 50 Levels</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; overflow: hidden; font-family: 'Arial', sans-serif; }
        canvas { display: block; }
        #crosshair {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 5; pointer-events: none; color: rgba(255,255,255,0.7); font-size: 1.5rem;
        }
        #hud {
            position: fixed; top: 15px; left: 15px; z-index: 5; pointer-events: none;
            color: #fff; font-size: 1rem; line-height: 1.5;
        }
        #hud .label { color: #888; font-size: 0.75rem; }
        #hud .zombies { color: #4488ff; }
        #hud .ammo { color: #ffcc00; }
        #health-bar {
            position: fixed; top: 15px; right: 15px; z-index: 5; pointer-events: none;
            width: 220px; text-align: right;
        }
        #health-bar .hp-label { color: #888; font-size: 0.75rem; }
        #health-bar .hp-num { color: #ff3333; font-size: 1.5rem; font-weight: bold; }
        #health-bar-outer {
            width: 100%; height: 14px; background: rgba(255,255,255,0.15);
            border-radius: 7px; margin-top: 4px; border: 1px solid rgba(255,255,255,0.2);
        }
        #health-bar-fill {
            height: 100%; background: linear-gradient(90deg, #ff3333, #ff6644);
            border-radius: 7px; transition: width 0.3s;
        }
        #timer {
            position: fixed; top: 50%; left: 15px; transform: translateY(-50%); z-index: 5;
            pointer-events: none; text-align: center;
        }
        #timer .time-label { color: #888; font-size: 0.75rem; }
        #timer .time-val { font-size: 2.5rem; font-weight: bold; }
        #msg {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10;
            pointer-events: none; color: #fff; font-size: 2rem; font-weight: bold;
            text-shadow: 0 0 25px rgba(255,0,0,0.7); opacity: 0; transition: opacity 0.3s;
            text-align: center;
        }
        #dmg-flash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 8;
            pointer-events: none; background: rgba(255,0,0,0.35); opacity: 0;
            transition: opacity 0.1s;
        }
        #level-info {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 5;
            pointer-events: none; color: #aaa; font-size: 1rem; text-align: center;
        }
        #reload-bar {
            position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); z-index: 5;
            pointer-events: none; width: 100px; height: 4px; background: rgba(255,255,255,0.2);
            border-radius: 2px; opacity: 0; transition: opacity 0.2s;
        }
        #reload-fill {
            height: 100%; background: #ffcc00; border-radius: 2px; width: 0%;
        }
        #shop-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 20;
            background: linear-gradient(135deg, #0d0d1a, #1a1a35);
            display: none; flex-direction: column;
        }
        #shop-overlay.show { display: flex; }
        #shop-topbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 30px; border-bottom: 2px solid rgba(255,204,0,0.2);
        }
        #shop-coin-display { color: #ffcc00; font-size: 1.4rem; font-weight: bold; }
        #shop-coin-display span { font-size: 2rem; }
        #shop-action-btn {
            padding: 14px 30px; font-size: 1.1rem; font-weight: bold;
            border: none; border-radius: 8px; cursor: pointer; color: #0d0d1a;
            transition: all 0.2s;
        }
        #shop-action-btn.level-up { background: linear-gradient(135deg, #44ff44, #22cc22); }
        #shop-action-btn.level-up:hover { background: linear-gradient(135deg, #66ff66, #44ee44); transform: scale(1.03); }
        #shop-action-btn.restart { background: linear-gradient(135deg, #ff4444, #cc2222); color: #fff; }
        #shop-action-btn.restart:hover { background: linear-gradient(135deg, #ff6666, #ee4444); transform: scale(1.03); }
        #shop-main {
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
            gap: 25px;
        }
        #shop-title { font-size: 3rem; color: #ffcc00; font-weight: bold; text-shadow: 0 0 30px rgba(255,204,0,0.3); }
        #shop-subtitle { color: #888; font-size: 1.2rem; }
        #shop-stats { display: flex; gap: 40px; margin: 10px 0; }
        #shop-stats .stat { text-align: center; }
        #shop-stats .stat .val { font-size: 2rem; font-weight: bold; }
        #shop-stats .stat .lbl { color: #888; font-size: 0.85rem; }
        #shop-stats .val.coins { color: #ffcc00; }
        #shop-stats .val.slots { color: #44aaff; }
        #shop-stats .val.level { color: #44ff44; }
        #shop-buy {
            padding: 16px 50px; font-size: 1.2rem; font-weight: bold;
            background: linear-gradient(135deg, #ffcc00, #ffaa00); color: #0d0d1a;
            border: none; border-radius: 10px; cursor: pointer; transition: all 0.2s;
        }
        #shop-buy:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(255,204,0,0.4); }
        #shop-buy:disabled { background: #444; color: #777; cursor: not-allowed; transform: none; box-shadow: none; }
        #shop-msg { color: #ff6666; font-size: 1rem; min-height: 24px; }
        #coin-hud { color: #ffcc00; font-size: 1rem; }
    </style>
</head>
<body>
    <div id="crosshair">+</div>
    <div id="hud">
        <div class="label">ZOMBIES</div>
        <div class="zombies" id="zombie-count">0</div>
        <div class="label">AMMO</div>
        <div class="ammo"><span id="ammo-val">10</span>/<span id="ammo-max">10</span></div>
        <div class="label">COINS</div>
        <div id="coin-hud"><span id="coin-val">0</span></div>
    </div>
    <div id="health-bar">
        <div class="hp-label">HEALTH</div>
        <div class="hp-num"><span id="hp-val">100</span>/100</div>
        <div id="health-bar-outer"><div id="health-bar-fill" style="width:100%"></div></div>
    </div>
    <div id="timer">
        <div class="time-label">SURVIVE</div>
        <div class="time-val" id="time-val" style="color:#ffcc00">2:00</div>
    </div>
    <div id="reload-bar"><div id="reload-fill"></div></div>
    <div id="shop-overlay">
        <div id="shop-topbar">
            <div id="shop-coin-display">Coins: <span id="shop-coin-val">0</span></div>
            <button id="shop-action-btn">Level Up</button>
        </div>
        <div id="shop-main">
            <div id="shop-title">SHOP</div>
            <div id="shop-subtitle">Spend coins to buy ammo slots</div>
            <div id="shop-stats">
                <div class="stat"><div class="val coins" id="shop-stat-coins">0</div><div class="lbl">Coins</div></div>
                <div class="stat"><div class="val slots" id="shop-stat-slots">10</div><div class="lbl">Ammo Slots</div></div>
                <div class="stat"><div class="val level" id="shop-stat-level">1</div><div class="lbl">Level</div></div>
            </div>
            <button id="shop-buy">Buy Ammo Slot — 5 Coins</button>
            <div id="shop-msg"></div>
        </div>
    </div>
    <div id="msg"></div>
    <div id="dmg-flash"></div>
    <div id="level-info">Level <span id="lv-num">1</span> | Best: <span id="best-lv">1</span></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
import * as THREE from 'three';

// ==================== AUDIO ====================
let audioCtx;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, dur, type = 'square', vol = 0.08) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + dur);
}

// ==================== SCENE ====================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x4488aa);
scene.fog = new THREE.Fog(0x4488aa, 60, 250);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.5, 300);
camera.position.set(0, 12, -15);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Brighter lighting
scene.add(new THREE.AmbientLight(0xaaccee, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 3.5);
sun.position.set(30, 50, 20);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 300;
sun.shadow.camera.left = -80;
sun.shadow.camera.right = 80;
sun.shadow.camera.top = 80;
sun.shadow.camera.bottom = -80;
scene.add(sun);

// Ground
const groundGeo = new THREE.PlaneGeometry(400, 400);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x3a7a20, roughness: 0.85 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ==================== BIGGER ARENA ====================
const ARENA_SIZE = 90;
const wallMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.6, metalness: 0.3 });
const wallGeoH = new THREE.BoxGeometry(ARENA_SIZE * 2, 6, 1);
const wallGeoV = new THREE.BoxGeometry(1, 6, ARENA_SIZE * 2);

[[0, 3, -ARENA_SIZE], [0, 3, ARENA_SIZE]].forEach(([wx, wy, wz]) => {
    const w = new THREE.Mesh(wallGeoH, wallMat);
    w.position.set(wx, wy, wz);
    w.castShadow = true; w.receiveShadow = true;
    scene.add(w);
});
[[-ARENA_SIZE, 3, 0], [ARENA_SIZE, 3, 0]].forEach(([wx, wy, wz]) => {
    const w = new THREE.Mesh(wallGeoV, wallMat);
    w.position.set(wx, wy, wz);
    w.castShadow = true; w.receiveShadow = true;
    scene.add(w);
});

// Barbed wire posts
for (let i = -ARENA_SIZE; i <= ARENA_SIZE; i += 2.5) {
    for (let side = -1; side <= 1; side += 2) {
        [[i, 6.2, side * ARENA_SIZE], [side * ARENA_SIZE, 6.2, i]].forEach(([bx, by, bz]) => {
            const post = new THREE.Mesh(
                new THREE.CylinderGeometry(0.08, 0.08, 1.5, 6),
                new THREE.MeshStandardMaterial({ color: 0x777777, roughness: 0.5, metalness: 0.5 }));
            post.position.set(bx, by, bz);
            post.castShadow = true;
            scene.add(post);
        });
    }
}

// ==================== PLAYER (Human) ====================
const player = new THREE.Group();

// Body
const torsoGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.9, 8);
const shirtMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 });
const torso = new THREE.Mesh(torsoGeo, shirtMat);
torso.position.y = 1.2;
torso.castShadow = true;
player.add(torso);

// Pants (legs)
const pantsMat = new THREE.MeshStandardMaterial({ color: 0x6b4226, roughness: 0.7 });
[-0.12, 0.12].forEach(lx => {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.8, 6), pantsMat);
    leg.position.set(lx, 0.4, 0);
    leg.castShadow = true;
    player.add(leg);
});

// Shoes
const shoeMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.5 });
[-0.12, 0.12].forEach(sx => {
    const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.12, 0.22), shoeMat);
    shoe.position.set(sx, 0.08, 0.04);
    player.add(shoe);
});

// Head
const headGeo = new THREE.SphereGeometry(0.22, 10, 10);
const headMat = new THREE.MeshStandardMaterial({ color: 0xf5d0b0, roughness: 0.5 });
const head = new THREE.Mesh(headGeo, headMat);
head.position.y = 1.8;
head.castShadow = true;
player.add(head);

// Hair
const hairMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });
const hair = new THREE.Mesh(new THREE.SphereGeometry(0.23, 10, 6, 0, Math.PI * 2, 0, Math.PI * 0.6), hairMat);
hair.position.set(0, 1.85, -0.02);
player.add(hair);

// Arms
[0.35, -0.35].forEach(ax => {
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.7, 6), shirtMat);
    arm.position.set(ax, 1.35, 0);
    arm.rotation.z = ax > 0 ? 0.3 : -0.3;
    arm.castShadow = true;
    player.add(arm);
});

// Gun (right arm)
const gunGroup = new THREE.Group();
const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.06, 0.4), new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.3, metalness: 0.7 }));
gunBody.position.set(0, 0, 0.15);
gunGroup.add(gunBody);
const gunHandle = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.15, 0.06), new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.3, metalness: 0.6 }));
gunHandle.position.set(0, -0.08, 0);
gunGroup.add(gunHandle);
gunGroup.position.set(0.38, 1.15, 0.25);
gunGroup.rotation.z = -2.3;
gunGroup.rotation.x = -0.5;
player.add(gunGroup);

scene.add(player);
player.position.set(0, 0, 0);

// ==================== FOREST ====================
function createTree(x, z, scale) {
    const t = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1 * scale, 0.18 * scale, 2.5 * scale, 8),
        new THREE.MeshStandardMaterial({ color: 0x5a3a1a, roughness: 0.8 }));
    trunk.position.y = 1.25 * scale;
    trunk.castShadow = true; trunk.receiveShadow = true;
    t.add(trunk);
    for (let i = 0; i < 4; i++) {
        const c = new THREE.Mesh(new THREE.ConeGeometry((1.5 - i * 0.25) * scale, (1.3 - i * 0.08) * scale, 8),
            new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(0.24 + i * 0.04, 0.55, 0.22 + i * 0.06), roughness: 0.7 }));
        c.position.y = (2 + i * 0.75) * scale;
        c.castShadow = true; c.receiveShadow = true;
        t.add(c);
    }
    t.position.set(x, 0, z);
    scene.add(t);
    return t;
}
for (let i = 0; i < 250; i++) {
    const tx = (Math.random() - 0.5) * (ARENA_SIZE * 2 - 8);
    const tz = (Math.random() - 0.5) * (ARENA_SIZE * 2 - 8);
    if (Math.abs(tx) < 5 && Math.abs(tz) < 5) continue;
    createTree(tx, tz, 0.5 + Math.random() * 1.5);
}

// ==================== ZOMBIES ====================
const zombies = [];
const zombieGroup = new THREE.Group();
scene.add(zombieGroup);

function createZombieModel() {
    const z = new THREE.Group();
    const zb = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.8, 0.35),
        new THREE.MeshStandardMaterial({ color: 0x3344aa, roughness: 0.7 })); // BLUE
    zb.position.y = 0.6; zb.castShadow = true; z.add(zb);
    const zh = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8),
        new THREE.MeshStandardMaterial({ color: 0x5566cc, roughness: 0.5 })); // BLUE
    zh.position.y = 1.15; zh.castShadow = true; z.add(zh);
    const eyeGeo = new THREE.SphereGeometry(0.04, 4, 4);
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff4400 });
    [-0.07, 0.07].forEach(ex => {
        const eye = new THREE.Mesh(eyeGeo, eyeMat);
        eye.position.set(ex, 1.2, 0.17);
        z.add(eye);
    });
    [-0.35, 0.35].forEach(ax => {
        const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.7, 6),
            new THREE.MeshStandardMaterial({ color: 0x3344aa, roughness: 0.7 }));
        arm.position.set(ax, 0.8, 0); arm.castShadow = true;
        z.add(arm);
    });
    return z;
}

function spawnZombie(level) {
    let zx, zz;
    do {
        const edge = Math.floor(Math.random() * 4);
        if (edge === 0) { zx = -ARENA_SIZE + 3; zz = (Math.random() - 0.5) * ARENA_SIZE * 1.8; }
        else if (edge === 1) { zx = ARENA_SIZE - 3; zz = (Math.random() - 0.5) * ARENA_SIZE * 1.8; }
        else if (edge === 2) { zz = -ARENA_SIZE + 3; zx = (Math.random() - 0.5) * ARENA_SIZE * 1.8; }
        else { zz = ARENA_SIZE - 3; zx = (Math.random() - 0.5) * ARENA_SIZE * 1.8; }
    } while (Math.hypot(zx - player.position.x, zz - player.position.z) < 20);

    const model = createZombieModel();
    model.position.set(zx, 0, zz);
    zombieGroup.add(model);
    zombies.push({ model, speed: 1.5 + level * 0.2 + Math.random() * 1.5, hp: 1 });
}
function killZombie(idx) {
    const z = zombies[idx];
    zombieGroup.remove(z.model);
    zombies.splice(idx, 1);
    coins += 2;
    // Death particles
    for (let i = 0; i < 10; i++) {
        const p = new THREE.Mesh(new THREE.SphereGeometry(0.06, 3, 3),
            new THREE.MeshBasicMaterial({ color: 0x4466ff, transparent: true, opacity: 0.8 }));
        p.position.copy(z.model.position);
        p.userData = { life: 0.5, vx: (Math.random()-0.5)*4, vy: Math.random()*3+1, vz: (Math.random()-0.5)*4 };
        scene.add(p);
        deathParticles.push(p);
    }
}

// ==================== BULLETS ====================
const bullets = [];
const bulletGroup = new THREE.Group();
scene.add(bulletGroup);

function shoot() {
    if (totalAmmo <= 0 || !gameActive) return;
    totalAmmo--;
    updateHUD();
    const dir = new THREE.Vector3(0, 0, 1);
    dir.applyQuaternion(player.quaternion);
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.06, 4, 4),
        new THREE.MeshBasicMaterial({ color: 0xffff00 }));
    b.position.copy(player.position);
    b.position.y += 1.5;
    b.position.add(dir.clone().multiplyScalar(1.2));
    bulletGroup.add(b);
    bullets.push({ mesh: b, dir: dir.clone(), life: 2.0, speed: 35 });
    playSound(800, 0.1, 'square', 0.05);
}

// ==================== DEATH PARTICLES ====================
const deathParticles = [];

// ==================== GAME STATE ====================
let level = 1;
let bestLevel = parseInt(localStorage.getItem('zombieBestLevel') || '1');
let playerYaw = 0;
let playerHP = 100;
const MAX_HP = 100;
let surviveTime = 120;
let surviveTimer = 120;
let gameActive = true;
let levelComplete = false;
let invincibleTimer = 0;
let zombieSpawnTimer = 0;
let totalAmmo = 10;
let maxAmmo = 10;
let coins = 0;

const playerSpeed = 14;
const keys = {};

function resetLevel() {
    playerHP = MAX_HP;
    surviveTimer = surviveTime;
    invincibleTimer = 2;
    zombieSpawnTimer = 0;
    levelComplete = false;
    gameActive = true;
    totalAmmo = maxAmmo;
    player.position.set(0, 0, 0);
    playerYaw = 0;

    while (zombieGroup.children.length > 0) zombieGroup.remove(zombieGroup.children[0]);
    zombies.length = 0;
    while (bulletGroup.children.length > 0) bulletGroup.remove(bulletGroup.children[0]);
    bullets.length = 0;
    while (deathParticles.length > 0) { scene.remove(deathParticles.pop()); }

    const baseCount = 6 + level * 3;
    for (let i = 0; i < baseCount; i++) spawnZombie(level);
    updateHUD();
}

function updateHUD() {
    document.getElementById('zombie-count').textContent = zombies.length;
    document.getElementById('ammo-val').textContent = Math.max(0, totalAmmo);
    document.getElementById('ammo-max').textContent = maxAmmo;
    document.getElementById('coin-val').textContent = coins;
    document.getElementById('hp-val').textContent = Math.max(0, playerHP);
    document.getElementById('health-bar-fill').style.width = Math.max(0, playerHP / MAX_HP * 100) + '%';
    document.getElementById('lv-num').textContent = level;
    document.getElementById('best-lv').textContent = 'Best: ' + bestLevel;
    const mins = Math.floor(surviveTimer / 60);
    const secs = Math.floor(surviveTimer % 60);
    document.getElementById('time-val').textContent = mins + ':' + String(secs).padStart(2, '0');
    const tc = surviveTimer < 30 ? '#ff3333' : surviveTimer < 60 ? '#ff8833' : '#ffcc00';
    document.getElementById('time-val').style.color = tc;
}

function showMessage(text, color = '#ffcc00') {
    const msg = document.getElementById('msg');
    msg.textContent = text; msg.style.color = color; msg.style.opacity = '1';
    setTimeout(() => { msg.style.opacity = '0'; }, 2000);
}

// ==================== SHOP ====================
function openShop() {
    document.getElementById('shop-overlay').classList.add('show');
    const btn = document.getElementById('shop-action-btn');
    if (levelComplete) {
        btn.textContent = 'Level Up!';
        btn.className = 'level-up';
    } else {
        btn.textContent = 'Restart Level';
        btn.className = 'restart';
    }
    updateShopUI();
}
function closeShop() {
    document.getElementById('shop-overlay').classList.remove('show');
    document.getElementById('shop-msg').textContent = '';
}
function updateShopUI() {
    document.getElementById('shop-coin-val').textContent = coins;
    document.getElementById('shop-stat-coins').textContent = coins;
    document.getElementById('shop-stat-slots').textContent = maxAmmo;
    document.getElementById('shop-stat-level').textContent = level;
    const buyBtn = document.getElementById('shop-buy');
    buyBtn.disabled = coins < 5;
}
function buyAmmoSlot() {
    if (coins >= 5) {
        coins -= 5;
        maxAmmo++;
        updateShopUI();
        document.getElementById('shop-msg').textContent = 'Purchased! +1 Ammo Slot.';
        playSound(600, 0.15, 'triangle', 0.06);
    } else {
        document.getElementById('shop-msg').textContent = 'Not enough coins!';
    }
}
function shopAction() {
    closeShop();
    if (levelComplete) {
        level++;
        if (level > 50) { showMessage('YOU BEAT ALL 50 LEVELS!', '#ffcc00'); level = 1; }
        if (level > bestLevel) { bestLevel = level; localStorage.setItem('zombieBestLevel', bestLevel); }
        surviveTime = Math.max(90, 120 - level * 0.6);
    } else {
        level = Math.max(1, level - 1);
        if (level > bestLevel) { bestLevel = level; localStorage.setItem('zombieBestLevel', bestLevel); }
    }
    resetLevel();
}

// Shop button handlers
document.getElementById('shop-buy').addEventListener('click', buyAmmoSlot);
document.getElementById('shop-action-btn').addEventListener('click', shopAction);

function damagePlayer(amount) {
    if (invincibleTimer > 0 || !gameActive || levelComplete) return;
    playerHP -= amount;
    invincibleTimer = 0.8;
    document.getElementById('dmg-flash').style.opacity = '1';
    setTimeout(() => { document.getElementById('dmg-flash').style.opacity = '0'; }, 100);
    playSound(100, 0.3, 'sawtooth', 0.08);
    if (playerHP <= 0) {
        playerHP = 0;
        gameActive = false;
        showMessage('YOU DIED! Level ' + level + ' Failed — Visit the Shop!', '#ff0000');
        openShop();
    }
    updateHUD();
}

// ==================== CONTROLS ====================
document.addEventListener('keydown', e => {
    keys[e.code] = true;
    initAudio();
    if (!gameActive) return;
    if (e.code === 'Space') { e.preventDefault(); shoot(); }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// Mouse shoot (only if not a drag)
let dragMoved = false;
let camTheta = Math.PI, camPhi = 0.55, camRadius = 22;
let mouseDown = false, prevMX = 0, prevMY = 0;

renderer.domElement.addEventListener('mousedown', e => {
    mouseDown = true; prevMX = e.clientX; prevMY = e.clientY; dragMoved = false;
});
window.addEventListener('mouseup', () => { mouseDown = false; });
window.addEventListener('mousemove', e => {
    if (!mouseDown) return;
    const dx = e.clientX - prevMX;
    const dy = e.clientY - prevMY;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) dragMoved = true;
    playerYaw -= dx * 0.005;
    camPhi -= dy * 0.005;
    camPhi = Math.max(0.1, Math.min(1.4, camPhi));
    prevMX = e.clientX; prevMY = e.clientY;
});
renderer.domElement.addEventListener('click', () => {
    if (dragMoved) return;
    initAudio();
    if (!gameActive) return;
    shoot();
});
renderer.domElement.addEventListener('wheel', e => {
    camRadius += e.deltaY * 0.04;
    camRadius = Math.max(6, Math.min(50, camRadius));
});
renderer.domElement.addEventListener('touchstart', e => {
    if (e.touches.length === 1) { mouseDown = true; prevMX = e.touches[0].clientX; prevMY = e.touches[0].clientY; }
});
window.addEventListener('touchend', () => { mouseDown = false; });
window.addEventListener('touchmove', e => {
    if (!mouseDown || e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - prevMX;
    const dy = e.touches[0].clientY - prevMY;
    playerYaw -= dx * 0.005;
    camPhi -= dy * 0.005; camPhi = Math.max(0.1, Math.min(1.4, camPhi));
    prevMX = e.touches[0].clientX; prevMY = e.touches[0].clientY;
});

// ==================== UPDATE ====================
const clock = new THREE.Clock();

function update() {
    const dt = Math.min(clock.getDelta(), 0.1);
    requestAnimationFrame(update);
    if (!gameActive) { renderer.render(scene, camera); return; }

    // Timer
    if (!levelComplete) {
        surviveTimer -= dt;
        if (surviveTimer <= 0) {
            surviveTimer = 0; levelComplete = true; gameActive = false;
            showMessage('SURVIVED! Level ' + level + ' Complete!', '#00ff00');
            openShop();
        }
    }

    // Invincibility
    if (invincibleTimer > 0) invincibleTimer -= dt;

    // Movement
    let mx = 0, mz = 0;
    if (keys['KeyW'] || keys['ArrowUp']) { mz = 1; }
    if (keys['KeyS'] || keys['ArrowDown']) { mz = -1; }
    if (keys['KeyA'] || keys['ArrowLeft']) { mx = -1; }
    if (keys['KeyD'] || keys['ArrowRight']) { mx = 1; }
    if (mx !== 0 || mz !== 0) {
        const len = Math.sqrt(mx * mx + mz * mz);
        mx /= len; mz /= len;
        const sin = Math.sin(playerYaw), cos = Math.cos(playerYaw);
        player.position.x += (mx * cos + mz * sin) * playerSpeed * dt;
        player.position.z += (-mx * sin + mz * cos) * playerSpeed * dt;
    }
    player.rotation.y = playerYaw;

    // Border
    if (Math.abs(player.position.x) > ARENA_SIZE - 0.5) player.position.x = Math.sign(player.position.x) * (ARENA_SIZE - 0.5);
    if (Math.abs(player.position.z) > ARENA_SIZE - 0.5) player.position.z = Math.sign(player.position.z) * (ARENA_SIZE - 0.5);

    // Zombie spawning
    zombieSpawnTimer -= dt;
    if (zombieSpawnTimer <= 0 && !levelComplete) {
        zombieSpawnTimer = 2.5 + Math.random() * 3 - level * 0.03;
        spawnZombie(level);
    }

    // Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.mesh.position.add(b.dir.clone().multiplyScalar(b.speed * dt));
        b.life -= dt;
        if (b.life <= 0) {
            bulletGroup.remove(b.mesh);
            b.mesh.geometry.dispose(); b.mesh.material.dispose();
            bullets.splice(i, 1);
            continue;
        }
        // Check bullet-zombie collision (horizontal distance only)
        for (let j = zombies.length - 1; j >= 0; j--) {
            const z = zombies[j];
            const hDist = Math.hypot(
                b.mesh.position.x - z.model.position.x,
                b.mesh.position.z - z.model.position.z
            );
            if (hDist < 1.2) {
                bulletGroup.remove(b.mesh);
                b.mesh.geometry.dispose(); b.mesh.material.dispose();
                bullets.splice(i, 1);
                killZombie(j);
                playSound(300, 0.2, 'triangle', 0.06);
                break;
            }
        }
    }

    // Zombie AI
    for (let i = zombies.length - 1; i >= 0; i--) {
        const z = zombies[i];
        const dx = player.position.x - z.model.position.x;
        const dz = player.position.z - z.model.position.z;
        const dist = Math.hypot(dx, dz);
        if (dist > 0.1) {
            z.model.position.x += (dx / dist) * z.speed * dt;
            z.model.position.z += (dz / dist) * z.speed * dt;
            z.model.rotation.y = Math.atan2(dx, dz);
        }
        if (dist < 1.0) {
            damagePlayer(30);
            z.model.position.x -= (dx / dist) * 3;
            z.model.position.z -= (dz / dist) * 3;
        }
        z.model.children[1].position.y = 1.15 + Math.sin(Date.now() * 0.008 + i) * 0.04;
    }

    // Death particles
    for (let i = deathParticles.length - 1; i >= 0; i--) {
        const p = deathParticles[i];
        p.position.x += p.userData.vx * dt;
        p.position.y += p.userData.vy * dt;
        p.position.z += p.userData.vz * dt;
        p.userData.vy -= 6 * dt;
        p.userData.life -= dt;
        p.material.opacity = p.userData.life * 2;
        if (p.userData.life <= 0) { scene.remove(p); p.geometry.dispose(); p.material.dispose(); deathParticles.splice(i, 1); }
    }

    // Camera 3rd person
    const orbitYaw = playerYaw + camTheta;
    const cx = player.position.x + Math.sin(orbitYaw) * Math.sin(camPhi) * camRadius;
    const cy = player.position.y + Math.cos(camPhi) * camRadius;
    const cz = player.position.z + Math.cos(orbitYaw) * Math.sin(camPhi) * camRadius;
    camera.position.lerp(new THREE.Vector3(cx, cy, cz), 4 * dt);
    camera.lookAt(player.position.x, player.position.y + 1.5, player.position.z);

    updateHUD();
    renderer.render(scene, camera);
}

// Resize
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Start
resetLevel();
showMessage('SURVIVE 2 MINUTES! Click/Space to shoot. Kill zombies for coins!', '#ffcc00');
update();
console.log('Zombie Survival ready! WASD move, click shoot, R reload.');
    </script>
</body>
</html>
