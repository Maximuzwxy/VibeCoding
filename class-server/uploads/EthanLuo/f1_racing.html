<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 Racing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: 'Segoe UI', 'Arial', sans-serif; }
  canvas { display: block; }

  #hud {
    position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 24px; z-index: 10; pointer-events: none;
    background: rgba(0,0,0,0.75); padding: 14px 28px; border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(10px);
  }
  .hud-item { text-align: center; min-width: 55px; }
  .hud-label { color: #888; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 2px; }
  .hud-value { color: #fff; font-size: 32px; font-weight: 700; line-height: 1; }
  .hud-value.speed { color: #ff3333; font-size: 38px; }
  .hud-unit { color: #555; font-size: 11px; margin-top: 1px; }

  #gear-box {
    position: fixed; top: 50%; right: 40px; transform: translateY(-50%);
    z-index: 10; pointer-events: none;
    background: rgba(0,0,0,0.7); border-radius: 12px; padding: 8px 14px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .gear-led { width: 24px; height: 6px; margin: 5px 0; border-radius: 3px; background: #222; transition: background 0.1s; }
  .gear-led.active { background: #00ff88; box-shadow: 0 0 8px #00ff88; }
  .gear-led.rev { background: #ff4444; box-shadow: 0 0 8px #ff4444; }

  #g-box {
    position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%);
    width: 80px; height: 80px; z-index: 10; pointer-events: none;
    background: rgba(0,0,0,0.55); border-radius: 50%; border: 1px solid rgba(255,255,255,0.08);
  }
  #g-dot {
    position: absolute; width: 8px; height: 8px; background: #ff4444;
    border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%);
    box-shadow: 0 0 12px #ff4444;
  }

  #minimap {
    position: fixed; bottom: 20px; right: 20px;
    width: 140px; height: 140px; z-index: 10; pointer-events: none;
    background: rgba(0,0,0,0.6); border-radius: 70px; border: 1px solid rgba(255,255,255,0.12);
  }
  #minimap canvas { border-radius: 70px; }

  #info {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.45); font-size: 12px; z-index: 10; pointer-events: none;
    letter-spacing: 1px;
  }
  #lap-timer {
    position: fixed; top: 40px; left: 50%; transform: translateX(-50%);
    color: #ffcc00; font-size: 16px; font-weight: bold; z-index: 10; pointer-events: none;
    opacity: 0; transition: opacity 0.5s;
  }
  /* Login overlay */
  #login-overlay {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.85);
  }
  #login-box {
    text-align: center; padding: 36px 32px;
    border: 2px solid #444; border-radius: 10px;
    background: #111;
  }
  #login-box h2 { color: #4af; font-size: 24px; letter-spacing: 4px; margin-bottom: 8px; }
  #login-box p { color: #888; font-size: 13px; margin-bottom: 16px; }
  #login-box input {
    display: block; width: 220px; margin: 0 auto 12px;
    padding: 10px; font-size: 15px; text-align: center;
    border: 2px solid #444; border-radius: 6px;
    background: #000; color: #fff; outline: none;
  }
  #login-box input:focus { border-color: #4af; }
  #login-box button {
    padding: 10px 36px; font-size: 15px; font-weight: 700;
    border: none; border-radius: 6px; background: #4af; color: #000;
    cursor: pointer;
  }
  #login-box button:hover { background: #6cf; }
  #online-count {
    position: fixed; top: 12px; left: 16px; z-index: 20;
    color: #aaa; font-size: 12px; pointer-events: none;
  }
  #online-count span { color: #4f4; font-weight: 700; }
  /* Other player nametag */
  .other-tag {
    position: absolute; color: #fff; font-size: 10px;
    text-align: center; transform: translate(-50%, -30px);
    pointer-events: none; text-shadow: 0 0 4px #000;
  }
  /* Leaderboard */
  #leaderboard {
    position: fixed; top: 12px; right: 12px; z-index: 20;
    background: rgba(0,0,0,0.8); border: 1px solid #333;
    border-radius: 6px; padding: 10px 14px; min-width: 180px;
    display: none;
  }
  #leaderboard h3 {
    color: #ffcc00; font-size: 12px; letter-spacing: 2px;
    margin: 0 0 6px; text-align: center;
  }
  #leaderboard ol {
    margin: 0; padding: 0 0 0 20px;
    font-size: 11px; color: #ccc;
  }
  #leaderboard li {
    padding: 1px 0; display: flex; justify-content: space-between; gap: 12px;
  }
  #leaderboard li .lb-name { color: #4af; }
  #leaderboard li .lb-time { color: #fff; font-weight: 700; }
  #leaderboard li.top { color: #ffcc00; }
</style>
</head>
<body>

<!-- Login -->
<div id="login-overlay">
  <div id="login-box">
    <h2>F1 MULTIPLAYER</h2>
    <p>Enter your username to race</p>
    <input type="text" id="login-input" placeholder="Username" maxlength="12" autofocus>
    <button id="login-btn">JOIN RACE</button>
  </div>
</div>
<div id="online-count">Online: <span id="online-num">0</span></div>

<div id="hud">
  <div class="hud-item">
    <div class="hud-label">速度</div>
    <div class="hud-value speed" id="speedVal">0</div>
    <div class="hud-unit">km/h</div>
  </div>
  <div class="hud-item">
    <div class="hud-label">圈</div>
    <div class="hud-value" id="lapVal">0</div>
    <div class="hud-unit">/10</div>
  </div>
  <div class="hud-item">
    <div class="hud-label">时间</div>
    <div class="hud-value" id="timeVal" style="font-size:22px;">0:00</div>
    <div class="hud-unit">best <span id="bestVal">--</span></div>
  </div>
  <div class="hud-item">
    <div class="hud-label" style="color:#ff4444;">转速</div>
    <div class="hud-value" id="rpmVal" style="font-size:20px;color:#ff6644;">0</div>
    <div class="hud-unit">×1000rpm</div>
  </div>
</div>

<div id="gear-box">
  <div class="gear-led" style="margin-top:0"></div>
  <div class="gear-led"></div>
  <div class="gear-led"></div>
  <div class="gear-led"></div>
  <div class="gear-led"></div>
  <div class="gear-led"></div>
  <div class="gear-led"></div>
  <div class="gear-led" style="margin-bottom:0"></div>
</div>

<div id="drs-indicator" style="position:absolute;top:285px;right:18px;font-size:14px;font-weight:700;color:#0a0;padding:4px 10px;border:2px solid #0a0;border-radius:4px;opacity:0;transition:opacity 0.2s;letter-spacing:2px;">DRS</div>

<div id="g-box"><div id="g-dot"></div></div>
<div id="minimap"><canvas width="140" height="140" id="minimapCanvas"></canvas></div>
<div id="info">W/S 油门/刹车 | A/D 转向 | 空格 手刹 | C 视角 | R 重置</div>
<div id="lap-timer"></div>

<!-- Leaderboard -->
<div id="leaderboard">
  <h3>BEST LAPS</h3>
  <ol id="lb-list"></ol>
  <div style="font-size:10px;color:#666;margin-top:4px;">P to toggle</div>
</div>

<div id="status-msg" style="position:fixed;top:10px;left:10px;color:lime;z-index:9999;font:14px monospace;background:rgba(0,0,0,.8);padding:4px 8px;border-radius:4px">Loading 3D engine (669KB)...</div>
<script>
(function() {
  var s = document.createElement('script');
  s.src = '/static/three.min.js';
  s.onload = function() { 
    document.getElementById("status-msg").textContent = "THREE loaded ✓, starting game..."; 
    try {
      runGame();
    } catch(e) {
      document.getElementById("status-msg").textContent = "ERROR: " + e.message + " (line " + e.lineNumber + ")";
      throw e;
    }
  };
  s.onerror = function() { document.getElementById("status-msg").textContent = "ERROR: Failed to load 3D engine. Refresh."; };
  document.head.appendChild(s);
})();
</script>
 <script>
function runGame() {
const THREE = window.THREE;
document.getElementById("status-msg").textContent = "Step 1: Scene setup...";

// ── Scene ──
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x6ba8d6);
scene.fog = new THREE.Fog(0x6ba8d6, 100, 400);

const camera = new THREE.PerspectiveCamera(68, window.innerWidth / window.innerHeight, 0.5, 600);
camera.position.set(0, 10, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// ── Lights ──
scene.add(new THREE.AmbientLight(0x8899bb, 0.5));
const sun = new THREE.DirectionalLight(0xfffff0, 3.5);
sun.position.set(60, 80, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 250;
sun.shadow.camera.left = -80; sun.shadow.camera.right = 80;
sun.shadow.camera.top = 80; sun.shadow.camera.bottom = -80;
sun.shadow.bias = -0.0004;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x8899ff, 0x554433, 0.35));

// ── Track curve ──
const TRACK_RAISE = 0.10; // slight lift above ground

const trackPts = [
  // ── Start/finish straight (ground) ──
  new THREE.Vector3(0, TRACK_RAISE, -50),
  new THREE.Vector3(20, TRACK_RAISE, -48),
  new THREE.Vector3(40, TRACK_RAISE, -38),
  // ── Ramp up ──
  new THREE.Vector3(50, 2 + TRACK_RAISE, -22),
  new THREE.Vector3(52, 6 + TRACK_RAISE, -5),
  // ── Bridge (elevated) ──
  new THREE.Vector3(50, 8 + TRACK_RAISE, 12),
  new THREE.Vector3(42, 8 + TRACK_RAISE, 28),
  new THREE.Vector3(28, 8 + TRACK_RAISE, 40),
  // ── Ramp down ──
  new THREE.Vector3(12, 4 + TRACK_RAISE, 48),
  new THREE.Vector3(-5, TRACK_RAISE, 50),
  // ── North section (ground) ──
  new THREE.Vector3(-25, TRACK_RAISE, 42),
  new THREE.Vector3(-40, TRACK_RAISE, 30),
  new THREE.Vector3(-48, TRACK_RAISE, 10),
  // ── Underpass ──
  new THREE.Vector3(-50, TRACK_RAISE, -10),
  new THREE.Vector3(-45, TRACK_RAISE, -30),
  new THREE.Vector3(-30, TRACK_RAISE, -45),
];

const trackCurve = new THREE.CatmullRomCurve3(trackPts, true, 'catmullrom', 0.6);
const trackLen = trackCurve.getLength();
const SAMPLES = 800;
const trackPath = [];
const trackW = 10; // track width

for (let i = 0; i <= SAMPLES; i++) {
  trackPath.push(trackCurve.getPointAt(i / SAMPLES));
}

function tc(t) { return trackCurve.getPointAt(((t % 1) + 1) % 1); }
function ttan(t) { return trackCurve.getTangentAt(((t % 1) + 1) % 1).normalize(); }
function tnor(t) {
  const tg = ttan(t);
  return new THREE.Vector3().crossVectors(tg, new THREE.Vector3(0, 1, 0)).normalize();
}

// ── Ground ──
const grd = new THREE.Mesh(
  new THREE.PlaneGeometry(1000, 1000),
  new THREE.MeshStandardMaterial({ color: 0x3d7a2c, roughness: 0.92 })
);
grd.rotation.x = -Math.PI / 2;
grd.position.y = 0;
grd.receiveShadow = true;
scene.add(grd);

// ── Grass tufts ──
for (let i = 0; i < 300; i++) {
  const gx = (Math.random() - 0.5) * 160;
  const gz = (Math.random() - 0.5) * 160;
  let near = false;
  for (let j = 0; j < SAMPLES; j += 40) {
    if (Math.hypot(gx - trackPath[j].x, gz - trackPath[j].z) < trackW + 6) { near = true; break; }
  }
  if (near) continue;
  const h = 0.8 + Math.random() * 2.5;
  const g = new THREE.Mesh(
    new THREE.ConeGeometry(0.25, h, 5),
    new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(0.2 + Math.random() * 0.18, 0.65, 0.18 + Math.random() * 0.25), roughness: 0.85 })
  );
  g.position.set(gx, h / 2, gz);
  g.castShadow = true;
  scene.add(g);
}

// ── Track build ──
const trackGrp = new THREE.Group();
const hw = trackW / 2;

for (let i = 0; i < SAMPLES; i++) {
  const p = trackPath[i];
  const p2 = trackPath[(i + 1) % SAMPLES];
  const n = tnor(i / SAMPLES);
  const y0 = p.y; const y1 = p2.y;

  // ── Asphalt surface (entire track) ──
  const iL = p.clone().addScaledVector(n, -hw);
  const iR = p.clone().addScaledVector(n, hw);
  const iL2 = p2.clone().addScaledVector(n, -hw);
  const iR2 = p2.clone().addScaledVector(n, hw);

  const ag = new THREE.BufferGeometry();
  ag.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
    iL.x, y0 + 0.04, iL.z, iL2.x, y1 + 0.04, iL2.z, iR.x, y0 + 0.04, iR.z,
    iL2.x, y1 + 0.04, iL2.z, iR2.x, y1 + 0.04, iR2.z, iR.x, y0 + 0.04, iR.z,
  ]), 3));
  ag.computeVertexNormals();
  const am = new THREE.MeshStandardMaterial({ color: 0x666666, roughness: 0.65, metalness: 0.05 });
  const ams = new THREE.Mesh(ag, am);
  ams.receiveShadow = true;
  trackGrp.add(ams);

  // Racing line (lighter center strip)
  const rL = p.clone().addScaledVector(n, -1.5);
  const rR = p.clone().addScaledVector(n, 1.5);
  const rL2 = p2.clone().addScaledVector(n, -1.5);
  const rR2 = p2.clone().addScaledVector(n, 1.5);
  const rg = new THREE.BufferGeometry();
  rg.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
    rL.x, y0 + 0.045, rL.z, rL2.x, y1 + 0.045, rL2.z, rR.x, y0 + 0.045, rR.z,
    rL2.x, y1 + 0.045, rL2.z, rR2.x, y1 + 0.045, rR2.z, rR.x, y0 + 0.045, rR.z,
  ]), 3));
  rg.computeVertexNormals();
  const rm = new THREE.MeshStandardMaterial({ color: 0x7a7a7a, roughness: 0.58, metalness: 0.03 });
  const rms = new THREE.Mesh(rg, rm);
  rms.receiveShadow = true;
  trackGrp.add(rms);

  // Asphalt repair patches / seams
  if (i % 60 < 2) {
    const ejGeo = new THREE.BoxGeometry(trackW + 0.2, 0.005, 0.04);
    const ej = new THREE.Mesh(ejGeo, new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.9 }));
    ej.position.set(p.x, y0 + 0.06, p.z);
    ej.rotation.y = Math.atan2(n.x, n.z);
    ej.receiveShadow = true;
    trackGrp.add(ej);
  }

  // ── Curbs (red/white) ──
  for (let side = -1; side <= 1; side += 2) {
    const ci = p.clone().addScaledVector(n, side * (hw + 0.1));
    const co = p.clone().addScaledVector(n, side * (hw + 1.5));
    const ci2 = p2.clone().addScaledVector(n, side * (hw + 0.1));
    const co2 = p2.clone().addScaledVector(n, side * (hw + 1.5));

    const cg = new THREE.BufferGeometry();
    cg.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
      ci.x, y0 + 0.06, ci.z, ci2.x, y1 + 0.06, ci2.z, co.x, y0 + 0.06, co.z,
      ci2.x, y1 + 0.06, ci2.z, co2.x, y1 + 0.06, co2.z, co.x, y0 + 0.06, co.z,
    ]), 3));
    cg.computeVertexNormals();
    const cc = (Math.floor(i / 6) % 2 === 0) ? 0xdd1111 : 0xf0f0f0;
    const cm = new THREE.MeshStandardMaterial({ color: cc, roughness: 0.5, metalness: 0.1 });
    const cms = new THREE.Mesh(cg, cm);
    cms.receiveShadow = true;
    trackGrp.add(cms);
  }
}

// Start line
const sp = trackPath[0];
const sn = tnor(0);
const stGeo = new THREE.PlaneGeometry(trackW, 1.2);
const stMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4, side: THREE.DoubleSide });
const stMesh = new THREE.Mesh(stGeo, stMat);
stMesh.rotation.x = -Math.PI / 2;
stMesh.position.copy(sp); stMesh.position.y = sp.y + 0.055;
stMesh.receiveShadow = true;
trackGrp.add(stMesh);

// Checkered
for (let sc = -4; sc <= 4; sc++) {
  const scg = new THREE.PlaneGeometry(0.5, 0.5);
  const scc = Math.abs(sc) % 2 === 0 ? 0x111111 : 0xffffff;
  const scm = new THREE.MeshStandardMaterial({ color: scc, roughness: 0.4, side: THREE.DoubleSide });
  const scs = new THREE.Mesh(scg, scm);
  scs.rotation.x = -Math.PI / 2;
  scs.position.copy(sp.clone().addScaledVector(sn, sc * 0.5));
  scs.position.y = sp.y + 0.06;
  trackGrp.add(scs);
}

scene.add(trackGrp);

// ── Bridge supports (pillars under elevated sections) ──
for (let i = 0; i < SAMPLES; i += 10) {
  const p = trackPath[i];
  if (p.y > 1.5) {
    const n = tnor(i / SAMPLES);
    // Pilings on both sides
    for (let s = -1; s <= 1; s += 2) {
      const bx = p.x + n.x * s * (hw + 1);
      const bz = p.z + n.z * s * (hw + 1);
      const h = p.y + 0.05;
      const pillarGeo = new THREE.CylinderGeometry(0.5, 0.6, h, 8);
      const pillar = new THREE.Mesh(pillarGeo,
        new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.3, metalness: 0.7 }));
      pillar.position.set(bx, h / 2, bz);
      pillar.castShadow = true;
      pillar.receiveShadow = true;
      scene.add(pillar);

      // Cross beam between pilings
      if (s === -1) {
        const beamGeo = new THREE.BoxGeometry(hw * 2 + 2, 0.25, 0.5);
        const beam = new THREE.Mesh(beamGeo, new THREE.MeshStandardMaterial({ color: 0x777777, roughness: 0.25, metalness: 0.65 }));
        beam.position.set(p.x, h, p.z);
        beam.castShadow = true;
        scene.add(beam);
      }
    }
  }
}

// ── Barriers (tyre walls + armco) ──
const barrierGrp = new THREE.Group();
for (let i = 0; i < SAMPLES; i += 3) {
  const p = trackPath[i];
  const n = tnor(i / SAMPLES);
  for (let s = -1; s <= 1; s += 2) {
    const bp = p.clone().addScaledVector(n, s * (hw + 2.8));
    bp.y = p.y + 0.6;
    const bg = new THREE.BoxGeometry(0.35, 1.3, 0.6);
    const bm = new THREE.MeshStandardMaterial({ color: s === -1 ? 0xff4444 : 0xff6644, roughness: 0.4, metalness: 0.25 });
    const bb = new THREE.Mesh(bg, bm);
    bb.position.copy(bp);
    bb.castShadow = true; bb.receiveShadow = true;
    barrierGrp.add(bb);
  }
}
scene.add(barrierGrp);

// ── Trees ──
for (let i = 0; i < 100; i++) {
  let tx, tz;
  do {
    tx = (Math.random() - 0.5) * 180;
    tz = (Math.random() - 0.5) * 180;
  } while (trackPath.some(p => Math.hypot(tx - p.x, tz - p.z) < trackW + 8));

  const th = 3 + Math.random() * 7;
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.25, 0.4, th, 7),
    new THREE.MeshStandardMaterial({ color: 0x7a5c3e, roughness: 0.9 })
  );
  trunk.position.set(tx, th / 2, tz);
  trunk.castShadow = true; trunk.receiveShadow = true;
  scene.add(trunk);

  // Multiple layers of foliage
  for (let l = 0; l < 3; l++) {
    const lf = new THREE.Mesh(
      new THREE.ConeGeometry(1.8 - l * 0.4, 2.5 - l * 0.5, 8),
      new THREE.MeshStandardMaterial({
        color: new THREE.Color().setHSL(0.18 + Math.random() * 0.2, 0.55, 0.12 + Math.random() * 0.2 + l * 0.04),
        roughness: 0.85
      })
    );
    lf.position.set(tx, th + 0.3 + l * 1.5, tz);
    lf.castShadow = true;
    scene.add(lf);
  }
}

// ── Grandstand (start/finish) ──
const gsGrp = new THREE.Group();
const gsBase = new THREE.Mesh(
  new THREE.BoxGeometry(25, 0.5, 5),
  new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.6 })
);
gsBase.position.set(0, 0.25, -trackPath[0].z + hw + 8);
gsBase.receiveShadow = true; gsBase.castShadow = true;
gsGrp.add(gsBase);

for (let r = 0; r < 5; r++) {
  const seatRow = new THREE.Mesh(
    new THREE.BoxGeometry(24, 0.6, 0.8),
    new THREE.MeshStandardMaterial({ color: [0xff3333, 0x3366ff, 0xffcc00, 0x33cc33, 0xff8800][r], roughness: 0.5 })
  );
  seatRow.position.set(0, 0.8 + r * 0.9, -trackPath[0].z + hw + 8);
  seatRow.castShadow = true; seatRow.receiveShadow = true;
  gsGrp.add(seatRow);
}
scene.add(gsGrp);

// ════════════════════════════════════════════════════
//  Mercedes W12 — Full Aero Body (dual-profile extrusion)
// ════════════════════════════════════════════════════
const car = new THREE.Group();

// Materials
const silverMat = new THREE.MeshStandardMaterial({ color: 0xC0C5CE, roughness: 0.08, metalness: 0.92 });
const petronasMat = new THREE.MeshStandardMaterial({ color: 0x00A19B, roughness: 0.08, metalness: 0.76 });
const carbonMat = new THREE.MeshStandardMaterial({ color: 0x1A1A1A, roughness: 0.12, metalness: 0.72 });
const blackMat = new THREE.MeshStandardMaterial({ color: 0x0D0D0D, roughness: 0.06, metalness: 0.56 });

// ── Dual-profile aero body ──
// Plan: how wide at each Z (top-down view)
// Side: height + center-Y at each Z (side view)
// Result: elliptical cross-sections sculpted in both dimensions
function createAeroBody() {
  const slices = [
    // z, planW, sideH, centerY
    [-2.30, 0.52, 0.18, 0.22],
    [-2.05, 0.56, 0.20, 0.24],
    [-1.75, 0.58, 0.22, 0.26],
    [-1.45, 0.50, 0.23, 0.28],  // coke bottle
    [-1.20, 0.42, 0.25, 0.30],
    [-0.90, 0.44, 0.27, 0.33],
    [-0.60, 0.58, 0.30, 0.36],
    [-0.30, 0.72, 0.33, 0.39],
    [ 0.00, 0.80, 0.35, 0.42],  // cockpit widest
    [ 0.30, 0.78, 0.34, 0.41],
    [ 0.60, 0.72, 0.32, 0.38],
    [ 0.90, 0.60, 0.28, 0.35],
    [ 1.20, 0.46, 0.24, 0.31],
    [ 1.50, 0.32, 0.19, 0.27],
    [ 1.80, 0.20, 0.13, 0.22],
    [ 2.10, 0.10, 0.07, 0.17],
    [ 2.30, 0.04, 0.04, 0.13],  // nose tip
  ];

  const RINGS = 18;
  const segs = slices.length - 1;
  // Shift all Z so center is at 0
  const zMid = (slices[0][0] + slices[slices.length-1][0]) / 2;
  const verts = [], uvs = [], idx = [];

  for (let i = 0; i < slices.length; i++) {
    const [z, planW, sideH, cY] = slices[i];
    const z0 = z - zMid;
    const rx = planW / 2;
    const ry = sideH / 2;
    for (let j = 0; j < RINGS; j++) {
      const a = (j / RINGS) * Math.PI * 2;
      verts.push(Math.cos(a) * rx, Math.sin(a) * ry + cY, z0);
      uvs.push(j / RINGS, i / segs);
    }
  }

  for (let i = 0; i < segs; i++) {
    for (let j = 0; j < RINGS; j++) {
      const a = i * RINGS + j;
      const b = a + RINGS;
      const n = (j + 1) % RINGS;
      const d = i * RINGS + n;
      const e = b + (n - j);
      idx.push(a, e, b);
      idx.push(a, d, e);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(uvs), 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return geo;
}

const WR = 0.36, WW = 0.34;
function mkWhl(x, z) {
  const g = new THREE.Group();
  const ti = new THREE.Mesh(new THREE.CylinderGeometry(WR, WR, WW, 24),
    new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.78, metalness: 0.02 }));
  ti.rotation.z = Math.PI / 2; ti.castShadow = true;
  g.add(ti);
  const fair = new THREE.Mesh(new THREE.CylinderGeometry(WR - 0.015, WR - 0.015, WW + 0.04, 18), carbonMat);
  fair.rotation.z = Math.PI / 2;
  g.add(fair);
  const ri = new THREE.Mesh(new THREE.CylinderGeometry(WR * 0.58, WR * 0.58, WW + 0.06, 10),
    new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.18, metalness: 0.92 }));
  ri.rotation.z = Math.PI / 2;
  g.add(ri);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.042, WW + 0.08, 8),
    new THREE.MeshStandardMaterial({ color: 0x00A19B, roughness: 0.2, metalness: 0.52, emissive: 0x00A19B, emissiveIntensity: 0.22 }));
  hub.rotation.z = Math.PI / 2;
  g.add(hub);
  const glow = new THREE.Mesh(new THREE.TorusGeometry(WR * 0.53, 0.028, 8, 12),
    new THREE.MeshBasicMaterial({ color: 0x330000, transparent: true, opacity: 0 }));
  glow.userData.isBrakeGlow = true;
  g.add(glow);
  g.position.set(x, WR, z);
  return g;
}

function mkGhostCar(color) {
  const clone = car.clone(true); // deep clone entire car
  clone.castShadow = true;
  // Tint all meshes with player color (blend 30% player color into original)
  clone.traverse(child => {
    if (child.isMesh && child.material.color && !child.material.emissive) {
      const orig = child.material.color.clone();
      const tint = new THREE.Color(color);
      child.material = child.material.clone();
      child.material.color.copy(orig).lerp(tint, 0.35);
    }
  });
  return clone;
}

async function multiFetch() {
  try {
    const res = await fetch(`/api/race/players?me=${encodeURIComponent(username)}`);
    const data = await res.json();
    document.getElementById("online-num").textContent = Object.keys(data).length + 1;

    // Track current usernames
    const currentNames = new Set(Object.keys(data));

    // Remove players who left
    for (const name in otherPlayers) {
      if (!currentNames.has(name)) {
        scene.remove(otherPlayers[name].car);
        otherPlayers[name].label.parentNode?.removeChild(otherPlayers[name].label);
        delete otherPlayers[name];

    }

    // Add/update players

        lbl.className = "other-tag";

        lbl.style.color = info.color;
        document.body.appendChild(lbl);
        otherPlayers[name] = { car: ghost, label: lbl };

      const p = otherPlayers[name];
      p.car.position.set(info.x, info.y, info.z);
      p.car.rotation.y = info.heading;

      // Project label to screen
      const pos3D = new THREE.Vector3(info.x, info.y + 2.0, info.z);

// Find closest point on track to car, returns {t, dist, point}
let carTrackT = 0; // car's current parameter on the track curve
function closestTrack() {
  let bestT = carTrackT, bestDist = Infinity;
  // Local search around current position
  const searchRadius = 0.15; // search ±15% of track around current position
  const searchStart = Math.floor((carTrackT - searchRadius) * SAMPLES);
  const searchEnd = Math.ceil((carTrackT + searchRadius) * SAMPLES);
  for (let i = searchStart; i <= searchEnd; i++) {
    const idx = ((i % SAMPLES) + SAMPLES) % SAMPLES;
    const pt = trackPath[idx];
    const d = Math.hypot(carPosX - pt.x, carPosZ - pt.z);
    if (d < bestDist) { bestDist = d; bestT = idx / SAMPLES; }
  }
  // Refine locally
  for (let r = 0; r < 3; r++) {
    const dT = 0.0005;
    const p0 = tc(bestT - dT), p1 = tc(bestT), p2 = tc(bestT + dT);
    const d0 = Math.hypot(carPosX - p0.x, carPosZ - p0.z);
    const d1 = Math.hypot(carPosX - p1.x, carPosZ - p1.z);
    const d2 = Math.hypot(carPosX - p2.x, carPosZ - p2.z);
    if (d0 < d1 && d0 < d2) { bestT -= dT; bestDist = d0; }
    else if (d2 < d1 && d2 < d0) { bestT += dT; bestDist = d2; }
    else { bestDist = d1; break; }
  }
  bestT = ((bestT % 1) + 1) % 1;
  carTrackT = bestT;
  return { t: bestT, dist: bestDist, point: tc(bestT) };
}

// Simple lap detection: crossing start line
let lastT = 0;
function checkLap() {
  const { t } = closestTrack();
  if (lastT > 0.9 && t < 0.1 && speed > 1) {
    lapCount++; newLap();
  }
  lastT = t;
}

function newLap() {
  const lapTime = totalTime - lapStartTime;
  if (lapTime > 1 && lapTime < bestLap && lapCount > 0) {
    bestLap = lapTime;
  }
  // Submit to server
  if (username && lapTime > 1) {
    fetch("/api/race/lap", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, lapTime, speed })
    }).then(() => loadLeaderboard()).catch(() => {});
  }
  lapStartTime = totalTime;
  const el = document.getElementById('lap-timer');
  el.style.opacity = '1';
  const m = Math.floor(lapTime / 60);
  const s = Math.floor(lapTime % 60);
  const t = Math.floor((lapTime % 1) * 10);
  el.textContent = `LAP ${lapCount} — ${m}:${s.toString().padStart(2, '0')}.${t}` + (bestLap === lapTime ? ' BEST!' : '');
  setTimeout(() => el.style.opacity = '0', 2000);
}

let audioCtx, engineOsc, engineGain, soundStarted = false;

function initSound() {
  if (soundStarted) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    engineOsc = audioCtx.createOscillator();
    engineGain = audioCtx.createGain();
    const lpf = audioCtx.createBiquadFilter();
    lpf.type = 'lowpass';
    lpf.frequency.value = 400;
    lpf.Q.value = 3;
    engineOsc.type = 'sawtooth';
    engineOsc.frequency.value = 40;
    engineGain.gain.value = 0.03;
    engineOsc.connect(lpf);
    lpf.connect(engineGain);
    engineGain.connect(audioCtx.destination);
    engineOsc.start();
    soundStarted = true;
  } catch(e) {}
}

// ── Mini-map ──
const mmCanvas = document.getElementById('minimapCanvas');
const mmCtx = mmCanvas.getContext('2d');

function drawMinimap() {
  mmCtx.clearRect(0, 0, 140, 140);
  const cx = 70, cy = 70, scale = 1.3;
  mmCtx.strokeStyle = '#555';
  mmCtx.lineWidth = 4;
  mmCtx.beginPath();
  for (let i = 0; i <= SAMPLES; i += 2) {
    const pt = trackPath[i];
    const sx = cx + pt.x * scale, sy = cy + pt.z * scale;
    if (i === 0) mmCtx.moveTo(sx, sy);
    else mmCtx.lineTo(sx, sy);
  }
  mmCtx.closePath();
  mmCtx.stroke();
  mmCtx.fillStyle = '#ff0000';
  mmCtx.beginPath();
  mmCtx.arc(cx + carPosX * scale, cy + carPosZ * scale, 3, 0, Math.PI * 2);
  mmCtx.fill();
  mmCtx.strokeStyle = '#fff';
  mmCtx.lineWidth = 1;
  mmCtx.stroke();
}

// ── Update ──
function updateCar(dt) {
  if (dt <= 0) return;
  const acc = keys['KeyW'] || keys['ArrowUp'] ? 1 : 0;
  const brk = keys['KeyS'] || keys['ArrowDown'] ? 1 : 0;
  const hbk = keys['Space'] ? 1 : 0;
  let strIn = 0;
  if (keys['KeyA'] || keys['ArrowLeft']) strIn = 1;
  if (keys['KeyD'] || keys['ArrowRight']) strIn = -1;

  initSound();

  // ── Forward speed ──
  let force = acc * ACCEL - brk * BRAKE - FRIC * Math.sign(speed);
  // Air drag (quadratic) — reduced when DRS open
  const effDrag = (drsOpen && Math.abs(speed) > 13.9) ? DRAG_DRS : DRAG;
  force -= effDrag * speed * Math.abs(speed);
  // Extra surface friction
  const { dist } = closestTrack();
  onTrack = dist < hw - 0.3;
  if (!onTrack) {
    force -= 12 * Math.sign(speed);
    if (Math.abs(speed) < 3 && !acc && !brk) speed = 0;
  }

  speed += force * dt;
  if (!acc && !brk && Math.abs(speed) < 0.3) speed = 0;
  speed = Math.max(-8, Math.min(MAX_SPD, speed));

  // ── Steering (turn the car's heading) ──
  const turnSpd = TURN_RATE_FAST + (TURN_RATE - TURN_RATE_FAST) * Math.max(0, 1 - Math.abs(speed) / MAX_SPD);
  if (strIn !== 0 && Math.abs(speed) > 0.1) {
    heading += strIn * turnSpd * dt;
  }
  steerAngle += (strIn * 0.4 - steerAngle) * Math.min(1, dt * 10);
  // Handbrake: rapid rotation
  if (hbk && Math.abs(speed) > 8) {
    heading += strIn * 3.5 * dt;
    speed -= BRAKE * 1.2 * dt;
  }

  // ── Move car in world space (with barrier slide) ──
  const moveX = Math.sin(heading) * speed * dt;
  const moveZ = Math.cos(heading) * speed * dt;

  const carHalfW = 0.8;
  const barrierDist = hw + 2.8 - carHalfW;
  const { point: cp, dist: cDist } = closestTrack();

  if (cDist >= barrierDist - 0.2) {
    // At or near barrier — only allow sliding along it
    const toCar = new THREE.Vector2(carPosX - cp.x, carPosZ - cp.z).normalize();
    const moveVec = new THREE.Vector2(moveX, moveZ);
    const towardBarrier = moveVec.dot(toCar);
    if (towardBarrier > 0) {
      // Push away from barrier direction
      const tangent = new THREE.Vector2(-toCar.y, toCar.x);
      const slideAmount = moveVec.dot(tangent);
      carPosX += tangent.x * slideAmount;
      carPosZ += tangent.y * slideAmount;
      spawnSpark();
    } else {
      carPosX += moveX;
      carPosZ += moveZ;
    }
  } else {
    carPosX += moveX;
    carPosZ += moveZ;
  }

  // ── Update car transform ──
  const { point: nearestPt } = closestTrack();
  car.position.set(carPosX, nearestPt.y, carPosZ);
  car.rotation.y = heading;

  // ── DRS flap animation ──
  if (drsFlapGroup) {
    const closedAngle = 0.2;
    const openAngle = -0.08; // flap flattens — trailing edge drops, reducing drag
    const current = drsFlapGroup.rotation.x;
    const target = drsOpen ? openAngle : closedAngle;
    drsFlapGroup.rotation.x += (target - current) * Math.min(1, dt * 8);
    // Auto-close DRS when braking or speed < 50 km/h
    if (drsOpen && (keys['KeyS'] || keys['ArrowDown'] || Math.abs(speed) < 13.9)) {
      drsOpen = false;
      drsTarget = 0;
    }
  }

  // ── Lap detection ──
  checkLap();
  totalTime += dt;

  // ── RPM / Gear / Sound ──
  const rpm = Math.abs(speed) / MAX_SPD * 13;
  document.getElementById('rpmVal').textContent = Math.round(rpm);
  updateGearLEDs(rpm);
  if (Math.abs(speed) < 0.3) gear = 0;
  else if (speed < 0) gear = -1;
  else gear = Math.min(8, Math.floor(rpm * 0.75) + 1);

  // DRS indicator
  const drsEl = document.getElementById('drs-indicator');
  if (drsEl) {
    drsEl.style.opacity = drsOpen ? '1' : '0';
    drsEl.style.color = drsOpen ? '#00ff00' : '#0a0';
    drsEl.style.borderColor = drsOpen ? '#00ff00' : '#0a0';
    drsEl.style.boxShadow = drsOpen ? '0 0 8px #00ff00' : 'none';
  }

  if (engineOsc && engineGain) {
    const freq = 40 + rpm * 16;
    engineOsc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.05);
    engineGain.gain.setTargetAtTime(0.02 + rpm / 15 * 0.07, audioCtx.currentTime, 0.05);
  }

  // ── Visual effects ──
  if (Math.abs(speed) > 15 && Math.random() < 0.3) spawnExhaust();
  if (brk && Math.abs(speed) > 18 && Math.random() < 0.5) spawnTireSmoke();
  if (hbk && Math.abs(speed) > 10) spawnTireSmoke();
  if (!onTrack && Math.abs(speed) > 18) { if (Math.random() < 0.5) spawnDust(); }
  if (Math.abs(dist - hw) < 1.2 && Math.abs(speed) > 25 && Math.random() < 0.2) spawnSpark();

  // Brake glow
  const wheels = [wFL, wFR, wRL, wRR];
  wheels.forEach(w => {
    w.children.forEach(ch => {
      if (ch.userData.isBrakeGlow) {
        const glowAmount = (brk || hbk) && Math.abs(speed) > 15 ? Math.min(1, Math.abs(speed) / 60) : 0;
        ch.material.opacity = glowAmount * 0.85;
        ch.material.color.setHex(glowAmount > 0.5 ? 0xff4400 : 0x661100);
      }
    });
  });

  // ── HUD ──
  document.getElementById('speedVal').textContent = Math.round(Math.abs(speed) * 3.6);
  document.getElementById('lapVal').textContent = lapCount;
  const mins = Math.floor(totalTime / 60);
  const secs = Math.floor(totalTime % 60);
  const t10 = Math.floor((totalTime % 1) * 10);
  document.getElementById('timeVal').textContent = `${mins}:${secs.toString().padStart(2, '0')}.${t10}`;
  if (bestLap !== Infinity) {
    const bm = Math.floor(bestLap / 60), bs = Math.floor(bestLap % 60), bt = Math.floor((bestLap % 1) * 10);
    document.getElementById('bestVal').textContent = `${bm}:${bs.toString().padStart(2, '0')}.${bt}`;
  }
}

// ── Camera modes ──
let camMode = 0; // 0=chase, 1=overhead, 2=cinematic, 3=cockpit
let shakeAmount = 0;

document.addEventListener('keydown', e => {
  if (e.code === 'KeyC') {
    camMode = (camMode + 1) % 4;
  }
});

function animate() {
  const dt = Math.min(0.05, clock.getDelta());
  updateCar(dt);

  // Multiplayer: send position & fetch others
  const now = performance.now();
  if (now - lastSend > SEND_INTERVAL) { lastSend = now; multiSend(); }
  if (now - lastFetch > FETCH_INTERVAL) { lastFetch = now; multiFetch(); }

  const carDir = new THREE.Vector3(Math.sin(car.rotation.y), 0, Math.cos(car.rotation.y));

  // Camera follow based on mode
  let targetPos, targetLook;
  const carY = car.position.y;
  if (camMode === 0) {
    // Chase cam
    targetPos = car.position.clone().addScaledVector(carDir, -6);
    targetPos.y = carY + 3.8 + Math.abs(speed) * 0.04;
    targetLook = car.position.clone().addScaledVector(carDir, 5 + speed * 0.25);
    targetLook.y = carY + 1.5;
  } else if (camMode === 1) {
    // Overhead
    targetPos = car.position.clone();
    targetPos.y = carY + 20;
    targetLook = car.position.clone();
    targetLook.y = carY;
  } else if (camMode === 2) {
    // Cinematic - side orbiting
    const orbitAngle = totalTime * 0.3;
    const orbitR = 10;
    targetPos = car.position.clone().add(new THREE.Vector3(Math.cos(orbitAngle) * orbitR, 4, Math.sin(orbitAngle) * orbitR));
    targetLook = car.position.clone();
    targetLook.y = carY + 1;
  } else {
    // Cockpit
    targetPos = car.position.clone().addScaledVector(carDir, 0.3);
    targetPos.y = carY + 0.6;
    targetLook = car.position.clone().addScaledVector(carDir, 10);
    targetLook.y = carY + 0.5;
  }

  // Camera shake based on speed and surface
  shakeAmount += ((Math.abs(speed) > 20 ? 0.03 : 0.01) - shakeAmount) * 8 * dt;

  if (camMode === 3) {
    camera.position.copy(targetPos);
  } else {
    camera.position.lerp(targetPos, 4 * dt);
  }

  // Apply shake (skip in cockpit)
  if (camMode !== 3) {
    const sx = (Math.random() - 0.5) * shakeAmount;
    const sy = (Math.random() - 0.5) * shakeAmount;
    camera.position.x += sx;
    camera.position.y += sy;
  }

  // Smooth look
  const cl = new THREE.Vector3();
  camera.getWorldDirection(cl);
  const tl = targetLook.clone().sub(camera.position).normalize();
  const sl = cl.clone().lerp(tl, 6 * dt);
  camera.lookAt(camera.position.clone().add(sl));

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.userData.life -= dt * 2.5;
    p.material.opacity = Math.max(0, p.userData.life * 0.5);
    p.scale.setScalar(1 + (1 - p.userData.life) * 2);
    if (p.userData.v) {
      p.position.x += p.userData.v.x * dt;
      p.position.y += p.userData.v.y * dt;
      p.position.z += p.userData.v.z * dt;
      p.userData.v.y -= 9.8 * dt;
    }
    if (p.userData.life <= 0) {
      scene.remove(p); p.geometry.dispose(); p.material.dispose();
      particles.splice(i, 1);
    }
  }

  // Wheel spin
  const ws = speed * dt * 2.8;
  [wFL, wFR, wRL, wRR].forEach(w => w.children[0].rotation.x += ws);

  // Front wheel steering
  wFL.rotation.y = steerAngle;
  wFR.rotation.y = steerAngle;

  // G-force (based on steering/speed)
  const a = keys['KeyA'] || keys['ArrowLeft'] ? 1 : (keys['KeyD'] || keys['ArrowRight'] ? -1 : 0);
  const gx = a * Math.min(1, Math.abs(speed) / 15);
  const gy = (speed > 0 ? -1 : 1) * Math.min(1, Math.abs(speed) / MAX_SPD) * 0.7;
  const gd = document.getElementById('g-dot');
  gd.style.left = (50 + Math.max(-42, Math.min(42, gx * 35))) + '%';
  gd.style.top = (50 + Math.max(-42, Math.min(42, gy * 42))) + '%';

  // Minimap
  if (Math.floor(Date.now() / 200) % 2 === 0) drawMinimap();

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

// Start clock
const clock = new THREE.Clock();

// Resize handler
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Game starts after login
document.getElementById("status-msg").textContent = "READY - " + trackPath.length + " track pts, enter username";
} // end runGame
</script>
</body>
