<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>PONG</h1>
    <div class="scoreboard">
        <div>Player: <span id="playerScore">0</span></div>
        <div id="diffDisplay" style="font-size:14px;color:#FFD700;"></div>
        <div>CPU: <span id="cpuScore">0</span></div>
    </div>
    <div id="powerStatus" class="power-status"></div>
    <canvas id="canvas"></canvas>
    <p class="controls">W / S to move | First to 7 wins | Refresh to restart</p>
    <script src="script.js"></script>
</body>
</html>
