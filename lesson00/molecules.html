<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Molecular Structures</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #0d1117;
        }
        /* ============ 顶部导航栏 ============ */
        #topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: rgba(13, 17, 23, 0.92);
            border-bottom: 1px solid rgba(0, 217, 255, 0.12);
            z-index: 200;
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 16px;
        }
        #topbar .logo {
            font-size: 1.3em;
            font-weight: 700;
            background: linear-gradient(135deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #topbar .logo-icon { font-size: 1.4em; }
        #topbar .topbar-divider {
            width: 1px;
            height: 24px;
            background: rgba(255, 255, 255, 0.12);
        }
        #topbar .molecule-count {
            color: #8899aa;
            font-size: 0.85em;
            font-weight: 500;
        }
        #topbar .molecule-count span {
            color: #00d9ff;
            font-weight: 700;
        }
        
        #container { width: 100vw; height: 100vh; position: relative; z-index: 1; }
        
        /* ============ 侧边栏 ============ */
        #sidebar {
            position: fixed;
            top: 56px;
            left: 0;
            width: 310px;
            height: calc(100vh - 56px);
            background: rgba(13, 17, 23, 0.9);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 100;
            padding: 0;
        }
        .search-wrapper {
            position: sticky;
            top: 0;
            padding: 14px;
            background: rgba(13, 17, 23, 0.95);
            z-index: 10;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .search-input {
            width: 100%;
            padding: 9px 12px 9px 34px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
            color: #d0d4dc;
            font-size: 0.88em;
            font-family: inherit;
            outline: none;
            transition: all 0.3s;
        }
        .search-input::placeholder { color: rgba(255, 255, 255, 0.25); }
        .search-input:focus {
            border-color: #00d9ff;
            background: rgba(0, 217, 255, 0.06);
        }
        .search-icon {
            position: absolute;
            left: 26px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.8em;
            pointer-events: none;
        }
        
        /* ============ 可折叠分类 ============ */
        .cat-section { margin-bottom: 4px; }
        .cat-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            cursor: pointer;
            user-select: none;
            color: rgba(0, 217, 255, 0.7);
            font-size: 0.73em;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            transition: all 0.2s;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .cat-toggle:hover { color: #00d9ff; background: rgba(0, 217, 255, 0.04); }
        .cat-toggle .arrow {
            display: inline-block;
            transition: transform 0.25s;
            font-size: 0.7em;
        }
        .cat-toggle .count {
            font-weight: 400;
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0;
        }
        .cat-section.open .cat-toggle .arrow { transform: rotate(90deg); }
        .cat-body { overflow: hidden; max-height: 0; transition: max-height 0.35s ease; }
        .cat-section.open .cat-body { max-height: 2000px; }
        .cat-body-inner { padding: 4px 12px 12px; }
        
        /* 分子列表 */
        .mol-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            margin: 2px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: #bcc8d4;
            border: 1px solid transparent;
        }
        .mol-item:hover {
            background: rgba(0, 217, 255, 0.06);
            border-color: rgba(0, 217, 255, 0.15);
            color: #fff;
        }
        .mol-item.active {
            background: rgba(0, 217, 255, 0.1);
            border-color: rgba(0, 217, 255, 0.35);
            color: #fff;
        }
        .mol-item .mol-formula {
            color: #00d9ff;
            font-weight: 700;
            font-size: 0.88em;
            font-family: 'Courier New', monospace;
            white-space: nowrap;
            min-width: 40px;
        }
        .mol-item .mol-name {
            font-size: 0.84em;
            font-weight: 500;
            color: #a0a8b4;
        }
        .mol-item.active .mol-name { color: #d0d8e4; }
        
        /* ============ 信息面板 ============ */
        #info-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(13, 17, 23, 0.9);
            border-radius: 12px;
            color: #fff;
            max-width: 360px;
            z-index: 100;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }
        #info-panel .panel-header {
            padding: 18px 20px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        #info-panel h3 {
            color: #fff;
            font-size: 1.05em;
            font-weight: 700;
            margin-bottom: 10px;
        }
        #info-panel .tags-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        #info-panel .formula-tag {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            background: rgba(0, 217, 255, 0.12);
            color: #00d9ff;
            font-size: 0.78em;
            font-weight: 600;
        }
        #info-panel .stat-tag {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.05);
            color: #788898;
            font-size: 0.72em;
            font-weight: 500;
        }
        #info-panel .panel-body {
            padding: 14px 20px 18px;
        }
        #info-panel p {
            color: #8898a8;
            line-height: 1.75;
            font-size: 0.85em;
        }
        
        /* ============ 滚动条 ============ */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 217, 255, 0.2);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 217, 255, 0.4); }
        
        /* ============ 分子切换动画 ============ */
        @keyframes moleculeEnter {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }
        .molecule-entering {
            animation: moleculeEnter 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        
        /* ============ 响应式 ============ */
        @media (max-width: 768px) {
            #sidebar { width: 260px; }
            #info-panel { max-width: 280px; right: 10px; bottom: 10px; }
        }
    </style>
</head>

        // 创建DNA 3D示意图
        function createDNADiagram() {
            const numLevels = 12;
            const heightStep = 2.5;
            const radius = 4;
            const angleStep = (36 * Math.PI) / 180; // 36度每层
            
            const basePairs = [
                { left: 'A', right: 'T', leftColor: 0x4488ff, rightColor: 0xff4444 },
                { left: 'C', right: 'G', leftColor: 0xff8844, rightColor: 0x44cc44 },
                { left: 'T', right: 'A', leftColor: 0xff4444, rightColor: 0x4488ff },
                { left: 'G', right: 'C', leftColor: 0x44cc44, rightColor: 0xff8844 },
                { left: 'A', right: 'T', leftColor: 0x4488ff, rightColor: 0xff4444 },
                { left: 'C', right: 'G', leftColor: 0xff8844, rightColor: 0x44cc44 },
                { left: 'G', right: 'C', leftColor: 0x44cc44, rightColor: 0xff8844 },
                { left: 'T', right: 'A', leftColor: 0xff4444, rightColor: 0x4488ff },
                { left: 'A', right: 'T', leftColor: 0x4488ff, rightColor: 0xff4444 },
                { left: 'C', right: 'G', leftColor: 0xff8844, rightColor: 0x44cc44 },
                { left: 'G', right: 'C', leftColor: 0x44cc44, rightColor: 0xff8844 },
                { left: 'T', right: 'A', leftColor: 0xff4444, rightColor: 0x4488ff }
            ];

            // 链的颜色
            const chain1Color = 0xff2288; // 粉红色
            const chain2Color = 0x22aaff; // 蓝色
            
            // 存储每层的链位置，用于创建连续的螺旋带
            let chain1Positions = [];
            let chain2Positions = [];

            // 创建碱基对横杠和连接件
            for (let i = 0; i < numLevels; i++) {
                const y = i * heightStep - (numLevels * heightStep) / 2;
                const angle = i * angleStep;
                
                const x1 = Math.cos(angle) * radius;
                const z1 = Math.sin(angle) * radius;
                const x2 = Math.cos(angle + Math.PI) * radius;
                const z2 = Math.sin(angle + Math.PI) * radius;
                
                chain1Positions.push(new THREE.Vector3(x1, y, z1));
                chain2Positions.push(new THREE.Vector3(x2, y, z2));
                
                // 创建碱基对横杠（长条形状）
                const barLength = radius * 2;
                const barGeometry = new THREE.BoxGeometry(barLength, 0.6, 0.3);
                const barMaterial = new THREE.MeshPhongMaterial({
                    color: basePairs[i].leftColor,
                    emissive: basePairs[i].leftColor,
                    emissiveIntensity: 0.2
                });
                
                // 左半部分
                const leftBarGeo = new THREE.BoxGeometry(radius, 0.6, 0.3);
                const leftBarMat = new THREE.MeshPhongMaterial({
                    color: basePairs[i].leftColor,
                    emissive: basePairs[i].leftColor,
                    emissiveIntensity: 0.3
                });
                const leftBar = new THREE.Mesh(leftBarGeo, leftBarMat);
                leftBar.position.set(x1 / 2, y, z1 / 2);
                leftBar.lookAt(new THREE.Vector3(0, y, 0));
                leftBar.rotateY(Math.PI / 2);
                moleculeGroup.add(leftBar);
                
                // 右半部分
                const rightBarGeo = new THREE.BoxGeometry(radius, 0.6, 0.3);
                const rightBarMat = new THREE.MeshPhongMaterial({
                    color: basePairs[i].rightColor,
                    emissive: basePairs[i].rightColor,
                    emissiveIntensity: 0.3
                });
                const rightBar = new THREE.Mesh(rightBarGeo, rightBarMat);
                rightBar.position.set(x2 / 2, y, z2 / 2);
                rightBar.lookAt(new THREE.Vector3(0, y, 0));
                rightBar.rotateY(Math.PI / 2);
                moleculeGroup.add(rightBar);
                
                // 中间连接件（白色小圆柱）
                const connectorGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.8, 16);
                const connectorMat = new THREE.MeshPhongMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.2 });
                const connector = new THREE.Mesh(connectorGeo, connectorMat);
                connector.position.set(0, y, 0);
                connector.lookAt(new THREE.Vector3(x1, y, z1));
                connector.rotateX(Math.PI / 2);
                moleculeGroup.add(connector);
                
                // 添加文字标签
                addTextLabel(basePairs[i].left, new THREE.Vector3(x1 * 0.5, y, z1 * 0.5));
                addTextLabel(basePairs[i].right, new THREE.Vector3(x2 * 0.5, y, z2 * 0.5));
            }
            
            // 创建螺旋链（使用管状几何体连接所有点）
            function createHelixChain(positions, color) {
                // 采样更多点使曲线更平滑
                const smoothPositions = [];
                for (let i = 0; i < positions.length - 1; i++) {
                    const start = positions[i];
                    const end = positions[i + 1];
                    const segments = 10;
                    for (let j = 0; j < segments; j++) {
                        const t = j / segments;
                        smoothPositions.push(new THREE.Vector3(
                            start.x + (end.x - start.x) * t,
                            start.y + (end.y - start.y) * t,
                            start.z + (end.z - start.z) * t
                        ));
                    }
                }
                smoothPositions.push(positions[positions.length - 1]);
                
                const curve = new THREE.CatmullRomCurve3(smoothPositions);
                const tubeGeometry = new THREE.TubeGeometry(curve, 100, 0.25, 16, false);
                const tubeMaterial = new THREE.MeshPhongMaterial({
                    color: color,
                    emissive: color,
                    emissiveIntensity: 0.3
                });
                const tube = new THREE.Mesh(tubeGeometry, tubeMaterial);
                moleculeGroup.add(tube);
            }
            
            createHelixChain(chain1Positions, chain1Color);
            createHelixChain(chain2Positions, chain2Color);
        }

        // 添加文字标签
        function addTextLabel(text, position) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 128;
            canvas.height = 64;

            // 背景
            context.fillStyle = 'rgba(0, 0, 0, 0.5)';
            context.roundRect(0, 0, 128, 64, 10);
            context.fill();

            // 文字
            context.fillStyle = 'white';
            context.font = 'bold 36px Arial';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText(text, 64, 32);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                opacity: 0.95
            });

            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.position.copy(position);
            sprite.position.y += 0.5;
            sprite.scale.set(1.5, 0.75, 0.75);
            moleculeGroup.add(sprite);
        }

        function addParticles() {
            // 创建圆形纹理
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.3, 'rgba(255,255,255,0.8)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 32, 32);
            const circleTexture = new THREE.CanvasTexture(canvas);

            const particlesGeometry = new THREE.BufferGeometry();
            const particlesCount = 800;
            const positions = new Float32Array(particlesCount * 3);
            for (let i = 0; i < particlesCount * 3; i++) {
                positions[i] = (Math.random() - 0.5) * 100;
            }
            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const particlesMaterial = new THREE.PointsMaterial({
                map: circleTexture,
                color: 0xddeeff,
                size: 0.16,
                transparent: true,
                opacity: 0.65,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
            particlesMesh.name = 'stars';
            scene.add(particlesMesh);
        }

        function createUI() {
            const list = document.getElementById('molecule-list');
            list.innerHTML = '';
            
            const categories = [
                { name: 'Simple Molecules', start: 0, end: 15 },
                { name: 'Organic Compounds', start: 15, end: 38 },
                { name: 'Inorganic Compounds', start: 38, end: 44 },
                { name: 'Special Structures', start: 44, end: molecules.length }
            ];
            
            categories.forEach(cat => {
                const count = cat.end - cat.start;
                const section = document.createElement('div');
                section.className = 'cat-section open';
                
                const toggle = document.createElement('div');
                toggle.className = 'cat-toggle';
                toggle.innerHTML = `<span class="arrow">▶</span> ${cat.name} <span class="count">(${count})</span>`;
                toggle.addEventListener('click', () => {
                    section.classList.toggle('open');
                });
                
                const body = document.createElement('div');
                body.className = 'cat-body';
                const inner = document.createElement('div');
                inner.className = 'cat-body-inner';
                
                for (let i = cat.start; i < cat.end && i < molecules.length; i++) {
                    const mol = molecules[i];
                    const item = document.createElement('div');
                    item.className = 'mol-item';
                    // Extract name parts: "Water (H₂O)" -> commonName="Water"
                    const parenIdx = mol.name.lastIndexOf('(');
                    const commonName = parenIdx > 0 ? mol.name.substring(0, parenIdx).trim() : mol.name;
                    item.innerHTML = `<span class="mol-formula">${mol.formula}</span><span class="mol-name">${commonName}</span>`;
                    item.addEventListener('click', () => showMolecule(i));
                    item.setAttribute('data-index', i);
                    item.setAttribute('data-search', (mol.name + ' ' + mol.formula).toLowerCase());
                    inner.appendChild(item);
                }
                
                body.appendChild(inner);
                section.appendChild(toggle);
                section.appendChild(body);
                list.appendChild(section);
            });
            
            document.getElementById('total-count').textContent = molecules.length;
            
            const searchInput = document.getElementById('search-input');
            searchInput.addEventListener('input', () => {
                const query = searchInput.value.toLowerCase();
                const sections = list.querySelectorAll('.cat-section');
                
                sections.forEach(section => {
                    let hasVisible = false;
                    const items = section.querySelectorAll('.mol-item');
                    items.forEach(item => {
                        const txt = item.getAttribute('data-search') || '';
                        const visible = txt.includes(query);
                        item.style.display = visible ? '' : 'none';
                        if (visible) hasVisible = true;
                    });
                    section.style.display = hasVisible ? '' : 'none';
                    // Auto-expand matching sections
                    if (hasVisible) section.classList.add('open');
                });
            });
        }

        function showMolecule(index) {
            currentMolecule = index;

            // 更新UI
            document.querySelectorAll('.mol-item').forEach(item => {
                const idx = parseInt(item.getAttribute('data-index'));
                item.classList.toggle('active', idx === index);
            });

            // 更新信息面板
            const mol = molecules[index];
            document.getElementById('info-title').textContent = mol.name;
            document.getElementById('info-desc').textContent = mol.desc;
            document.getElementById('info-formula').textContent = mol.formula;
            document.getElementById('info-atoms').textContent = 'Atoms: ' + mol.atoms.length;
            document.getElementById('info-bonds').textContent = 'Bonds: ' + mol.bonds.length;

            // 清除当前分子
            while (moleculeGroup.children.length > 0) {
                moleculeGroup.remove(moleculeGroup.children[0]);
            }

            // 创建新分子
            const isDiagram = (molecules[index].name === '🧬 DNA 3D Structure Diagram');
            if (isDiagram) {
                createDNADiagram();
            } else {
                createMolecule(molecules[index]);
            }
            
            // 进场动画
            moleculeGroup.scale.set(0, 0, 0);
            moleculeGroup.userData = { animTimer: 0, animTarget: 1 };

            // 调整相机位置
            controls.target.set(0, 0, 0);
            if (isDiagram) {
                camera.position.set(0, 15, 35);
            } else {
                camera.position.set(0, 5, 15);
            }
            controls.update();
        }

        function createMolecule(mol) {
            // 计算分子中心
            let centerX = 0, centerY = 0, centerZ = 0;
            mol.atoms.forEach(atom => {
                centerX += atom.x;
                centerY += atom.y;
                centerZ += atom.z;
            });
            centerX /= mol.atoms.length;
            centerY /= mol.atoms.length;
            centerZ /= mol.atoms.length;

            // 创建原子球体
            mol.atoms.forEach((atom, i) => {
                const radius = atomRadii[atom.element] || 0.5;
                const color = atomColors[atom.element] || 0x888888;

                const geometry = new THREE.SphereGeometry(radius, 32, 32);
                const material = new THREE.MeshPhongMaterial({
                    color: color,
                    specular: 0x444444,
                    shininess: 30,
                    emissive: color,
                    emissiveIntensity: 0.1
                });

                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.set(atom.x - centerX, atom.y - centerY, atom.z - centerZ);
                moleculeGroup.add(sphere);

                // 添加原子标签
                addLabel(atom.element, sphere.position.clone());
            });

            // 创建化学键
            mol.bonds.forEach(bond => {
                const [idx1, idx2, bondOrder] = bond;
                const atom1 = mol.atoms[idx1];
                const atom2 = mol.atoms[idx2];

                const start = new THREE.Vector3(
                    atom1.x - centerX,
                    atom1.y - centerY,
                    atom1.z - centerZ
                );
                const end = new THREE.Vector3(
                    atom2.x - centerX,
                    atom2.y - centerY,
                    atom2.z - centerZ
                );

                createBond(start, end, bondOrder || 1);
            });
        }

        function createBond(start, end, bondOrder) {
            const direction = new THREE.Vector3().subVectors(end, start);
            const length = direction.length();
            direction.normalize();

            if (bondOrder === 1) {
                // 单键
                createCylinder(start, end, 0.08);
            } else if (bondOrder === 2) {
                // 双键
                const offset = new THREE.Vector3().crossVectors(direction, new THREE.Vector3(0, 1, 0));
                if (offset.length() < 0.01) {
                    offset.crossVectors(direction, new THREE.Vector3(1, 0, 0));
                }
                offset.normalize().multiplyScalar(0.15);

                createCylinder(
                    new THREE.Vector3().addVectors(start, offset),
                    new THREE.Vector3().addVectors(end, offset),
                    0.06
                );
                createCylinder(
                    new THREE.Vector3().addVectors(start, offset).negate().add(start).add(offset),
                    new THREE.Vector3().addVectors(end, offset).negate().add(end).add(offset),
                    0.06
                );
            } else if (bondOrder === 3) {
                // 三键
                const offset = new THREE.Vector3().crossVectors(direction, new THREE.Vector3(0, 1, 0));
                if (offset.length() < 0.01) {
                    offset.crossVectors(direction, new THREE.Vector3(1, 0, 0));
                }
                offset.normalize();

                createCylinder(start, end, 0.05);
                createCylinder(
                    new THREE.Vector3().addVectors(start, offset.clone().multiplyScalar(0.18)),
                    new THREE.Vector3().addVectors(end, offset.clone().multiplyScalar(0.18)),
                    0.05
                );
                createCylinder(
                    new THREE.Vector3().addVectors(start, offset.clone().multiplyScalar(-0.18)),
                    new THREE.Vector3().addVectors(end, offset.clone().multiplyScalar(-0.18)),
                    0.05
                );
            }
        }

        function createCylinder(start, end, radius) {
            const direction = new THREE.Vector3().subVectors(end, start);
            const length = direction.length();
            
            const geometry = new THREE.CylinderGeometry(radius, radius, length, 16);
            const material = new THREE.MeshPhongMaterial({
                color: 0xaaaaaa,
                specular: 0x222222,
                shininess: 20
            });
            
            const cylinder = new THREE.Mesh(geometry, material);
            
            const center = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
            cylinder.position.copy(center);
            
            const axis = new THREE.Vector3(0, 1, 0);
            const dir = direction.clone().normalize();
            const quaternion = new THREE.Quaternion().setFromUnitVectors(axis, dir);
            cylinder.quaternion.copy(quaternion);
            
            moleculeGroup.add(cylinder);
        }

        function addLabel(text, position) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 64;
            canvas.height = 64;

            context.fillStyle = 'white';
            context.font = 'bold 40px Arial';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText(text, 32, 32);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                opacity: 0.9
            });

            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.position.copy(position);
            sprite.scale.set(0.6, 0.6, 0.6);
            moleculeGroup.add(sprite);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // 30fps limit to reduce GPU usage
            const now = performance.now();
            if (!animate.lastTime) animate.lastTime = 0;
            if (now - animate.lastTime < 33) return;
            animate.lastTime = now;
            
            controls.update();

            // 分子自动旋转 (速度 1.5x)
            moleculeGroup.rotation.y += 0.01;
            
            // 进场缩放动画
            if (moleculeGroup.userData && moleculeGroup.userData.animTimer < 1) {
                moleculeGroup.userData.animTimer += 0.04;
                const t = Math.min(moleculeGroup.userData.animTimer, 1);
                // easeOutBack
                const c1 = 1.70158;
                const c3 = c1 + 1;
                const val = 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
                moleculeGroup.scale.setScalar(val);
            }

            renderer.render(scene, camera);
        }

        // 初始化
        init();
    </script>
</body>
</html>
